schema: mediahub.astra-gold.executor-routing.v3
system: ASTRA_GOLD
status: ASTRA_GOLD_QUALIFICATION_GATED
node: mh-dev-01
controller: mh-dev-01
qualification_authority: ASTRA_GOLD

executors:
  - id: CODEX_FCC
    client: codex
    transport: fcc
    launcher: fcc-codex
    authority: executor-only
  - id: CLAUDE_FCC
    client: claude
    transport: fcc
    launcher: fcc-claude
    authority: executor-only
  - id: CODEX_OMNIROUTE
    client: codex
    transport: omniroute
    launcher: omniroute
    authority: executor-only
  - id: CLAUDE_OMNIROUTE
    client: claude
    transport: omniroute
    launcher: omniroute
    authority: executor-only
  - id: CLAUDE_CODE_DIRECT
    client: claude_code
    transport: native
    launcher: claude
    authority: executor-only

auxiliary:
  - id: ECC_LOCAL_ASSISTANT
    role: local-assistant-support
    authority: none
    credential_creation: false
    provider_selection: false
    state_authority: false

routing:
  selection_requires:
    - whole_system_astrogold_admission
    - executable_identity
    - provider_identity
    - exact_source_sha
    - non_mutating_marker_probe
    - 23_round_pass_record
    - isolated_workspace
    - independent_a3_verification
  concurrency:
    max_parallel: 3
    require_disjoint_claims: true
    shared_surfaces: serialized

qualification:
  rounds_minimum: 23
  mandatory_executor_paths: [CODEX_FCC, CLAUDE_FCC, CODEX_OMNIROUTE, CLAUDE_OMNIROUTE, CLAUDE_CODE_DIRECT]
  qualification_scope: whole_system
  stdin: /dev/null
  timeout_required: true
  marker_required: true
  credentials_in_git: false
  quota_bypass: false
  historical_evidence_reuse: false

failure:
  missing_launcher: BLOCKED
  auth_or_policy_denial: BLOCKED
  target_sha_mismatch: BLOCKED
  executor_identity_mismatch: BLOCKED
  worker_identity_mismatch: BLOCKED
  stale_evidence: BLOCKED
  timeout: FAILED
  nonzero_exit: FAILED
  malformed_result: REJECTED
  transport_uncertainty: RECONCILIATION_REQUIRED

security:
  seven_b_model_allowed: false
