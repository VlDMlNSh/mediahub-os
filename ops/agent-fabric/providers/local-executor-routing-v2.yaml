schema: mediahub.astra-gold.executor-routing.v3
system: ASTRA_GOLD
status: ASTRA_GOLD_QUALIFICATION_GATED

controller:
  node_id: mh-dev-01
  role: github-transport-controller
  authority: A0-ASTRA
  max_parallel_controller_tasks: 1

execution_pools:
  - node_id: mh-dev-02
    role: primary-local-executor-pool
    providers: [CODEX_LOCAL_FCC, CLAUDE_LOCAL_FCC]
    model: qwen2.5-coder:3b
    max_parallel_executors: 2
    require_disjoint_claims: true
  - node_id: Voktors-Mac-mini.local
    role: fast-local-worker-pool
    providers: [CODEX_LOCAL_FCC, CLAUDE_LOCAL_FCC]
    model: qwen2.5-coder:1.5b
    max_parallel_executors: 2
    require_disjoint_claims: true

routing:
  controller_to_executor: github-transport
  command_path: control/commands/<node>.json
  result_path: control/results/<node>.json
  result_branch: astra-node/<node>
  selection_requires:
    - task_id
    - claim_id
    - owner_id
    - generation
    - target_sha
    - provider
    - workspace
    - qualified_executor
    - fresh_evidence
  shared_surfaces: serialized
  main_branch_direct_write: false

qualification:
  whole_system: true
  rounds_minimum: 23
  require_a2_execution_pass: true
  historical_evidence_reuse: false
  marker_required: true
  timeout_required: true
  stdin: /dev/null

security:
  create_credentials: false
  expose_credentials: false
  quota_bypass: false
  seven_b_model_allowed: false

failure:
  missing_launcher: BLOCKED
  auth_or_policy_denial: BLOCKED
  target_sha_mismatch: BLOCKED
  executor_identity_mismatch: BLOCKED
  worker_identity_mismatch: BLOCKED
  stale_evidence: BLOCKED
  timeout: FAILED
  nonzero_exit: FAILED
  malformed_result: REJECTED
  transport_uncertainty: RECONCILIATION_REQUIRED
