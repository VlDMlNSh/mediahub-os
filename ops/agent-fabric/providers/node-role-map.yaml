schema: mediahub.agent-fabric.node-role-map.v2
controller:
  node_id: mh-dev-01
  agent_id: A0-ASTRA
  role: github-transport-controller
  max_parallel_controller_tasks: 1
execution_pools:
  - node_id: mh-dev-01
    role: controller-local-executor-lane
    runner_label: mediahub-control
    providers:
      - CLAUDE_LOCAL_FCC
    model: qwen2.5-coder:3b
    executor: claude
    max_parallel_executors: 1
    require_disjoint_claims: true
  - node_id: mh-dev-02
    role: primary-local-executor-pool
    runner_label: mediahub-provider
    providers:
      - CODEX_LOCAL_FCC
    model: qwen2.5-coder:3b
    executor: codex
    max_parallel_executors: 1
    require_disjoint_claims: true
  - node_id: Voktors-Mac-mini.local
    role: fast-local-executor-pool
    runner_label: astra-control
    providers:
      - CLAUDE_LOCAL_FCC
    model: qwen2.5-coder:1.5b
    executor: claude
    max_parallel_executors: 1
    require_disjoint_claims: true
routing:
  controller_to_executor: github-transport
  command_path: control/commands/<node>.json
  result_path: control/results/<node>.json
  result_branch: astra-node/<node>
fencing:
  required:
    - task_id
    - claim_id
    - owner_id
    - generation
    - target_sha
    - provider
    - workspace
security:
  create_credentials: false
  expose_credentials: false
  quota_bypass: false
  main_branch_direct_write: false
concurrency:
  max_parallel_claims: 3
  permanent_executor_lanes: 3
  shared_surfaces_serialized: true
