schema: mediahub-capability-terminal-verification-matrix-v1
status: PARTIAL_BASELINE
purpose: >-
  Deterministic terminal verification/acceptance ledger for CAP-001..CAP-058.
  Absence of evidence is a VERIFICATION_GAP and never FUNCTION_LOSS.
  Existing historical F-* identifiers are preserved and may be attached as evidence.
gate_separation:
  functional_baseline: CONFIRMED_ACCEPTED
  capability_verification: PARTIAL
  acceptance_evidence: PARTIAL
  master_architecture_acceptance: NOT_ACCEPTED
  production_authorization: BLOCKED
status_vocabulary:
  VERIFIED: direct verification evidence identified
  ACCEPTED: authoritative acceptance evidence identified
  VERIFIED_ACCEPTANCE_GAP: verification exists or is inferable but terminal acceptance evidence is incomplete
  VERIFICATION_GAP: no direct terminal verification evidence currently materialized
  EVIDENCE_GAP: historical evidence may exist outside accessible corpus
  DEFERRED: technical verification detail intentionally deferred
  UNKNOWN: evidence availability unresolved
rules:
  - CAP identifiers are canonical and immutable.
  - Every CAP must have one canonical owner.
  - Verification evidence must not be invented from architecture prose.
  - Acceptance evidence must identify authoritative acceptance state/authority when available.
  - Historical F-* identifiers are legacy evidence labels, not globally unique IDs.
  - Missing F-* evidence never downgrades the capability baseline.
  - Master Architecture acceptance is a separate gate from capability acceptance.
coverage_summary:
  total_capabilities: 58
  terminal_verified: 0
  terminal_accepted: 0
  partial_or_gap: 58
  evidence_backed_capabilities: >-
    CAPs intersecting the currently accessible acceptance corpus include
    presence/context, identity/access, security/trust, energy, remote/mobile/cloud
    escalation, personal media library, surveillance recording, media playback/live
    streaming, audio, phone media endpoint, and HDMI/display output.
  note: >-
    The current corpus is materially useful but does not prove terminal verification
    and immutable acceptance for all 58 capabilities.
