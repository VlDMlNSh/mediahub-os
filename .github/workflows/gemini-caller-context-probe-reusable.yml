name: MediaHub Contour A — read-only reusable caller-context observer

on:
  workflow_call:
    outputs:
      caller_event_name:
        description: "GitHub event name observed inside the reusable workflow"
        value: ${{ jobs.observe.outputs.event_name }}
      caller_workflow_ref:
        description: "GitHub workflow ref observed inside the reusable workflow"
        value: ${{ jobs.observe.outputs.workflow_ref }}
      caller_trusted_controller:
        description: "Whether the observed caller matches the exact trusted controller"
        value: ${{ jobs.observe.outputs.trusted_controller }}

# No token permissions, secrets, external actions, provider or model invocation.
permissions: {}

jobs:
  observe:
    name: Observe caller context only
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      event_name: ${{ steps.observe.outputs.event_name }}
      workflow_ref: ${{ steps.observe.outputs.workflow_ref }}
      trusted_controller: ${{ steps.observe.outputs.trusted_controller }}
    steps:
      - id: observe
        name: Record immutable caller context
        shell: bash
        env:
          EXPECTED_CONTROLLER_REF: 'VlDMlNSh/mediahub-os/.github/workflows/gemini-batch-dispatch-controller.yml@refs/heads/main'
        run: |
          set -euo pipefail
          printf 'event_name=%s\n' "$GITHUB_EVENT_NAME" >> "$GITHUB_OUTPUT"
          printf 'workflow_ref=%s\n' "$GITHUB_WORKFLOW_REF" >> "$GITHUB_OUTPUT"
          trusted_controller=false
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_WORKFLOW_REF" == "$EXPECTED_CONTROLLER_REF" ]]; then
            trusted_controller=true
          fi
          printf 'trusted_controller=%s\n' "$trusted_controller" >> "$GITHUB_OUTPUT"
