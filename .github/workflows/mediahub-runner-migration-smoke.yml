name: MediaHub runner migration smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-smoke:
    name: mh-dev-01-v2 migration smoke
    runs-on: [self-hosted, mediahub-runner]
    timeout-minutes: 10
    steps:
      - name: Checkout fixed verification target
        uses: actions/checkout@v4
        with:
          ref: implementation/p0-06-core-runtime-services
          fetch-depth: 1

      - name: Verify runner identity and privilege boundary
        shell: bash
        run: |
          set -eu
          test "$(id -un)" = "mediahub-runner"
          test "$(id -u)" = "1001"
          test "$(id -g)" = "1001"
          test "$(hostname)" = "mh-dev-01"
          if sudo -n true >/dev/null 2>&1; then
            echo 'ERROR: runner has passwordless sudo capability'
            exit 1
          fi
          echo "user=$(id -un)"
          echo "uid=$(id -u)"
          echo "gid=$(id -g)"
          echo "host=$(hostname)"
          echo 'sudo_noninteractive=denied'

      - name: Verify repository and fixed target
        shell: bash
        run: |
          set -eu
          expected='6191a6f56892d4aeb1444d04420a3665b989b896'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          test -z "$(git status --short)"
          echo "verified_commit=$actual"
          echo 'worktree=clean'

      - name: Targeted lifecycle verification
        shell: bash
        run: |
          set -eu
          PYTHONPATH=runtime:. python3 -m unittest tests.runtime.test_lifecycle_service -v

      - name: Final migration smoke state
        if: ${{ always() }}
        shell: bash
        run: |
          set -u
          echo '=== MIGRATION SMOKE RESULT ==='
          echo "host=$(hostname)"
          echo "user=$(id -un)"
          echo "uid=$(id -u)"
          echo "commit=$(git rev-parse HEAD 2>/dev/null || echo unavailable)"
          echo 'worktree:'
          git status --short 2>/dev/null || true
