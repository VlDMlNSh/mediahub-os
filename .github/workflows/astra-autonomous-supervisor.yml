name: Astra autonomous queue supervisor
# Triggered after controller-hardening merge to execute a fresh fail-closed qualification wave.

on:
  push:
    branches: [main]
    paths:
      - "control/commands/**"
      - "astra_github_agent.py"
      - "ops/qualification/**"
      - "tests/test_mesh_registry_contract.py"
      - ".github/workflows/astra-autonomous-supervisor.yml"
      - ".github/workflows/astra-distributed-verification.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: astra-autonomous-supervisor-v2
  cancel-in-progress: false

jobs:
  prepare-command:
    name: Prepare and sign authoritative Astra command
    runs-on: [self-hosted, linux, x64, mediahub-control]
    outputs:
      command_id: ${{ steps.command.outputs.command_id }}
    timeout-minutes: 15
    env:
      ASTRA_STATE_DIR: "${{ github.workspace }}/.astra-state"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
          persist-credentials: false
      - name: Resolve canonical node
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "mh-dev-01"
          test "$(id -un)" = "mediahub-runner"
      - name: Materialize and sign fresh command
        id: command
        shell: bash
        env:
          ASTRA_NODE_HMAC_KEY_MH_DEV_01: ${{ secrets.ASTRA_NODE_HMAC_KEY_MH_DEV_01 }}
        run: |
          set -euo pipefail
          mkdir -p control/commands
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          node="mh-dev-01"
          command_id=f"MH-AUTONOMOUS-GOLD-{node}-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          p=Path("control/commands")/f"{node}.json"
          p.write_text(json.dumps({
              "schema_version":"mediahub.astra.control-command.v1",
              "command_id":command_id,
              "node_id":node,
              "operation":"autonomous_gold_mission",
              "target_sha":os.environ["GITHUB_SHA"],
              "workflow_only":False,
              "owned_paths":["architecture","ops/agent-fabric","ops/qualification","control/qualification"],
              "title":"Autonomous ASTRA GOLD qualification wave on mh-dev-01",
              "description":"Run the canonical autonomous qualification queue, generate fresh evidence, and advance only through fail-closed A0-A3 qualification gates. Never bypass launch authority.",
              "exclusive_actions":["execute"],
              "issued_at":int(time.time())
          },indent=2)+"\n",encoding="utf-8")
          print(f"command_id={command_id}")
          Path(os.environ["GITHUB_OUTPUT"]).write_text(f"command_id={command_id}\n",encoding="utf-8")
          PY
          python3 ops/control/sign_command.py control/commands/mh-dev-01.json
      - name: Publish prepared command artifact
        uses: actions/upload-artifact@v4
        with:
          name: astra-authoritative-command
          path: control/commands/mh-dev-01.json
          if-no-files-found: error
          retention-days: 1

  distributed-verification:
    needs: prepare-command
    uses: ./.github/workflows/astra-distributed-verification.yml
    with:
      command_id: ${{ needs.prepare-command.outputs.command_id }}
      target_sha: ${{ github.sha }}
    secrets:
      ASTRA_NODE_HMAC_KEY_MH_DEV_01: ${{ secrets.ASTRA_NODE_HMAC_KEY_MH_DEV_01 }}
      ASTRA_NODE_HMAC_KEY_MH_DEV_02: ${{ secrets.ASTRA_NODE_HMAC_KEY_MH_DEV_02 }}
      ASTRA_NODE_HMAC_KEY_VOKTORS_MAC: ${{ secrets.ASTRA_NODE_HMAC_KEY_VOKTORS_MAC }}

  supervise:
    needs: distributed-verification
    runs-on: [self-hosted, linux, x64, mediahub-control]
    timeout-minutes: 90
    env:
      ASTRA_ONESHOT: "1"
      ASTRA_AUTONOMOUS_MAX_CYCLES: "5"
      ASTRA_AUTONOMOUS_RETRY_SECONDS: "30"
      ASTRA_QUALIFICATION_TIMEOUT: "87000"
      ASTRA_STATE_DIR: "${{ github.workspace }}/.astra-state"
      ASTRA_PROVIDER_EVIDENCE_PATH: "${{ github.workspace }}/.astra-state/provider-qualification/provider-model.json"
      ASTRA_DEFER_RESULT_PUBLICATION: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
          persist-credentials: false

      - name: Resolve canonical node from runner identity
        shell: bash
        run: |
          set -euo pipefail
          host="$(hostname)"
          user="$(id -un)"
          test "$host" = "mh-dev-01"
          test "$user" = "mediahub-runner"
          {
            echo "ASTRA_NODE_ID=mh-dev-01"
            echo "ASTRA_CANONICAL_WORKTREE=/home/mediahub/astra-work"
          } >> "$GITHUB_ENV"
          mkdir -p "$ASTRA_STATE_DIR"

      - name: Download authoritative signed command artifact
        uses: actions/download-artifact@v4
        with:
          name: astra-authoritative-command
          path: control/commands

      - name: Verify prepared command binding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("control/commands/mh-dev-01.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          expected=f"MH-AUTONOMOUS-GOLD-mh-dev-01-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          assert d["command_id"] == expected
          assert d["node_id"] == "mh-dev-01"
          assert d["operation"] == "autonomous_gold_mission"
          assert d["target_sha"] == os.environ["GITHUB_SHA"]
          assert isinstance(d.get("signature"), str) and len(d["signature"]) == 64
          Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8").write(
              f"ASTRA_NODE_ID=mh-dev-01\n"
              f"ASTRA_COMMAND_ID={d['command_id']}\n"
              f"ASTRA_DISTRIBUTED_EVIDENCE_DIR={os.environ['ASTRA_STATE_DIR']}/distributed-verification/{d['command_id']}\n"
          )
          PY

      - name: Prefetch canonical node result ref
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "+astra-node/${ASTRA_NODE_ID}:refs/remotes/origin/astra-node/${ASTRA_NODE_ID}"

      - name: Download verified distributed evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.distributed-verification.outputs.evidence_artifact }}
          path: .astra-state/distributed-verification

      - name: Download provider qualification evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.distributed-verification.outputs.provider_evidence_artifact }}
          path: .astra-state/provider-qualification

      - name: Execute autonomous qualification wave
        shell: bash
        env:
          ASTRA_WORKTREE: "${{ github.workspace }}"
          ASTRA_WORKFLOW_ONLY: "1"
          ASTRA_DISTRIBUTED_EVIDENCE_DIR: "${{ github.workspace }}/.astra-state/distributed-verification"
          ASTRA_NODE_HMAC_KEY_MH_DEV_01: ${{ secrets.ASTRA_NODE_HMAC_KEY_MH_DEV_01 }}
        run: |
          set -euo pipefail
          python3 astra_github_agent.py

      - name: Validate fresh controller result
        shell: bash
        run: |
          set -euo pipefail
          test -s control/results/mh-dev-01.json
          python3 - <<'PY'
          import json, os
          d=json.load(open("control/results/mh-dev-01.json"))
          result=d.get("result",{})
          expected=f"MH-AUTONOMOUS-GOLD-mh-dev-01-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          assert d.get("command_id") == expected
          assert d.get("node_id") == os.environ["ASTRA_NODE_ID"]
          assert d.get("target_sha") == os.environ["GITHUB_SHA"]
          assert d.get("execution_head") == d.get("target_sha")
          assert d.get("returncode") == 0
          assert result.get("phase") == "autonomous_queue"
          assert result.get("status") == "PASS"
          queue=result.get("queue",{})
          assert queue.get("status") == "PASS"
          assert int(queue.get("workers",0)) >= 1
          assert all(item.get("status") == "VERIFIED" for item in queue.get("results",[]))
          print("ASTRA_AUTONOMOUS_QUEUE_PASS")
          PY

      - name: Stage sanitized controller result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s control/results/mh-dev-01.json
          cp control/results/mh-dev-01.json .astra-state/controller-result.json
          python3 - <<'PY'
          import json
          d=json.load(open(".astra-state/controller-result.json"))
          assert d.get("secret_values") == "SUPPRESSED"
          PY

      - name: Upload sanitized controller result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-node-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: .astra-state/controller-result.json
          if-no-files-found: error
          retention-days: 7

# Fleet-label reconciliation retrigger: registered runner labels aligned 2026-10-05.
# Autonomous qualification retrigger: current main after fleet-label reconciliation.

# Autonomous supervisor retrigger marker: 2026-10-05 fresh queue qualification wave.
# Autonomous supervisor fresh-G4 admission wave: 2026-10-05T19:06Z

# Target-pinned retry hardening retrigger: 2026-10-05.
# Autonomous full-wave retrigger: 2026-10-05T13:xx+03:00


  publish-result:
    if: ${{ always() }}
    needs: supervise
    uses: ./.github/workflows/astra-node-result-publication.yml
    with:
      artifact_name: astra-node-result-${{ github.run_id }}-${{ github.run_attempt }}
      artifact_file: controller-result.json
      node_id: mh-dev-01
      command_id: MH-AUTONOMOUS-GOLD-mh-dev-01-${{ github.run_id }}-${{ github.run_attempt }}
      target_sha: ${{ github.sha }}
