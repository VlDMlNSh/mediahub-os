name: Astra autonomous queue supervisor

on:
  push:
    branches: [main]
    paths:
      - "control/commands/**"
      - "astra_github_agent.py"
      - "ops/qualification/**"
      - "tests/test_mesh_registry_contract.py"
      - ".github/workflows/astra-autonomous-supervisor.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: astra-autonomous-supervisor
  cancel-in-progress: false

jobs:
  distributed-attestation:
    uses: ./.github/workflows/astra-distributed-node-attestations.yml
    with:
      command_id: MH-AUTONOMOUS-GOLD-mh-dev-01-${{ github.run_id }}-${{ github.run_attempt }}
      target_sha: ${{ github.sha }}
    secrets:
      ASTRA_COMMAND_HMAC_KEY: ${{ secrets.ASTRA_COMMAND_HMAC_KEY }}

  supervise:
    needs: distributed-attestation
    runs-on: [self-hosted, linux, x64, mh-dev-01-canonical]
    timeout-minutes: 90
    env:
      ASTRA_ONESHOT: "1"
      ASTRA_AUTONOMOUS_MAX_CYCLES: "5"
      ASTRA_AUTONOMOUS_RETRY_SECONDS: "30"
      ASTRA_QUALIFICATION_TIMEOUT: "87000"
      ASTRA_STATE_DIR: "${{ github.workspace }}/.astra-state"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Resolve canonical node from runner identity
        shell: bash
        run: |
          set -euo pipefail
          host="$(hostname)"
          user="$(id -un)"
          test "$host" = "mh-dev-01"
          test "$user" = "mediahub-runner"
          {
            echo "ASTRA_NODE_ID=mh-dev-01"
            echo "ASTRA_CANONICAL_WORKTREE=/home/mediahub/astra-work"
          } >> "$GITHUB_ENV"
          mkdir -p "$ASTRA_STATE_DIR"

      - name: Materialize fresh autonomous qualification command
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          node=os.environ["ASTRA_NODE_ID"]
          command_id=f"MH-AUTONOMOUS-GOLD-{node}-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          p=Path("control/commands")/f"{node}.json"
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps({
              "schema_version": "mediahub.astra.control-command.v1",
              "command_id": command_id,
              "node_id": node,
              "operation": "autonomous_gold_mission",
              "target_sha": os.environ["GITHUB_SHA"],
              "workflow_only": False,
              "owned_paths": ["architecture", "ops/agent-fabric", "ops/qualification", "control/qualification"],
              "title": "Autonomous ASTRA GOLD qualification wave on mh-dev-01",
              "description": "Run the canonical autonomous qualification queue, generate fresh evidence, and advance only through fail-closed A0-A3 qualification gates. Never bypass launch authority.",
              "exclusive_actions": ["execute"],
              "issued_at": int(time.time()),
          }, indent=2)+"\n", encoding="utf-8")
          print(f"node={node} command_id={command_id}")
          Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8").write(
              f"ASTRA_COMMAND_ID={command_id}\n"
              f"ASTRA_DISTRIBUTED_EVIDENCE_DIR={os.environ['ASTRA_STATE_DIR']}/distributed-verification/{command_id}\n"
          )

      - name: Authoritatively sign current control command
        shell: bash
        env:
          ASTRA_COMMAND_HMAC_KEY: ${{ secrets.ASTRA_COMMAND_HMAC_KEY }}
        run: |
          set -euo pipefail
          test -n "${ASTRA_COMMAND_HMAC_KEY}"
          command="control/commands/${ASTRA_NODE_ID}.json"
          test -f "$command"
          python3 ops/control/sign_command.py "$command"

      - name: Download fresh distributed attestation from mh-dev-02
        uses: actions/download-artifact@v4
        with:
          name: astra-dist-mh-dev-02
          path: ${{ github.workspace }}/.astra-state/distributed-verification/MH-AUTONOMOUS-GOLD-mh-dev-01-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Download fresh distributed attestation from Voktors-Mac-mini.local
        uses: actions/download-artifact@v4
        with:
          name: astra-dist-voktors-mac
          path: ${{ github.workspace }}/.astra-state/distributed-verification/MH-AUTONOMOUS-GOLD-mh-dev-01-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Prefetch canonical node result ref
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "+astra-node/${ASTRA_NODE_ID}:refs/remotes/origin/astra-node/${ASTRA_NODE_ID}"

      - name: Execute autonomous qualification wave
        shell: bash
        env:
          ASTRA_WORKTREE: "${{ github.workspace }}"
          ASTRA_WORKFLOW_ONLY: "1"
          ASTRA_COMMAND_HMAC_KEY: ${{ secrets.ASTRA_COMMAND_HMAC_KEY }}
          SILICONFLOW_API_KEY_1: ${{ secrets.SILICONFLOW_API_KEY_1 }}
          SILICONFLOW_API_KEY_2: ${{ secrets.SILICONFLOW_API_KEY_2 }}
          NOVITA_API_KEY_1: ${{ secrets.NOVITA_API_KEY_1 }}
          NOVITA_API_KEY_2: ${{ secrets.NOVITA_API_KEY_2 }}
          ZAI_API_KEY_1: ${{ secrets.ZAI_API_KEY_1 }}
          ZAI_API_KEY_2: ${{ secrets.ZAI_API_KEY_2 }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          AIONLABS_API_KEY: ${{ secrets.AIONLABS_API_KEY }}
          CLOUDFLARE_API_TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN_1 }}
          CLOUDFLARE_API_TOKEN_2: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
          CLOUDFLARE_ACCOUNT_ID_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_1 }}
          CLOUDFLARE_ACCOUNT_ID_2: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_2 }}
          NARAROUTER_API_KEY_1: ${{ secrets.NARAROUTER_API_KEY_1 }}
          NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
          ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
          UNOROUTER_API_KEY: ${{ secrets.UNOROUTER_API_KEY }}
          ZEROUTER_API_KEY: ${{ secrets.ZEROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY_1: ${{ secrets.MISTRAL_API_KEY_1 }}
          MISTRAL_API_KEY_2: ${{ secrets.MISTRAL_API_KEY_2 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python3 astra_github_agent.py

      - name: Verify fresh result publication
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if git fetch origin "+astra-node/${ASTRA_NODE_ID}:refs/remotes/origin/astra-node/${ASTRA_NODE_ID}"; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "BLOCK: unable to fetch node result branch after bounded retries"
              exit 1
            fi
            sleep "$((2 ** (attempt - 1)))"
          done
          git show "origin/astra-node/${ASTRA_NODE_ID}:control/results/${ASTRA_NODE_ID}.json" > /tmp/astra-result.json
          python3 - <<'PY'
          import json
          import os
          d=json.load(open("/tmp/astra-result.json"))
          expected_command_id=f"MH-AUTONOMOUS-GOLD-{os.environ['ASTRA_NODE_ID']}-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          result=d.get("result",{})
          print(json.dumps({
              "command_id": d.get("command_id"),
              "node_id": d.get("node_id"),
              "returncode": d.get("returncode"),
              "phase": result.get("phase"),
              "status": result.get("status"),
              "cycles": len(result.get("steps",[])),
              "execution_head": d.get("execution_head"),
          }, sort_keys=True))
          assert d.get("command_id") == expected_command_id
          assert d.get("node_id") == os.environ["ASTRA_NODE_ID"]
          assert d.get("target_sha") == os.environ["GITHUB_SHA"]
          assert d.get("returncode") == 0
          phase=result.get("phase")
          status=result.get("status")
          assert phase == "autonomous_queue"
          assert status == "PASS"
          queue=result.get("queue", {})
          assert isinstance(queue, dict)
          assert queue.get("status") == "PASS"
          assert int(queue.get("workers", 0)) >= 1
          assert all(item.get("status") == "VERIFIED" for item in queue.get("results", []))
          PY
