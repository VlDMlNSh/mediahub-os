name: Astra stale run reaper

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/astra-stale-supervisor-run-reaper.yml"
      - ".github/workflows/astra-autonomous-supervisor.yml"
      - ".github/workflows/astra-local-claude-qualification.yml"
      - ".github/workflows/mh25-dual-local-executor-23wave.yml"
      - "ops/agent-fabric/**"
      - "runtime/mediahub_runtime/autonomous_queue.py"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: astra-stale-run-reaper
  cancel-in-progress: false

jobs:
  reap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel Astra runs pinned to older source SHAs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/astra-reaper-paths
          print("\n".join([
              ".github/workflows/astra-autonomous-supervisor.yml",
              ".github/workflows/astra-local-claude-qualification.yml",
              ".github/workflows/mh25-dual-local-executor-23wave.yml",
              ".github/workflows/astra-distributed-local-worker.yml",
          ]))
          PY
          current="\$(gh api "/repos/\${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test -n "$current"
          : > /tmp/astra-stale-ids
          page=1
          while :; do
            payload="\$(gh api "/repos/\${GITHUB_REPOSITORY}/actions/runs?per_page=100&page=\${page}")"
            count="\$(printf '%s' "$payload" | python3 -c 'import json,sys; print(len(json.load(sys.stdin).get("workflow_runs", [])))')"
            [ "$count" -gt 0 ] || break
            printf '%s' "$payload" | python3 -c '
import json,sys
allowed=set(open("/tmp/astra-reaper-paths",encoding="utf-8").read().splitlines())
for run in json.load(sys.stdin).get("workflow_runs", []):
    if run.get("path") in allowed and run.get("head_sha") != "'"\$current"'" and run.get("status") in {"queued","in_progress","pending","waiting"}:
        print(run["id"])
'
            [ "$count" -lt 100 ] && break
            page=\$((page + 1))
          done
          sort -u /tmp/astra-stale-ids | while read -r run_id; do
            [ -z "$run_id" ] && continue
            echo "cancelling stale Astra run=$run_id"
            if gh api -X POST "/repos/\${GITHUB_REPOSITORY}/actions/runs/\${run_id}/cancel" >/dev/null; then
              echo "cancel_request=PASS run=$run_id"
            else
              echo "cancel_request=BLOCKED run=$run_id"
              exit 2
            fi
          done
          echo "current_sha=${current}"
          echo "stale_reaper=PASS"
