name: Astra stale run reaper

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/astra-stale-supervisor-run-reaper.yml"
      - ".github/workflows/astra-autonomous-supervisor.yml"
      - ".github/workflows/astra-local-claude-qualification.yml"
      - ".github/workflows/mh25-dual-local-executor-23wave.yml"
      - "ops/agent-fabric/**"
      - "runtime/mediahub_runtime/autonomous_queue.py"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: astra-stale-run-reaper
  cancel-in-progress: false

jobs:
  reap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel Astra runs pinned to older source SHAs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/astra-reaper-paths
          print("\n".join([
              ".github/workflows/astra-autonomous-supervisor.yml",
              ".github/workflows/astra-local-claude-qualification.yml",
              ".github/workflows/mh25-dual-local-executor-23wave.yml",
              ".github/workflows/astra-distributed-local-worker.yml",
          ]))
          PY
          current="${GITHUB_SHA}"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" > /tmp/astra-all-runs.json
          python3 - "${current}" <<'PY' > /tmp/astra-stale-ids
          import json,sys
          current=sys.argv[1]
          allowed=set()
          for raw in open("/tmp/astra-reaper-paths",encoding="utf-8"):
              value=raw.strip()
              if value: allowed.add(value)
          data=json.load(open("/tmp/astra-all-runs.json",encoding="utf-8"))
          for run in data.get("workflow_runs",[]):
              if run.get("path") not in allowed:
                  continue
              if run.get("status") not in {"queued","in_progress","pending","waiting"}:
                  continue
              if run.get("head_sha")==current:
                  continue
              print(run["id"])
          PY
          sort -u /tmp/astra-stale-ids | while read -r run_id; do
            [ -z "$run_id" ] && continue
            echo "cancelling stale Astra run=$run_id"
            gh api -X POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null || true
          done
          echo "current_sha=${current}"
          echo "stale_reaper=PASS"
