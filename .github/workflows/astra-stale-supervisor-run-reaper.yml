name: Astra stale run reaper

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/astra-stale-supervisor-run-reaper.yml"
      - ".github/workflows/astra-autonomous-supervisor.yml"
      - ".github/workflows/astra-local-claude-qualification.yml"
      - ".github/workflows/mh25-dual-local-executor-23wave.yml"
      - "ops/agent-fabric/**"
      - "runtime/mediahub_runtime/autonomous_queue.py"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: astra-stale-run-reaper
  cancel-in-progress: false

jobs:
  reap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel Astra runs pinned to older source SHAs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/astra-reaper-paths
          print("\n".join([
              ".github/workflows/astra-autonomous-supervisor.yml",
              ".github/workflows/astra-local-claude-qualification.yml",
              ".github/workflows/mh25-dual-local-executor-23wave.yml",
              ".github/workflows/astra-distributed-local-worker.yml",
          ]))
          PY
          current="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test -n "$current"
          : > /tmp/astra-stale-ids
          for workflow in "${allowed[@]}"; do
            gh run list --workflow "${workflow}" --limit 100 --json databaseId,headSha,status \
              --jq '.[] | select(.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "waiting") | [.databaseId,.headSha] | @tsv' \
              | while IFS=$'\\t' read -r run_id run_sha; do
                  [ -z "$run_id" ] && continue
                  if [ "$run_sha" != "$current" ]; then
                    echo "$run_id"
                  fi
                done
          done
          sort -u /tmp/astra-stale-ids | while read -r run_id; do
            [ -z "$run_id" ] && continue
            echo "cancelling stale Astra run=$run_id"
            gh api -X POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null || true
          done
          echo "current_sha=${current}"
          echo "stale_reaper=PASS"
