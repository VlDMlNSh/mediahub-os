name: Astra stale run reaper

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/astra-stale-supervisor-run-reaper.yml"
      - ".github/workflows/astra-autonomous-supervisor.yml"
      - ".github/workflows/astra-local-claude-qualification.yml"
      - ".github/workflows/astra-distributed-local-worker.yml"
      - "ops/agent-fabric/**"
      - "runtime/mediahub_runtime/autonomous_queue.py"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: astra-stale-run-reaper
  cancel-in-progress: false

jobs:
  reap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel Astra runs pinned to older source SHAs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_SHA: ""
        shell: bash
        run: |
          set -euo pipefail
          export CURRENT_SHA
          python3 - <<'PY'
          import json, os, subprocess, sys
          repo=os.environ["GH_REPO"]
          current=os.environ["CURRENT_SHA"].strip()
          allowed={
              ".github/workflows/astra-autonomous-supervisor.yml",
              ".github/workflows/astra-local-claude-qualification.yml",
              ".github/workflows/mh25-dual-local-executor-23wave.yml",
              ".github/workflows/astra-distributed-local-worker.yml",
          }
          if not current:
              resolved=subprocess.run(
                  ["gh","api",f"/repos/{repo}/git/ref/heads/main","--jq",".object.sha"],
                  text=True,capture_output=True,check=False,
              )
              if resolved.returncode:
                  print(resolved.stderr[-4000:],file=sys.stderr)
                  raise SystemExit("main_head_resolution_failed")
              current=resolved.stdout.strip()
          if not current:
              raise SystemExit("current_sha_missing")
          stale=[]
          for page in range(1, 21):
              p=subprocess.run(
                  ["gh","api",f"/repos/{repo}/actions/runs?per_page=100&page={page}"],
                  text=True,capture_output=True,check=False,
              )
              if p.returncode:
                  print(p.stderr[-4000:],file=sys.stderr)
                  raise SystemExit("actions_api_list_failed")
              payload=json.loads(p.stdout)
              runs=payload.get("workflow_runs",[])
              if not runs:
                  break
              for run in runs:
                  if (
                      run.get("path") in allowed
                      and run.get("head_sha") != current
                      and run.get("status") in {"queued","in_progress","pending","waiting"}
                  ):
                      stale.append(int(run["id"]))
              if len(runs)<100:
                  break
          for run_id in sorted(set(stale)):
              print(f"cancelling stale Astra run={run_id}")
              p=subprocess.run(
                  ["gh","api","-X","POST",f"/repos/{repo}/actions/runs/{run_id}/cancel"],
                  text=True,capture_output=True,check=False,
              )
              if p.returncode:
                  stderr = p.stderr[-4000:]
                  if "HTTP 409" in stderr or "Cannot cancel a workflow run that is completed" in stderr:
                      print(f"cancel_request=NOOP run={run_id} reason=already_completed")
                      continue
                  print(stderr,file=sys.stderr)
                  raise SystemExit(f"cancel_request_failed:{run_id}")
              print(f"cancel_request=PASS run={run_id}")
          print(f"current_sha={current}")
          print("stale_reaper=PASS")
          PY

# Reaper trigger: clear stale supervisor target after executor qualification hardening.

