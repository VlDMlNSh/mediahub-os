name: Astra distributed node attestations

on:
  workflow_call:
    inputs:
      command_id:
        required: true
        type: string
      target_sha:
        required: true
        type: string
    secrets:
      ASTRA_COMMAND_HMAC_KEY:
        required: true

permissions:
  contents: read

jobs:
  mh-dev-02:
    name: Attest mh-dev-02
    runs-on: [self-hosted, linux, x64, mh-dev-02-canonical]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
      - name: Exact node admission
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "mh-dev-02"
          test "$(id -un)" != ""
      - name: Produce signed attestation
        env:
          ASTRA_EXPECTED_NODE_ID: mh-dev-02
          ASTRA_COMMAND_ID: ${{ inputs.command_id }}
          ASTRA_TARGET_SHA: ${{ inputs.target_sha }}
          ASTRA_COMMAND_HMAC_KEY: ${{ secrets.ASTRA_COMMAND_HMAC_KEY }}
          ASTRA_WORKTREE: ${{ github.workspace }}
          ASTRA_NODE_ATTESTATION_OUTPUT: ${{ github.workspace }}/mh-dev-02.json
        run: python3 ops/qualification/produce_distributed_node_attestation.py
      - uses: actions/upload-artifact@v4
        with:
          name: astra-dist-mh-dev-02
          path: mh-dev-02.json
          if-no-files-found: error
          retention-days: 1

  mac:
    name: Attest Voktors-Mac-mini.local
    runs-on: [self-hosted, macOS, ARM64, Voktors-Mac-mini-canonical]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
      - name: Exact node admission
        shell: bash
        run: |
          set -euo pipefail
          host="$(hostname)"
          test "$host" = "Voktors-Mac-mini.local" || test "$host" = "Voktors-Mini.Dlink"
          test "$(id -un)" != ""
      - name: Produce signed attestation
        env:
          ASTRA_EXPECTED_NODE_ID: Voktors-Mac-mini.local
          ASTRA_COMMAND_ID: ${{ inputs.command_id }}
          ASTRA_TARGET_SHA: ${{ inputs.target_sha }}
          ASTRA_COMMAND_HMAC_KEY: ${{ secrets.ASTRA_COMMAND_HMAC_KEY }}
          ASTRA_WORKTREE: ${{ github.workspace }}
          ASTRA_NODE_ATTESTATION_OUTPUT: ${{ github.workspace }}/Voktors-Mac-mini.local.json
        run: python3 ops/qualification/produce_distributed_node_attestation.py
      - uses: actions/upload-artifact@v4
        with:
          name: astra-dist-voktors-mac
          path: Voktors-Mac-mini.local.json
          if-no-files-found: error
          retention-days: 1
