name: MediaHub provider contract verification

on:
  pull_request:
    paths:
      - '.github/ai/**'
      - '.github/agents/**'
      - '.github/workflows/gemini-batch-dispatch-controller.yml'
      - '.github/workflows/gemini-pr-readonly-review-wave471.yml'
      - 'tests/test_gemini_pr_readonly_review_wave471_contract.py'
      - '.github/workflows/mediahub-provider-contract-verification.yml'
      - 'scripts/verify_ai_factory.py'
      - 'tests/ai/test_provider_selector.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: provider contract verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify routing policy
        run: python3 scripts/verify_ai_factory.py
      - name: Run routing policy regression tests
        run: python3 -m unittest tests/ai/test_provider_selector.py -v
