name: MediaHub Gemini workflow contract validation (Wave 284)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install only the YAML parser
        run: python -m pip install --disable-pip-version-check --no-input PyYAML
      - name: Lint trusted controller and all reusable/probe workflows
        run: >-
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          .github/workflows/gemini-batch-dispatch-controller.yml
          .github/workflows/gemini-autonomous-engineering.yml
          .github/workflows/gemini-agent-2.yml
          .github/workflows/gemini-agent-3.yml
          .github/workflows/gemini-fcc-independent-review-wave409.yml
          .github/workflows/gemini-controller-context-probe-wave284.yml
          .github/workflows/gemini-reusable-context-probe-wave284.yml
          .github/workflows/gemini-workflow-contract-validation-wave284.yml
      - name: Run legacy caller-context contracts
        run: python -m unittest discover -s tests -p 'test_gemini_controller_context_probe_wave284_contract.py'
      - name: Run Wave 292 context security contracts
        run: python -m unittest discover -s tests -p 'test_gemini_controller_positive_context_probe_wave292_contract.py'
      - name: Run reusable workflow contracts
        run: python -m unittest discover -s tests -p 'test_gemini_reusable_workflow_contract.py'
      - name: Run controller transport contracts
        run: python -m unittest discover -s tests -p 'test_gemini_transport_controller_contract.py'
      - name: Run executable child HMAC authorization contracts
        run: python -m unittest discover -s tests -p 'test_gemini_child_signed_dispatch_runtime_contract.py'
      - name: Run controller trigger path coverage contracts
        run: python -m unittest discover -s tests -p 'test_gemini_controller_trigger_path_coverage_contract.py'
