name: Astra G4 115-round qualification

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Immutable source SHA to qualify"
        required: true
        type: string
      confirm_qualification:
        description: "Explicit authorization to execute fresh G4 qualification"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: astra-g4-115-${{ inputs.target_sha }}
  cancel-in-progress: false

jobs:
  admission:
    if: ${{ inputs.confirm_qualification == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate immutable qualification target
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_SHA}" = "${{ inputs.target_sha }}"
          test -f control/qualification/g4-115.json
          test -f ops/qualification/verify_g4_115.py
          python3 - <<'PY'
          import json
          c=json.load(open("control/qualification/g4-115.json",encoding="utf-8"))
          assert c["total_rounds"] == 115
          assert c["rounds_per_path"] == 23
          assert c["mandatory_paths"] == ["CODEX_FCC","CLAUDE_FCC","CODEX_OMNIROUTE","CLAUDE_OMNIROUTE","CLAUDE_CODE_DIRECT"]
          print("G4 admission contract OK")
          PY

  codex-fcc:
    needs: admission
    runs-on: [self-hosted, linux, x64, mediahub-provider]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Execute real Codex through FCC — 23 fresh rounds
        shell: bash
        run: |
          set -uo pipefail
          export PATH="/home/mediahub/.local/bin:/home/mediahub/.local/npm/bin:$PATH"
          test "$(hostname)" = "mh-dev-02"; test "$(id -un)" = "mediahub"
          command -v fcc-codex
          command -v codex
          command -v ollama
          ollama show qwen2.5-coder:3b >/dev/null
          set -a; . /home/mediahub/.config/mediahub/fcc.env; set +a
          test "${MODEL:-}" = "ollama/qwen2.5-coder:3b"
          test -n "${ANTHROPIC_AUTH_TOKEN:-}"
          curl -fsS --max-time 5 "http://${HOST:-127.0.0.1}:${PORT:-8093}/health" >/dev/null
          : > g4-CODEX_FCC.jsonl
          for i in $(seq 1 23); do
            cid="G4-CODEX_FCC-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$i"
            marker="G4_CODEX_FCC_OK_$i"
            out="/tmp/g4-codex-fcc-$i.out"; err="/tmp/g4-codex-fcc-$i.err"
            start=$(date +%s)
            set +e
            timeout 300s fcc-codex exec --sandbox read-only --skip-git-repo-check "Return exactly $marker." >"$out" 2>"$err"
            rc=$?; set -e
            end=$(date +%s)
            python3 - "$cid" "$i" "$marker" "$rc" "$start" "$end" "$out" >> g4-CODEX_FCC.jsonl <<'PY'
          import hashlib,json,os,sys
          cid,n,marker,rc,start,end,out=sys.argv[1:]
          item={"command_id":cid,"path":"CODEX_FCC","round":int(n),"source_sha":os.environ["GITHUB_SHA"],"executor_identity":"codex","provider_or_transport_identity":"fcc","workspace":os.getcwd(),"started_at":int(start),"completed_at":int(end),"exit_status":int(rc),"timeout":int(rc)==124,"marker":marker,"marker_present":marker in open(out,encoding="utf-8",errors="replace").read(),"result_schema":"g4-round-v1","verification_status":"PASS" if int(rc)==0 and marker in open(out,encoding="utf-8",errors="replace").read() else "BLOCKED"}
          item["evidence_digest"]="sha256:"+hashlib.sha256(json.dumps(item,sort_keys=True,separators=(",",":")).encode()).hexdigest()
          print(json.dumps(item,sort_keys=True))
          PY
          done
          python3 ops/qualification/build_g4_path_evidence.py CODEX_FCC g4-CODEX_FCC.jsonl ${{ inputs.target_sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4-CODEX_FCC-${{ github.run_id }}
          path: g4-CODEX_FCC.json

  claude-fcc:
    needs: admission
    runs-on: [self-hosted, linux, x64, mediahub-provider]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Execute real Claude Code through FCC — 23 fresh rounds
        shell: bash
        run: |
          set -uo pipefail
          export PATH="/home/mediahub/.local/bin:/home/mediahub/.local/npm/bin:$PATH"
          test "$(hostname)" = "mh-dev-02"; test "$(id -un)" = "mediahub"
          command -v claude; command -v ollama
          ollama show qwen2.5-coder:3b >/dev/null
          set -a; . /home/mediahub/.config/mediahub/fcc.env; set +a
          test "${MODEL:-}" = "ollama/qwen2.5-coder:3b"; test -n "${ANTHROPIC_AUTH_TOKEN:-}"
          host="${HOST:-127.0.0.1}"; port="${PORT:-8093}"
          curl -fsS --max-time 5 "http://$host:$port/health" >/dev/null
          export ANTHROPIC_BASE_URL="http://$host:$port"
          export ANTHROPIC_AUTH_TOKEN="$ANTHROPIC_AUTH_TOKEN"
          export ANTHROPIC_API_KEY="$ANTHROPIC_AUTH_TOKEN"
          export ASTRA_FCC_TRANSPORT="fcc"; export ASTRA_FCC_MODEL="ollama/qwen2.5-coder:3b"
          export CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC="1"
          : > g4-CLAUDE_FCC.jsonl
          for i in $(seq 1 23); do
            cid="G4-CLAUDE_FCC-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$i"; marker="G4_CLAUDE_FCC_OK_$i"
            out="/tmp/g4-claude-fcc-$i.out"; err="/tmp/g4-claude-fcc-$i.err"; start=$(date +%s)
            set +e; timeout 300s claude -p "Return exactly $marker." --output-format text --max-turns 1 >"$out" 2>"$err"; rc=$?; set -e
            end=$(date +%s)
            python3 - "$cid" "$i" "$marker" "$rc" "$start" "$end" "$out" >> g4-CLAUDE_FCC.jsonl <<'PY'
          import hashlib,json,os,sys
          cid,n,marker,rc,start,end,out=sys.argv[1:]
          text=open(out,encoding="utf-8",errors="replace").read()
          item={"command_id":cid,"path":"CLAUDE_FCC","round":int(n),"source_sha":os.environ["GITHUB_SHA"],"executor_identity":"claude","provider_or_transport_identity":"fcc","workspace":os.getcwd(),"started_at":int(start),"completed_at":int(end),"exit_status":int(rc),"timeout":int(rc)==124,"marker":marker,"marker_present":marker in text,"result_schema":"g4-round-v1","verification_status":"PASS" if int(rc)==0 and marker in text else "BLOCKED"}
          item["evidence_digest"]="sha256:"+hashlib.sha256(json.dumps(item,sort_keys=True,separators=(",",":")).encode()).hexdigest()
          print(json.dumps(item,sort_keys=True))
          PY
          done
          python3 ops/qualification/build_g4_path_evidence.py CLAUDE_FCC g4-CLAUDE_FCC.jsonl ${{ inputs.target_sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4-CLAUDE_FCC-${{ github.run_id }}
          path: g4-CLAUDE_FCC.json

  codex-omniroute:
    needs: admission
    runs-on: [self-hosted, linux, x64, mediahub-control]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Execute real Codex through OmniRoute — 23 fresh rounds
        shell: bash
        run: |
          set -uo pipefail
          export PATH="/home/mediahub/.local/bin:/home/mediahub/.local/npm/bin:$PATH"
          test "$(hostname)" = "mh-dev-01"; command -v omniroute; command -v codex
          : > g4-CODEX_OMNIROUTE.jsonl
          for i in $(seq 1 23); do
            cid="G4-CODEX_OMNIROUTE-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$i"; marker="G4_CODEX_OMNIROUTE_OK_$i"
            out="/tmp/g4-codex-omni-$i.out"; err="/tmp/g4-codex-omni-$i.err"; start=$(date +%s)
            set +e; timeout 300s omniroute launch-codex exec --sandbox read-only --skip-git-repo-check "Return exactly $marker." >"$out" 2>"$err"; rc=$?; set -e
            end=$(date +%s)
            python3 - "$cid" "$i" "$marker" "$rc" "$start" "$end" "$out" >> g4-CODEX_OMNIROUTE.jsonl <<'PY'
          import hashlib,json,os,sys
          cid,n,marker,rc,start,end,out=sys.argv[1:]
          text=open(out,encoding="utf-8",errors="replace").read()
          item={"command_id":cid,"path":"CODEX_OMNIROUTE","round":int(n),"source_sha":os.environ["GITHUB_SHA"],"executor_identity":"codex","provider_or_transport_identity":"omniroute","workspace":os.getcwd(),"started_at":int(start),"completed_at":int(end),"exit_status":int(rc),"timeout":int(rc)==124,"marker":marker,"marker_present":marker in text,"result_schema":"g4-round-v1","verification_status":"PASS" if int(rc)==0 and marker in text else "BLOCKED"}
          item["evidence_digest"]="sha256:"+hashlib.sha256(json.dumps(item,sort_keys=True,separators=(",",":")).encode()).hexdigest()
          print(json.dumps(item,sort_keys=True))
          PY
          done
          python3 ops/qualification/build_g4_path_evidence.py CODEX_OMNIROUTE g4-CODEX_OMNIROUTE.jsonl ${{ inputs.target_sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4-CODEX_OMNIROUTE-${{ github.run_id }}
          path: g4-CODEX_OMNIROUTE.json

  claude-omniroute:
    needs: admission
    runs-on: [self-hosted, linux, x64, mediahub-control]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Execute real Claude Code through OmniRoute — 23 fresh rounds
        shell: bash
        run: |
          set -uo pipefail
          export PATH="/home/mediahub/.local/bin:/home/mediahub/.local/npm/bin:$PATH"
          test "$(hostname)" = "mh-dev-01"; command -v omniroute; command -v claude
          : > g4-CLAUDE_OMNIROUTE.jsonl
          for i in $(seq 1 23); do
            cid="G4-CLAUDE_OMNIROUTE-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$i"; marker="G4_CLAUDE_OMNIROUTE_OK_$i"
            out="/tmp/g4-claude-omni-$i.out"; err="/tmp/g4-claude-omni-$i.err"; start=$(date +%s)
            set +e; timeout 300s omniroute launch -- --model qwen2.5-coder:1.5b -p "Return exactly $marker." --output-format text --max-turns 1 >"$out" 2>"$err"; rc=$?; set -e
            end=$(date +%s)
            python3 - "$cid" "$i" "$marker" "$rc" "$start" "$end" "$out" >> g4-CLAUDE_OMNIROUTE.jsonl <<'PY'
          import hashlib,json,os,sys
          cid,n,marker,rc,start,end,out=sys.argv[1:]
          text=open(out,encoding="utf-8",errors="replace").read()
          item={"command_id":cid,"path":"CLAUDE_OMNIROUTE","round":int(n),"source_sha":os.environ["GITHUB_SHA"],"executor_identity":"claude","provider_or_transport_identity":"omniroute","workspace":os.getcwd(),"started_at":int(start),"completed_at":int(end),"exit_status":int(rc),"timeout":int(rc)==124,"marker":marker,"marker_present":marker in text,"result_schema":"g4-round-v1","verification_status":"PASS" if int(rc)==0 and marker in text else "BLOCKED"}
          item["evidence_digest"]="sha256:"+hashlib.sha256(json.dumps(item,sort_keys=True,separators=(",",":")).encode()).hexdigest()
          print(json.dumps(item,sort_keys=True))
          PY
          done
          python3 ops/qualification/build_g4_path_evidence.py CLAUDE_OMNIROUTE g4-CLAUDE_OMNIROUTE.jsonl ${{ inputs.target_sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4-CLAUDE_OMNIROUTE-${{ github.run_id }}
          path: g4-CLAUDE_OMNIROUTE.json

  claude-direct:
    needs: admission
    runs-on: [self-hosted, macOS, ARM64, astra-control]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Execute native Claude Code — 23 fresh rounds
        shell: bash
        run: |
          set -uo pipefail
          command -v claude
          : > g4-CLAUDE_CODE_DIRECT.jsonl
          for i in $(seq 1 23); do
            cid="G4-CLAUDE_CODE_DIRECT-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$i"; marker="G4_CLAUDE_CODE_DIRECT_OK_$i"
            out="/tmp/g4-claude-direct-$i.out"; err="/tmp/g4-claude-direct-$i.err"; start=$(date +%s)
            set +e; timeout 300s claude -p "Return exactly $marker." --output-format text --max-turns 1 >"$out" 2>"$err"; rc=$?; set -e
            end=$(date +%s)
            python3 - "$cid" "$i" "$marker" "$rc" "$start" "$end" "$out" >> g4-CLAUDE_CODE_DIRECT.jsonl <<'PY'
          import hashlib,json,os,sys
          cid,n,marker,rc,start,end,out=sys.argv[1:]
          text=open(out,encoding="utf-8",errors="replace").read()
          item={"command_id":cid,"path":"CLAUDE_CODE_DIRECT","round":int(n),"source_sha":os.environ["GITHUB_SHA"],"executor_identity":"claude_code","provider_or_transport_identity":"native","workspace":os.getcwd(),"started_at":int(start),"completed_at":int(end),"exit_status":int(rc),"timeout":int(rc)==124,"marker":marker,"marker_present":marker in text,"result_schema":"g4-round-v1","verification_status":"PASS" if int(rc)==0 and marker in text else "BLOCKED"}
          item["evidence_digest"]="sha256:"+hashlib.sha256(json.dumps(item,sort_keys=True,separators=(",",":")).encode()).hexdigest()
          print(json.dumps(item,sort_keys=True))
          PY
          done
          python3 ops/qualification/build_g4_path_evidence.py CLAUDE_CODE_DIRECT g4-CLAUDE_CODE_DIRECT.jsonl ${{ inputs.target_sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4-CLAUDE_CODE_DIRECT-${{ github.run_id }}
          path: g4-CLAUDE_CODE_DIRECT.json

  verify:
    needs: [codex-fcc, claude-fcc, codex-omniroute, claude-omniroute, claude-direct]
    if: ${{ always() && inputs.confirm_qualification == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: g4-*-${{ github.run_id }}
          merge-multiple: true
      - name: Build and independently verify canonical 115-round evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 ops/qualification/assemble_g4_evidence.py ${{ inputs.target_sha }} g4-*.json g4-evidence.json
          python3 ops/qualification/verify_g4_115.py g4-evidence.json --expected-sha ${{ inputs.target_sha }}
          cp g4-evidence.json g4-115-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4-115-final-${{ github.run_id }}
          path: |
            g4-115-evidence.json
            g4-evidence.json
