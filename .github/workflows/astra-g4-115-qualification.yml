name: Astra G4 115-round executor matrix

on:
  workflow_dispatch:
    inputs:
      confirm_launch:
        description: "Explicit admission for G4 execution"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: "astra-g4-115-${{ github.sha }}"
  cancel-in-progress: false

jobs:
  admission:
    name: G4 admission gate
    if: ${{ inputs.confirm_launch == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical five-path contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          c=json.load(open("control/qualification/g4-115.json"))
          expected=["CODEX_FCC","CLAUDE_FCC","CODEX_OMNIROUTE","CLAUDE_OMNIROUTE","CLAUDE_CODE_DIRECT"]
          assert c["mandatory_paths"] == expected
          assert c["rounds_per_path"] == 23
          assert c["total_rounds"] == 115
          PY
          python3 -m py_compile ops/qualification/run_g4_round.py ops/qualification/verify_g4_115.py

  codex-fcc:
    needs: admission
    name: CODEX_FCC / mh-dev-02 / qwen3b
    runs-on: [self-hosted, linux, x64, mediahub-provider]
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Canonical admission
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "mh-dev-02"
          test "$(id -un)" = "mediahub"
          command -v fcc-codex
          command -v codex
          command -v ollama
          ollama show qwen2.5-coder:3b >/dev/null
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --short)"
      - name: Execute 23 real FCC Codex rounds
        shell: bash
        run: |
          set -u
          : > g4-CODEX_FCC.jsonl
          for i in $(seq 1 23); do
            python3 ops/qualification/run_g4_round.py --path CODEX_FCC --round "$i" --source-sha "$GITHUB_SHA" --out "round-$i.jsonl"
            cat "round-$i.jsonl" >> g4-CODEX_FCC.jsonl
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4-CODEX_FCC-${{ github.sha }}
          path: g4-CODEX_FCC.jsonl
          if-no-files-found: error

  claude-fcc:
    needs: admission
    name: CLAUDE_FCC / mh-dev-01 / qwen1.5b
    runs-on: [self-hosted, linux, x64, mediahub-control]
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Canonical admission
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "mh-dev-01"
          test "$(id -un)" = "mediahub-runner"
          export PATH="/home/mediahub/.local/bin:/home/mediahub/.local/npm/bin:$PATH"
          command -v fcc-claude
          command -v claude
          command -v ollama
          ollama show qwen2.5-coder:1.5b >/dev/null
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --short)"
      - name: Execute 23 real FCC Claude rounds
        shell: bash
        run: |
          set -u
          : > g4-CLAUDE_FCC.jsonl
          for i in $(seq 1 23); do
            python3 ops/qualification/run_g4_round.py --path CLAUDE_FCC --round "$i" --source-sha "$GITHUB_SHA" --out "round-$i.jsonl"
            cat "round-$i.jsonl" >> g4-CLAUDE_FCC.jsonl
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4-CLAUDE_FCC-${{ github.sha }}
          path: g4-CLAUDE_FCC.jsonl
          if-no-files-found: error

  codex-omniroute:
    needs: admission
    name: CODEX_OMNIROUTE / mh-dev-02 / qwen3b
    runs-on: [self-hosted, linux, x64, mediahub-provider]
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Canonical admission
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "mh-dev-02"
          test "$(id -un)" = "mediahub"
          command -v omniroute
          command -v codex
          command -v ollama
          ollama show qwen2.5-coder:3b >/dev/null
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --short)"
      - name: Execute 23 real OmniRoute Codex rounds
        shell: bash
        run: |
          set -u
          : > g4-CODEX_OMNIROUTE.jsonl
          for i in $(seq 1 23); do
            python3 ops/qualification/run_g4_round.py --path CODEX_OMNIROUTE --round "$i" --source-sha "$GITHUB_SHA" --out "round-$i.jsonl"
            cat "round-$i.jsonl" >> g4-CODEX_OMNIROUTE.jsonl
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4-CODEX_OMNIROUTE-${{ github.sha }}
          path: g4-CODEX_OMNIROUTE.jsonl
          if-no-files-found: error

  claude-omniroute:
    needs: admission
    name: CLAUDE_OMNIROUTE / mh-dev-01 / qwen1.5b
    runs-on: [self-hosted, linux, x64, mediahub-control]
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Canonical admission
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "mh-dev-01"
          test "$(id -un)" = "mediahub-runner"
          export PATH="/home/mediahub/.local/bin:/home/mediahub/.local/npm/bin:$PATH"
          command -v omniroute
          command -v claude
          command -v ollama
          ollama show qwen2.5-coder:1.5b >/dev/null
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --short)"
      - name: Execute 23 real OmniRoute Claude rounds
        shell: bash
        run: |
          set -u
          : > g4-CLAUDE_OMNIROUTE.jsonl
          for i in $(seq 1 23); do
            python3 ops/qualification/run_g4_round.py --path CLAUDE_OMNIROUTE --round "$i" --source-sha "$GITHUB_SHA" --out "round-$i.jsonl"
            cat "round-$i.jsonl" >> g4-CLAUDE_OMNIROUTE.jsonl
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4-CLAUDE_OMNIROUTE-${{ github.sha }}
          path: g4-CLAUDE_OMNIROUTE.jsonl
          if-no-files-found: error

  claude-direct:
    needs: admission
    name: CLAUDE_CODE_DIRECT / Voktors-Mac-mini / qwen1.5b
    runs-on: [self-hosted, macOS, ARM64, astra-control]
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Canonical admission
        shell: bash
        run: |
          set -euo pipefail
          host="$(hostname)"
          test "$host" = "Voktors-Mini.Dlink" || test "$host" = "Voktors-Mac-mini"
          test "$(id -un)" = "voktor"
          export PATH="$HOME/.local/bin:$HOME/.local/npm/bin:$PATH"
          command -v claude
          command -v ollama
          ollama show qwen2.5-coder:1.5b >/dev/null
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --short)"
      - name: Execute 23 real native Claude rounds
        shell: bash
        run: |
          set -u
          : > g4-CLAUDE_CODE_DIRECT.jsonl
          for i in $(seq 1 23); do
            python3 ops/qualification/run_g4_round.py --path CLAUDE_CODE_DIRECT --round "$i" --source-sha "$GITHUB_SHA" --out "round-$i.jsonl"
            cat "round-$i.jsonl" >> g4-CLAUDE_CODE_DIRECT.jsonl
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4-CLAUDE_CODE_DIRECT-${{ github.sha }}
          path: g4-CLAUDE_CODE_DIRECT.jsonl
          if-no-files-found: error

  aggregate:
    name: G4 independent 115-round verification
    needs: [admission, codex-fcc, claude-fcc, codex-omniroute, claude-omniroute, claude-direct]
    if: ${{ always() }}
    runs-on: [self-hosted, linux, x64, mediahub-control]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: g4-artifacts
          merge-multiple: false
      - name: Build canonical evidence from real round outputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          rows=[]
          for p in sorted(Path("g4-artifacts").glob("**/g4-*.jsonl")):
              rows += [json.loads(x) for x in p.read_text(encoding="utf-8").splitlines() if x.strip()]
          rows.sort(key=lambda x: (x.get("path",""), x.get("round",0)))
          blocked=[]
          if len(rows) != 115:
              blocked.append(f"round_count={len(rows)}_expected=115")
          for path in ["CODEX_FCC","CLAUDE_FCC","CODEX_OMNIROUTE","CLAUDE_OMNIROUTE","CLAUDE_CODE_DIRECT"]:
              if sum(1 for x in rows if x.get("path")==path) != 23:
                  blocked.append(path+"_round_count_invalid")
          evidence={"schema":"mediahub.astra-gold.g4-115-evidence.v1","status":"PASS" if not blocked and all(x.get("verification_status")=="PASS" for x in rows) else "BLOCKED","source_sha":os.environ["GITHUB_SHA"],"rounds":rows,"secret_values":"SUPPRESSED","blocked_reasons":blocked}
          raw=json.dumps(evidence,sort_keys=True,separators=(",",":")).encode()
          evidence["evidence_digest"]="sha256:"+hashlib.sha256(raw).hexdigest()
          Path("g4-115.json").write_text(json.dumps(evidence,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          PY
          python3 ops/qualification/verify_g4_115.py g4-115.json --expected-sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4-115-${{ github.sha }}
          path: g4-115.json
          if-no-files-found: error
