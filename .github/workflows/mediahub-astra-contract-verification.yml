name: MediaHub Astra agent verification

on:
  pull_request:
    paths:
      - '.github/agents/mediahub-astra.md'
      - '.github/ai/model-router.yml'
      - '.github/workflows/mediahub-astra-contract-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Astra agent boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Astra contract
        shell: bash
        run: |
          set -eu
          test -f .github/agents/mediahub-astra.md
          grep -Fq 'name: mediahub-astra' .github/agents/mediahub-astra.md
          grep -Fq 'State Authority' .github/agents/mediahub-astra.md
          grep -Fq 'human production authorization' .github/agents/mediahub-astra.md
          grep -Fq 'Provider configuration belongs in the controlled AI router' .github/agents/mediahub-astra.md
          ! grep -Eiq 'OPENAI_API_KEY|sk-[A-Za-z0-9_-]{12,}|Authorization: Bearer' .github/agents/mediahub-astra.md
          test -f .github/ai/model-router.yml
          grep -Fq 'production_authorization: human' .github/ai/model-router.yml
          echo 'astra_contract=PASS'