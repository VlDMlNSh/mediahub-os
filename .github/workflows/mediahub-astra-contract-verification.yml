name: MediaHub Astra agent verification

on:
  pull_request:
    paths:
      - '.github/agents/mediahub-astra.md'
      - '.github/ai/model-router.yml'
      - '.github/workflows/mediahub-astra-contract-verification.yml'
      - '.github/workflows/astra-github-hosted-queue-transition-proof.yml'
      - 'runtime/mediahub_runtime/autonomous_queue.py'
      - 'tests/test_autonomous_queue.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Astra contract and hosted queue state machine
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: runtime:.
      ASTRA_QUEUE_STATE_DIR: ${{ runner.temp }}/astra-queue-transition-proof
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Astra contract
        shell: bash
        run: |
          set -eu
          test -f .github/agents/mediahub-astra.md
          grep -Fq 'name: mediahub-astra' .github/agents/mediahub-astra.md
          grep -Fq 'State Authority' .github/agents/mediahub-astra.md
          grep -Fq 'human production authorization' .github/agents/mediahub-astra.md
          grep -Fq 'Provider configuration belongs in the controlled AI router' .github/agents/mediahub-astra.md
          ! grep -Eiq 'OPENAI_API_KEY|sk-[A-Za-z0-9_-]{12,}|Authorization: Bearer' .github/agents/mediahub-astra.md
          test -f .github/ai/model-router.yml
          grep -Fq 'production_authorization: human' .github/ai/model-router.yml
          echo 'astra_contract=PASS'
      - name: Install pinned test dependency
        shell: bash
        run: python3 -m pip install --disable-pip-version-check --no-input pytest==8.3.5
      - name: Verify autonomous queue transition on GitHub-hosted runner
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_autonomous_queue.py
          echo 'queue_transition_test=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'execution_mode=github-hosted-isolated-test' >> "$GITHUB_STEP_SUMMARY"
          echo 'real_cloud_agent_dispatch=NOT_RUN' >> "$GITHUB_STEP_SUMMARY"
          echo 'local_executor_dispatch=NOT_RUN' >> "$GITHUB_STEP_SUMMARY"
          echo 'secrets_used=NONE' >> "$GITHUB_STEP_SUMMARY"
