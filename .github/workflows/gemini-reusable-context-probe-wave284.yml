name: MediaHub — reusable workflow caller context observer (Wave 284)

on:
  workflow_call:
    inputs:
      caller_issue_number:
        description: "Issue number supplied by the trusted caller workflow event"
        required: false
        type: string
      caller_issue_is_pull_request:
        description: "Whether the caller event's issue object is a pull request"
        required: false
        type: string
      caller_comment_body:
        description: "Comment body supplied by the trusted caller workflow event"
        required: false
        type: string
      caller_author_association:
        description: "Comment author association supplied by the trusted caller workflow event"
        required: false
        type: string
    outputs:
      caller_event_name:
        description: "Event name observed inside the reusable workflow call"
        value: ${{ jobs.observe.outputs.event_name }}
      caller_workflow_ref:
        description: "Workflow ref observed inside the reusable workflow call"
        value: ${{ jobs.observe.outputs.workflow_ref }}
      caller_trusted_controller:
        description: "Whether the caller matches the single trusted controller and owner probe context"
        value: ${{ jobs.observe.outputs.trusted_controller }}

# No token authority, checkout, provider secret, model action, or external action.
permissions: {}

jobs:
  observe:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      event_name: ${{ steps.observe.outputs.event_name }}
      workflow_ref: ${{ steps.observe.outputs.workflow_ref }}
      trusted_controller: ${{ steps.observe.outputs.trusted_controller }}
    steps:
      - id: observe
        shell: bash
        env:
          EXPECTED_CONTROLLER_REF: 'VlDMlNSh/mediahub-os/.github/workflows/gemini-batch-dispatch-controller.yml@refs/heads/main'
          CALLER_ISSUE_NUMBER: ${{ inputs.caller_issue_number }}
          CALLER_ISSUE_IS_PULL_REQUEST: ${{ inputs.caller_issue_is_pull_request }}
          CALLER_COMMENT_BODY: ${{ inputs.caller_comment_body }}
          CALLER_AUTHOR_ASSOCIATION: ${{ inputs.caller_author_association }}
        run: |
          set -euo pipefail
          printf 'event_name=%s\n' "$GITHUB_EVENT_NAME" >> "$GITHUB_OUTPUT"
          printf 'workflow_ref=%s\n' "$GITHUB_WORKFLOW_REF" >> "$GITHUB_OUTPUT"
          trusted_controller=false
          if [[ "$GITHUB_WORKFLOW_REF" == "$EXPECTED_CONTROLLER_REF" && "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            trusted_controller=true
          elif [[ "$GITHUB_WORKFLOW_REF" == "$EXPECTED_CONTROLLER_REF" && "$GITHUB_EVENT_NAME" == "issue_comment" ]]; then
            if [[ "$CALLER_ISSUE_NUMBER" == "301" &&
                  "$CALLER_ISSUE_IS_PULL_REQUEST" == "false" &&
                  "$CALLER_COMMENT_BODY" == "/probe" &&
                  "$CALLER_AUTHOR_ASSOCIATION" == "OWNER" ]]; then
              trusted_controller=true
            fi
          fi
          printf 'trusted_controller=%s\n' "$trusted_controller" >> "$GITHUB_OUTPUT"
