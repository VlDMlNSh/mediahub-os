name: MediaHub — reusable workflow caller context observer (Wave 284)

on:
  workflow_call:
    outputs:
      caller_event_name:
        description: "Event name observed inside the reusable workflow call"
        value: ${{ jobs.observe.outputs.event_name }}
      caller_workflow_ref:
        description: "Workflow ref observed inside the reusable workflow call"
        value: ${{ jobs.observe.outputs.workflow_ref }}
      caller_trusted_controller:
        description: "Whether the caller matches the single trusted controller"
        value: ${{ jobs.observe.outputs.trusted_controller }}

# No token authority, checkout, provider secret, model action, or external action.
permissions: {}

jobs:
  observe:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      event_name: ${{ steps.observe.outputs.event_name }}
      workflow_ref: ${{ steps.observe.outputs.workflow_ref }}
      trusted_controller: ${{ steps.observe.outputs.trusted_controller }}
    steps:
      - id: observe
        shell: bash
        env:
          EXPECTED_CONTROLLER_REF: 'VlDMlNSh/mediahub-os/.github/workflows/gemini-batch-dispatch-controller.yml@refs/heads/main'
          EVENT_PATH: ${{ github.event_path }}
        run: |
          set -euo pipefail
          printf 'event_name=%s\n' "$GITHUB_EVENT_NAME" >> "$GITHUB_OUTPUT"
          printf 'workflow_ref=%s\n' "$GITHUB_WORKFLOW_REF" >> "$GITHUB_OUTPUT"
          trusted_controller=false
          if [[ "$GITHUB_WORKFLOW_REF" == "$EXPECTED_CONTROLLER_REF" && "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            trusted_controller=true
          elif [[ "$GITHUB_WORKFLOW_REF" == "$EXPECTED_CONTROLLER_REF" && "$GITHUB_EVENT_NAME" == "issue_comment" ]]; then
            if python3 - "$EVENT_PATH" <<'PY'
          import json,sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              event=json.load(stream)
          issue=event.get("issue") or {}
          comment=event.get("comment") or {}
          trusted=(issue.get("number")==301 and not issue.get("pull_request")
                   and comment.get("body")=="/probe"
                   and comment.get("author_association")=="OWNER")
          sys.exit(0 if trusted else 1)
          PY
            then
              trusted_controller=true
            fi
          fi
          printf 'trusted_controller=%s\n' "$trusted_controller" >> "$GITHUB_OUTPUT"
