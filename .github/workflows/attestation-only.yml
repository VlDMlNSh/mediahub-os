name: Runner Attestation Only

on:
  workflow_dispatch:
  push:
    branches: [engineering/astra-qualification-baseline-20261002]

permissions:
  contents: read

jobs:
  attestation:
    name: Canonical runner attestation
    runs-on: [self-hosted, mediahub-runner]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Emit attestation summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Runner Attestation'
            echo
            echo "- hostname: $(hostname)"
            echo "- whoami: $(whoami)"
            echo "- git HEAD: $(git rev-parse HEAD)"
            echo '- git status --porcelain:'
            echo '```text'
            git status --porcelain
            echo '```'
            echo "- OS: $(uname -a)"
            echo "- runtime: $(python3 --version 2>&1 || true)"
          } >> "$GITHUB_STEP_SUMMARY"