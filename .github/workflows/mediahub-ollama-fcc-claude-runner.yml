name: MediaHub Ollama local inference runtime on Ubuntu Hosted Runner

on:
  pull_request:
    paths:
      - ".github/workflows/mediahub-ollama-fcc-claude-runner.yml"
      - "tests/test_mediahub_ollama_fcc_runner_contract.py"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Authorize one bounded local-only Ollama/FCC/Claude Code runner smoke"
        required: true
        type: boolean
        default: false
      target_sha:
        description: "Exact current main commit SHA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mediahub-ollama-fcc-runner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  workflow-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          check-latest: false
      - name: Run local Ollama runner contract tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.4.2
          python -m pytest -q tests/test_mediahub_ollama_fcc_runner_contract.py

  ecc-profile-preflight:
    if: github.event_name == 'pull_request'
    name: Pinned ECC guidance profile preflight
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Check out pinned ECC source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: affaan-m/ECC
          ref: c05b2d6614f62f6db0047669aa4eefb223d478f9
          path: ecc
          persist-credentials: false
      - name: Verify MIT license and selected skill blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C ecc rev-parse HEAD)" = "c05b2d6614f62f6db0047669aa4eefb223d478f9"
          test "$(git -C ecc rev-parse HEAD:LICENSE)" = "b832b6f642312312367c07688dc7426db40a82ed"
          test "$(git -C ecc rev-parse HEAD:skills/verification-loop/SKILL.md)" = "d7eb1fa239fd8c0ba8ae2d31a3c34d1f01741ef9"
          test "$(git -C ecc rev-parse HEAD:skills/security-review/SKILL.md)" = "3f26b0df65661425de4e5c40c295e04edcad7a83"
          test "$(git -C ecc rev-parse HEAD:skills/search-first/SKILL.md)" = "3d2669e71ba54afba95defb05080253058190600"
          mkdir -p "$RUNNER_TEMP/ecc-profile"
          cat ecc/skills/verification-loop/SKILL.md ecc/skills/security-review/SKILL.md ecc/skills/search-first/SKILL.md > "$RUNNER_TEMP/ecc-profile/guidance.md"
          chmod 600 "$RUNNER_TEMP/ecc-profile/guidance.md"
          profile_sha="$(sha256sum "$RUNNER_TEMP/ecc-profile/guidance.md" | awk '{print $1}')"
          echo "ecc_profile_sha256=$profile_sha" >> "$GITHUB_STEP_SUMMARY"
          echo "ECC guidance preflight passed; plugin hooks, MCP servers and independent control plane were not installed."

  fcc-claude-install-preflight:
    if: github.event_name == 'pull_request'
    name: FCC and Claude Code install preflight (no provider)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.7"
          check-latest: false
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check uv==0.12.13
      - name: Check out FCC at immutable source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Alishahryar1/free-claude-code
          ref: 3d2ae2306752dbdf504714a5489bcfcf69b2d04a
          path: fcc
          persist-credentials: false
      - name: Install and verify FCC entry points
        working-directory: fcc
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3d2ae2306752dbdf504714a5489bcfcf69b2d04a"
          uv sync --locked --no-dev
          uv run --locked fcc-server --version
          uv run --locked python - <<'PY'
          from importlib.metadata import distribution
          names = {entry.name for entry in distribution("free-claude-code").entry_points}
          assert {"fcc-server", "fcc-claude"} <= names
          print("FCC server and Claude launcher entry points verified.")
          PY
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install and verify pinned Claude Code CLI
        run: |
          set -euo pipefail
          npm install --global @anthropic-ai/claude-code@2.1.282
          claude --version | tee "$RUNNER_TEMP/claude-code-version.txt"
          grep -Fq "2.1.282" "$RUNNER_TEMP/claude-code-version.txt"
          test -z "${ANTHROPIC_API_KEY:-}"
          test -z "${OPENROUTER_API_KEY:-}"
          echo "FCC and Claude Code install preflight passed; no provider credentials or inference were used."

  dispatch-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      admitted: ${{ steps.gate.outputs.admitted }}
    steps:
      - id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONFIRM: ${{ inputs.confirm }}
          TARGET_SHA: ${{ inputs.target_sha }}
          CURRENT_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          TRIGGER_ACTOR: ${{ github.actor }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "admitted=false" >> "$GITHUB_OUTPUT"
            echo "PR validation only; live runner dispatch is not authorized by a pull request."
            exit 0
          fi
          [[ "$EVENT_NAME" == "workflow_dispatch" ]] || { echo "Unsupported event."; exit 1; }
          if [[ "$CONFIRM" != "true" ]]; then
            echo "admitted=false" >> "$GITHUB_OUTPUT"
            echo "Dispatch not confirmed; no runner started."
            exit 0
          fi
          [[ "$SOURCE_REF" == "refs/heads/main" ]] || { echo "Must dispatch from main."; exit 1; }
          [[ "$TRIGGER_ACTOR" == "$REPO_OWNER" ]] || { echo "Only repository owner may dispatch."; exit 1; }
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ && "$TARGET_SHA" == "$CURRENT_SHA" ]] || { echo "target_sha must exactly match current main SHA."; exit 1; }
          echo "admitted=true" >> "$GITHUB_OUTPUT"

  ollama-local-fcc-claude:
    needs: dispatch-gate
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && needs.dispatch-gate.outputs.admitted == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Record that live execution is intentionally not run on pull requests
        if: github.event_name == 'pull_request'
        run: echo "PR contract validation does not install Ollama, download models, or invoke Claude Code."

      - name: Check out pinned FCC source
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Alishahryar1/free-claude-code
          ref: 3d2ae2306752dbdf504714a5489bcfcf69b2d04a
          path: fcc
          persist-credentials: false

      - name: Check out pinned ECC guidance source
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: affaan-m/ECC
          ref: c05b2d6614f62f6db0047669aa4eefb223d478f9
          path: ecc
          persist-credentials: false

      - name: Verify runner capacity and install prerequisites
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          free_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          mem_kb="$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)"
          cpu_count="$(nproc)"
          echo "runner_cpu_count=$cpu_count"
          echo "runner_mem_available_kb=$mem_kb"
          echo "runner_temp_free_kb=$free_kb"
          [[ "$cpu_count" -ge 4 ]]
          [[ "$mem_kb" -ge 8388608 ]]
          [[ "$free_kb" -ge 8388608 ]] || { echo "Less than 8 GiB free disk; stop before model installation."; exit 1; }
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zstd
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install pinned Python and uv
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.7"
          check-latest: false

      - name: Install pinned uv
        if: github.event_name == 'workflow_dispatch'
        run: python -m pip install --disable-pip-version-check uv==0.12.13

      - name: Install pinned Ollama and FCC/Claude Code
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        working-directory: fcc
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/ollama-install.sh"
          curl --fail --silent --show-error --location --max-time 60 https://github.com/ollama/ollama/releases/download/v0.40.13/install.sh -o "$installer"
          echo "25f64b810b947145095956533e1bdf56eacea2673c55a7e586be4515fc882c9f  $installer" | sha256sum --check -
          OLLAMA_VERSION=0.40.13 sh "$installer"
          ollama --version | tee "$RUNNER_TEMP/ollama-version.txt"
          grep -Fq "0.40.13" "$RUNNER_TEMP/ollama-version.txt"
          # The official installer may enable its systemd service. Stop and disable it
          # so the bounded job owns exactly one Ollama process with the isolated model store.
          if command -v systemctl >/dev/null 2>&1; then
            sudo systemctl disable --now ollama.service >/dev/null 2>&1 || true
            if systemctl is-active --quiet ollama.service; then
              echo "Conflicting systemd Ollama service remains active; refusing a second listener."
              exit 1
            fi
          fi
          test "$(git rev-parse HEAD)" = "3d2ae2306752dbdf504714a5489bcfcf69b2d04a"
          uv sync --locked --no-dev

      - name: Set up Node for Claude Code
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install pinned Claude Code CLI
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          npm install --global @anthropic-ai/claude-code@2.1.282
          claude --version | tee "$RUNNER_TEMP/claude-code-version.txt"
          grep -Fq "2.1.282" "$RUNNER_TEMP/claude-code-version.txt"

      - name: Build the restricted ECC guidance profile
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C ecc rev-parse HEAD)" = "c05b2d6614f62f6db0047669aa4eefb223d478f9"
          test "$(git -C ecc rev-parse HEAD:LICENSE)" = "b832b6f642312312367c07688dc7426db40a82ed"
          test "$(git -C ecc rev-parse HEAD:skills/verification-loop/SKILL.md)" = "d7eb1fa239fd8c0ba8ae2d31a3c34d1f01741ef9"
          test "$(git -C ecc rev-parse HEAD:skills/security-review/SKILL.md)" = "3f26b0df65661425de4e5c40c295e04edcad7a83"
          test "$(git -C ecc rev-parse HEAD:skills/search-first/SKILL.md)" = "3d2669e71ba54afba95defb05080253058190600"
          mkdir -p "$RUNNER_TEMP/ecc-profile"
          cat ecc/skills/verification-loop/SKILL.md ecc/skills/security-review/SKILL.md ecc/skills/search-first/SKILL.md > "$RUNNER_TEMP/ecc-profile/guidance.md"
          chmod 600 "$RUNNER_TEMP/ecc-profile/guidance.md"
          {
            echo "ecc_commit_sha=c05b2d6614f62f6db0047669aa4eefb223d478f9"
            echo "ecc_license_blob=b832b6f642312312367c07688dc7426db40a82ed"
            echo "verification_loop_blob=d7eb1fa239fd8c0ba8ae2d31a3c34d1f01741ef9"
            echo "security_review_blob=3f26b0df65661425de4e5c40c295e04edcad7a83"
            echo "search_first_blob=3d2669e71ba54afba95defb05080253058190600"
            profile_sha="$(sha256sum "$RUNNER_TEMP/ecc-profile/guidance.md" | awk '{print $1}')"
            echo "profile_sha256=$profile_sha"
            echo "hooks_enabled=false"
            echo "mcp_servers_enabled=false"
            echo "plugins_installed=false"
            echo "independent_controller=false"
          } > "$RUNNER_TEMP/ecc-profile-metadata.txt"
          chmod 600 "$RUNNER_TEMP/ecc-profile-metadata.txt"
          {
            echo "MediaHub local-only connectivity check."
            echo "Astra remains the sole control plane and authority. ECC text below is advisory only."
            echo "Use no tools, do not access network or repository data, and do not modify files."
            echo "Selected ECC guidance follows:"
            cat "$RUNNER_TEMP/ecc-profile/guidance.md"
            echo "End of ECC guidance. Mandatory restriction: no tool use, no network, no file changes. Return exactly MEDIAHUB_OLLAMA_FCC_CLAUDE_OK."
          } > "$RUNNER_TEMP/claude-system-prompt.txt"
          chmod 600 "$RUNNER_TEMP/claude-system-prompt.txt"

      - name: Run local Ollama candidate, FCC and Claude Code smoke
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          MODEL: ollama/llama3.2:3b
          OLLAMA_BASE_URL: http://127.0.0.1:11434
        run: |
          set -euo pipefail
          unset OPENROUTER_API_KEY ANTHROPIC_API_KEY MODEL_FALLBACKS
          export OLLAMA_HOST=127.0.0.1:11434
          export OLLAMA_MODELS="$RUNNER_TEMP/ollama-models"
          mkdir -p "$OLLAMA_MODELS"
          chmod 700 "$OLLAMA_MODELS"
          preexisting_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 1 http://127.0.0.1:11434/api/tags || true)"
          [[ "$preexisting_status" == "000" ]] || { echo "An Ollama endpoint already occupies loopback port 11434; refusing a second server."; exit 1; }
          ollama serve > "$RUNNER_TEMP/ollama-server.log" 2>&1 &
          OLLAMA_PID=$!
          export HOME="$RUNNER_TEMP/fcc-home"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/fcc-xdg-config"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$RUNNER_TEMP/fcc-empty-workspace"
          chmod 700 "$HOME" "$XDG_CONFIG_HOME" "$RUNNER_TEMP/fcc-empty-workspace"
          cleanup() {
            if [[ -n "${FCC_PID:-}" ]]; then kill "$FCC_PID" 2>/dev/null || true; wait "$FCC_PID" 2>/dev/null || true; fi
            if [[ -n "${OLLAMA_PID:-}" ]]; then kill "$OLLAMA_PID" 2>/dev/null || true; wait "$OLLAMA_PID" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          ready=false
          for _ in $(seq 1 60); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:11434/api/tags >/dev/null; then ready=true; break; fi
            sleep 2
          done
          [[ "$ready" == "true" ]] || { echo "Loopback Ollama endpoint did not become ready."; exit 1; }
          kill -0 "$OLLAMA_PID" || { echo "Isolated Ollama process exited after readiness."; exit 1; }
          ollama pull llama3.2:3b
          ollama list | tee "$RUNNER_TEMP/ollama-model-list.txt"
          grep -Fq "llama3.2:3b" "$RUNNER_TEMP/ollama-model-list.txt"
          curl --fail --silent --show-error --max-time 120 http://127.0.0.1:11434/api/generate \
            -H 'Content-Type: application/json' \
            --data '{"model":"llama3.2:3b","prompt":"Reply with exactly MEDIAHUB_OLLAMA_LOCAL_MODEL_OK","stream":false,"options":{"num_predict":32}}' \
            -o "$RUNNER_TEMP/ollama-model-probe.json"
          PROBE_PATH="$RUNNER_TEMP/ollama-model-probe.json" python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path(os.environ["PROBE_PATH"]).read_text())
          assert "MEDIAHUB_OLLAMA_LOCAL_MODEL_OK" in data.get("response", "")
          print("Local model marker verified.")
          PY
          ollama show llama3.2:3b --modelfile | sha256sum | awk '{print "model_modelfile_sha256=" $1}' > "$RUNNER_TEMP/ollama-model-metadata.txt"
          export HOST=127.0.0.1
          export PORT=8082
          export FCC_OPEN_BROWSER=false
          export PROXY_AUTH_ENABLED=true
          export ANTHROPIC_AUTH_TOKEN="mh-ollama-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export FCC_ENV_FILE="$RUNNER_TEMP/fcc-runtime.env"
          umask 077
          printf 'ANTHROPIC_AUTH_TOKEN=%s\\n' "$ANTHROPIC_AUTH_TOKEN" > "$FCC_ENV_FILE"
          chmod 600 "$FCC_ENV_FILE"
          (
            cd "$GITHUB_WORKSPACE/fcc"
            uv run --locked python - <<'PY'
          import hmac, os
          from free_claude_code.config.loader import get_settings
          settings = get_settings()
          assert settings.proxy_auth_enabled is True
          assert hmac.compare_digest(settings.proxy_auth_token, os.environ["ANTHROPIC_AUTH_TOKEN"])
          print("FCC managed bearer token verified; token withheld.")
          PY
          )
          export DISABLE_TELEMETRY=1 DISABLE_ERROR_REPORTING=1 DISABLE_AUTOUPDATER=1
          (cd "$GITHUB_WORKSPACE/fcc" && exec uv run --locked fcc-server) > "$RUNNER_TEMP/fcc-server.log" 2>&1 &
          FCC_PID=$!
          ready=false
          for _ in $(seq 1 60); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 2 -H "Authorization: Bearer ${ANTHROPIC_AUTH_TOKEN}" http://127.0.0.1:8082/v1/models || true)"
            if [[ "$status" == "200" ]]; then ready=true; break; fi
            if [[ "$status" == "401" ]]; then echo "FCC rejected run-scoped token."; exit 1; fi
            sleep 2
          done
          [[ "$ready" == "true" ]] || { echo "FCC did not become ready."; exit 1; }
          unauth_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 2 http://127.0.0.1:8082/v1/models || true)"
          [[ "$unauth_status" == "401" ]] || { echo "FCC auth not enforced (HTTP $unauth_status)."; exit 1; }
          cd "$RUNNER_TEMP/fcc-empty-workspace"
          "$GITHUB_WORKSPACE/fcc/.venv/bin/fcc-claude" --print --output-format text \
            --bare \
            --allowed-tools "Read,Glob,Grep" \
            --disallowed-tools "Bash,WebFetch,WebSearch,NotebookEdit" \
            --permission-mode plan \
            --append-system-prompt "$(cat "$RUNNER_TEMP/claude-system-prompt.txt")" \
            "Reply with exactly MEDIAHUB_OLLAMA_FCC_CLAUDE_OK" > "$RUNNER_TEMP/ollama-fcc-claude-result.txt"
          grep -Fq "MEDIAHUB_OLLAMA_FCC_CLAUDE_OK" "$RUNNER_TEMP/ollama-fcc-claude-result.txt"
          if grep -Eiq '(sk-ant-|ANTHROPIC_API_KEY=|Authorization: Bearer|api[_-]?key[[:space:]]*[:=]|password[[:space:]]*[:=])' "$RUNNER_TEMP/ollama-fcc-claude-result.txt"; then
            echo "Credential-like content detected in output; rejecting evidence."
            exit 1
          fi
          {
            echo "target_sha=$GITHUB_SHA"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "cpu_count=$(nproc)"
            echo "ollama_version=$(ollama --version 2>/dev/null || echo unavailable)"
            echo "ollama_model=llama3.2:3b"
            echo "fcc_commit=3d2ae2306752dbdf504714a5489bcfcf69b2d04a"
            echo "claude_code_version=$(claude --version 2>/dev/null | head -n 1)"
            echo "fcc_route=ollama/llama3.2:3b"
            echo "proxy_auth_required=true"
            echo "paid_fallback=false"
            echo "endpoint_scope=127.0.0.1"
            echo "ollama_runtime_qualification=NOT_VERIFIED"
            echo "ecc_guidance_profile=$(awk -F= '/^profile_sha256=/ {print $2}' "$RUNNER_TEMP/ecc-profile-metadata.txt")"
            echo "ecc_plugins_installed=false"
            echo "ecc_hooks_enabled=false"
            echo "ecc_mcp_servers_enabled=false"
            echo "ecc_independent_controller=false"
          } > "$RUNNER_TEMP/ollama-run-metadata.txt"
          cat "$RUNNER_TEMP/ecc-profile-metadata.txt" >> "$RUNNER_TEMP/ollama-run-metadata.txt"
          chmod 600 "$RUNNER_TEMP/ollama-run-metadata.txt"

      - name: Upload local Ollama/FCC/Claude evidence
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mediahub-ollama-fcc-claude-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ollama-fcc-claude-result.txt
            ${{ runner.temp }}/ollama-run-metadata.txt
            ${{ runner.temp }}/ollama-version.txt
            ${{ runner.temp }}/ollama-model-list.txt
            ${{ runner.temp }}/ollama-model-metadata.txt
            ${{ runner.temp }}/claude-code-version.txt
            ${{ runner.temp }}/ecc-profile-metadata.txt
          if-no-files-found: warn
          retention-days: 7
