name: MediaHub Contour A — Gemini GitHub transport batch

run-name: Gemini GitHub API transport batch — Wave 312

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Default to a no-secret probe; agents mode dispatches the three fixed Gemini workflows through GitHub API"
        required: true
        type: choice
        options:
          - "probe"
          - "agents"
        default: "probe"
      confirm:
        description: "Explicitly confirm starting three bounded Gemini runs"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/gemini-batch-dispatch-controller.yml"
      - ".github/workflows/gemini-autonomous-engineering.yml"
      - ".github/workflows/gemini-agent-2.yml"
      - ".github/workflows/gemini-agent-3.yml"
      - "tests/test_gemini_transport_controller_contract.py"

permissions: {}

concurrency:
  group: mediahub-gemini-transport-batch
  cancel-in-progress: false

jobs:
  dispatch-and-verify:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'agents' && inputs.confirm == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Dispatch the three fixed-scope agents
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MEDIAHUB_GITHUB_TOKEN }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [[ "$CONFIRM" == "yes" ]] || { echo "::error::Explicit confirmation is required."; exit 1; }
          [[ -n "${GH_TOKEN:-}" ]] || { echo "::error::MEDIAHUB_GITHUB_TOKEN repository secret is not available."; exit 1; }
          started_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "started_at=$started_at" >> "$GITHUB_OUTPUT"

          # Snapshot the latest run ID per child workflow before dispatch.
          # The monitor uses these baselines and fails closed if more than one
          # post-baseline candidate exists, rather than silently choosing a run.
          snapshot_latest() {
            local workflow="$1"
            local key="$2"
            local data id
            data="$(curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/VlDMlNSh/mediahub-os/actions/workflows/$workflow/runs?per_page=1")"
            id="$(jq -r '.workflow_runs[0].id // 0' <<<"$data")"
            echo "baseline_$key=$id" >> "$GITHUB_OUTPUT"
          }
          snapshot_latest "gemini-autonomous-engineering.yml" "agent1"
          snapshot_latest "gemini-agent-2.yml" "agent2"
          snapshot_latest "gemini-agent-3.yml" "agent3"

          dispatch_one() {
            local workflow="$1"
            local task="$2"
            local payload code
            payload="$(jq -cn --arg task "$task" '{
              ref:"main",
              inputs:{task:$task,base_ref:"main",scope:"contour-a"}
            }')"
            code="$(curl --silent --show-error --output /tmp/dispatch-response.json --write-out '%{http_code}' \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/json" \
              --data "$payload" \
              "https://api.github.com/repos/VlDMlNSh/mediahub-os/actions/workflows/$workflow/dispatches")"
            if [[ "$code" != "204" ]]; then
              echo "::error::Dispatch failed for $workflow (HTTP $code). Response body suppressed from logs."
              exit 1
            fi
            echo "Accepted workflow dispatch: $workflow"
          }

          dispatch_one "gemini-autonomous-engineering.yml" \
            "Wave 312 / Agent 1: perform one bounded Contour A engineering task against immutable main SHA and cite exact paths/blob SHAs. Create one isolated Draft PR only. No merge, deployment, qualification, additional model calls, or workflow dispatch."
          dispatch_one "gemini-agent-2.yml" \
            "Wave 312 / Agent 2: independently research architecture and component provenance for one bounded Contour A task against immutable main SHA. Cite exact paths/blob SHAs and separate facts from unknowns. Create one isolated Draft PR only. No merge, deployment, or further dispatch."
          dispatch_one "gemini-agent-3.yml" \
            "Wave 312 / Agent 3: independently review controller and child workflow security, token isolation, run correlation, permissions, provenance and tests against immutable main SHA. Report evidence and residual risks; create one isolated Draft PR only. No merge, deployment, or further dispatch."

      - name: Find and monitor all three workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MEDIAHUB_GITHUB_TOKEN }}
          STARTED_AT: ${{ steps.dispatch.outputs.started_at }}
          BASELINE_AGENT1: ${{ steps.dispatch.outputs.baseline_agent1 }}
          BASELINE_AGENT2: ${{ steps.dispatch.outputs.baseline_agent2 }}
          BASELINE_AGENT3: ${{ steps.dispatch.outputs.baseline_agent3 }}
        run: |
          set -euo pipefail
          declare -A workflow_paths=(
            [agent1]="gemini-autonomous-engineering.yml"
            [agent2]="gemini-agent-2.yml"
            [agent3]="gemini-agent-3.yml"
          )
          declare -A run_ids=()
          declare -A statuses=()
          declare -A conclusions=()
          deadline=$((SECONDS + 2100))

          while (( SECONDS < deadline )); do
            all_terminal=true
            for agent in agent1 agent2 agent3; do
              path="${workflow_paths[$agent]}"
              if [[ -z "${run_ids[$agent]:-}" ]]; then
                data="$(curl --fail-with-body --silent --show-error \
                  --header "Accept: application/vnd.github+json" \
                  --header "Authorization: Bearer $GH_TOKEN" \
                  --header "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/VlDMlNSh/mediahub-os/actions/workflows/$path/runs?event=workflow_dispatch&per_page=20")"
                case "$agent" in
                  agent1) baseline="$BASELINE_AGENT1" ;;
                  agent2) baseline="$BASELINE_AGENT2" ;;
                  agent3) baseline="$BASELINE_AGENT3" ;;
                esac
                candidates="$(jq -r --arg since "$STARTED_AT" --argjson baseline "${baseline:-0}" '[.workflow_runs[] | select(.event == "workflow_dispatch" and .created_at >= $since and .head_branch == "main" and .id > $baseline)] | map(.id)' <<<"$data")"
                count="$(jq 'length' <<<"$candidates")"
                if [[ "$count" -gt 1 ]]; then
                  echo "::error::Ambiguous new runs for $agent after baseline $baseline; refusing to guess."
                  exit 1
                elif [[ "$count" -eq 1 ]]; then
                  id="$(jq -r '.[0]' <<<"$candidates")"
                  run_ids[$agent]="$id"
                  echo "Correlated $agent run: $id (baseline $baseline)"
                else
                  all_terminal=false
                  continue
                fi
              fi

              run="$(curl --fail-with-body --silent --show-error \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/VlDMlNSh/mediahub-os/actions/runs/${run_ids[$agent]}")"
              status="$(jq -r '.status' <<<"$run")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
              statuses[$agent]="$status"
              conclusions[$agent]="$conclusion"
              if [[ "$status" != "completed" ]]; then
                all_terminal=false
              fi
              printf '%s run=%s status=%s conclusion=%s\n' "$agent" "${run_ids[$agent]}" "$status" "${conclusion:-pending}"
            done

            if [[ "$all_terminal" == "true" ]]; then
              break
            fi
            sleep 20
          done

          {
            echo "## Gemini transport batch — Wave 218"
            echo
            echo "| Agent | Run ID | Status | Conclusion |"
            echo "|---|---:|---|---|"
            for agent in agent1 agent2 agent3; do
              echo "| $agent | ${run_ids[$agent]:-not-found} | ${statuses[$agent]:-not-found} | ${conclusions[$agent]:-not-found} |"
            done
            echo
            echo "Run links:"
            for agent in agent1 agent2 agent3; do
              if [[ -n "${run_ids[$agent]:-}" ]]; then
                echo "- $agent: https://github.com/VlDMlNSh/mediahub-os/actions/runs/${run_ids[$agent]}"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

          for agent in agent1 agent2 agent3; do
            if [[ -z "${run_ids[$agent]:-}" ]]; then
              echo "::error::No matching run found for $agent before timeout."
              exit 1
            fi
            if [[ "${statuses[$agent]:-}" != "completed" || "${conclusions[$agent]:-}" != "success" ]]; then
              echo "::error::$agent did not complete successfully."
              exit 1
            fi
          done
          echo "All three Gemini workflow runs completed successfully. Review artifacts and PRs separately before accepting agent output."

  probe:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'probe')
    name: No-secret controller probe
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Emit non-sensitive controller context
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          {
            echo "## Gemini GitHub transport controller probe"
            echo
            echo "- Event: $EVENT_NAME"
            echo "- Workflow ref: $WORKFLOW_REF"
            echo "- Provider/GitHub transport secrets mapped to this job: none"
            echo "- Agent dispatch performed: no"
          } >> "$GITHUB_STEP_SUMMARY"
