name: MediaHub Contour A — Gemini GitHub API dispatch controller
run-name: MediaHub Gemini controller — ${{ github.event.comment.id || inputs.mode || 'probe' }} — Wave 312
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Non-launching probe by default; agents require explicit opt-in"
        required: true
        type: choice
        options: [probe, agents]
        default: probe
      confirm:
        description: "Explicitly confirm dispatch of all three bounded child workflows"
        required: true
        type: choice
        options: [no, yes]
        default: no
      target_sha:
        description: "Optional immutable full commit SHA; blank resolves main once"
        required: false
        type: string
        default: ""
  issue_comment:
    types: [created]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/gemini-batch-dispatch-controller.yml"
      - ".github/workflows/gemini-autonomous-engineering.yml"
      - ".github/workflows/gemini-reusable-context-probe-wave284.yml"
      - ".github/workflows/gemini-agent-2.yml"
      - ".github/workflows/gemini-agent-3.yml"
      - "tests/test_gemini_controller_positive_context_probe_wave292_contract.py"
permissions: {}
concurrency:
  group: mediahub-gemini-controller-batch
  cancel-in-progress: false
jobs:
  probe:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'probe')
    name: Non-launching no-secret caller-context probe
    uses: ./.github/workflows/gemini-reusable-context-probe-wave284.yml
    permissions: {}
  assert_probe_context:
    if: always() && (github.event_name == 'pull_request' || inputs.mode == 'probe')
    needs: probe
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Assert caller context without credentials
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          OBSERVED_EVENT_NAME: ${{ needs.probe.outputs.caller_event_name }}
          OBSERVED_WORKFLOW_REF: ${{ needs.probe.outputs.caller_workflow_ref }}
          OBSERVED_TRUSTED_CONTROLLER: ${{ needs.probe.outputs.caller_trusted_controller }}
          TRUSTED_REF: 'VlDMlNSh/mediahub-os/.github/workflows/gemini-batch-dispatch-controller.yml@refs/heads/main'
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$OBSERVED_EVENT_NAME" == "workflow_dispatch" ]]
            [[ "$OBSERVED_WORKFLOW_REF" == "$TRUSTED_REF" ]]
            [[ "$OBSERVED_TRUSTED_CONTROLLER" == "true" ]]
          else
            [[ "$EVENT_NAME" == "pull_request" ]]
            [[ "$OBSERVED_EVENT_NAME" == "pull_request" ]]
            [[ "$OBSERVED_WORKFLOW_REF" == *"/.github/workflows/gemini-batch-dispatch-controller.yml@refs/pull/"* ]]
            [[ "$OBSERVED_TRUSTED_CONTROLLER" == "false" ]]
          fi
          {
            echo "## Non-launching caller-context probe"
            echo "- Trigger: $EVENT_NAME"
            echo "- Observed event: $OBSERVED_EVENT_NAME"
            echo "- Observed workflow ref: $OBSERVED_WORKFLOW_REF"
            echo "- Trusted controller: $OBSERVED_TRUSTED_CONTROLLER"
            echo "- Transport/HMAC/provider secrets mapped: no"
            echo "- Gemini reachable in probe mode: no"
          } >> "$GITHUB_STEP_SUMMARY"
  readiness_gate:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'agents' && inputs.confirm == 'yes') ||
      (github.event_name == 'issue_comment' && github.event.issue.number == 301 && github.event.issue.pull_request == null && github.event.comment.body == '/next' && github.event.comment.author_association == 'OWNER')
    name: Require explicit batch admission flag
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - id: gate
        shell: bash
        env:
          BATCH_ENABLED: ${{ vars.MEDIAHUB_GEMINI_BATCH_ENABLED }}
        run: |
          set -euo pipefail
          if [[ "${BATCH_ENABLED,,}" == "true" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Batch admission flag is enabled; remaining controller checks still apply."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Batch admission flag MEDIAHUB_GEMINI_BATCH_ENABLED is not true; no child dispatch will occur."
          fi
  dispatch_and_monitor:
    needs: readiness_gate
    if: >-
      needs.readiness_gate.outputs.enabled == 'true' &&
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.mode == 'agents' && inputs.confirm == 'yes') ||
        (github.event_name == 'issue_comment' && github.event.issue.number == 301 && github.event.issue.pull_request == null && github.event.comment.body == '/next' && github.event.comment.author_association == 'OWNER')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions: {}
    steps:
      - name: Dispatch signed children and monitor exact run IDs
        shell: bash
        env:
          GH_API_TOKEN: ${{ secrets.MEDIAHUB_GITHUB_TOKEN }}
          HMAC_KEY: ${{ secrets.MEDIAHUB_DISPATCH_HMAC_KEY }}
          REQUESTED_SHA: ${{ inputs.target_sha }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,hmac,json,os,re,sys,time,urllib.error,urllib.request,uuid
          repo=os.environ["REPOSITORY"]; token=os.environ.get("GH_API_TOKEN",""); key=os.environ.get("HMAC_KEY","")
          if not token or not key:
              print("::error::Required controller secrets are missing; fail closed before child dispatch."); sys.exit(2)
          api="https://api.github.com"
          headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+token,"X-GitHub-Api-Version":"2022-11-28","User-Agent":"MediaHub-Controller"}
          def call(method,path,body=None):
              data=None if body is None else json.dumps(body,separators=(",",":")).encode()
              req=urllib.request.Request(api+path,data=data,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      raw=r.read(); return r.status,json.loads(raw) if raw else None
              except urllib.error.HTTPError as e:
                  detail=e.read().decode("utf-8","replace")[:300]
                  raise RuntimeError(f"GitHub API {method} {path}: HTTP {e.code}: {detail}")
          source_comment_id=os.environ.get("SOURCE_COMMENT_ID","").strip()
          if source_comment_id:
              _,history=call("GET",f"/repos/{repo}/actions/workflows/gemini-batch-dispatch-controller.yml/runs?event=issue_comment&branch=main&per_page=100")
              duplicates=[r for r in history.get("workflow_runs",[]) if str(r.get("id"))!=os.environ.get("CURRENT_RUN_ID","") and source_comment_id in (r.get("display_title") or "")]
              if duplicates:
                  print("::notice::This /next comment already has a controller run; duplicate dispatch suppressed.")
                  sys.exit(0)
          target=os.environ.get("REQUESTED_SHA","").strip()
          if target and not re.fullmatch(r"[0-9a-fA-F]{40}",target):
              print("::error::target_sha must be a full 40-hex SHA."); sys.exit(2)
          if not target:
              _,ref=call("GET",f"/repos/{repo}/git/ref/heads/main"); target=ref["object"]["sha"]
          target=target.lower(); _,commit=call("GET",f"/repos/{repo}/commits/{target}")
          if commit.get("sha")!=target:
              print("::error::Immutable target SHA did not resolve exactly."); sys.exit(2)
          print(f"Shared immutable target SHA: {target}")
          tasks=[
           ("gemini-autonomous-engineering.yml","Wave 312 Agent 1: bounded implementation against the shared immutable target SHA; preserve Baseline 2.0, historical IDs, issuer/capability boundaries, Product State Authority and provenance. Draft PR only; no merge, deployment, qualification or nested dispatch.","contour-a"),
           ("gemini-agent-2.yml","Wave 312 Agent 2: independent contract and test review against the same target SHA; report exact refs, blob SHAs, gaps and reproducible evidence. Do not claim independence for self-authored work. Draft report/PR only; no merge/deployment/qualification/nested dispatch.","contour-a"),
           ("gemini-agent-3.yml","Wave 312 Agent 3: security audit of token separation, signed dispatch, issuer/capability, provenance and fail-closed behavior against the same target SHA. Report evidence and residual risks. Draft report/PR only; no merge/deployment/qualification/nested dispatch.","contour-a")]
          started=time.time(); jobs=[]; results={}
          # Record each intended dispatch before making the API request. A failed
          # request must not erase evidence of earlier accepted children.
          for wf,task,scope in tasks:
              did=str(uuid.uuid4()); payload={"workflow_file":wf,"dispatch_id":did,"target_sha":target,"task":task,"base_ref":"main","scope":scope}
              sig=hmac.new(key.encode(),json.dumps(payload,sort_keys=True,separators=(",",":")).encode(),hashlib.sha256).hexdigest()
              inputs={k:str(payload[k]) for k in ("dispatch_id","target_sha","task","base_ref","scope")}; inputs["dispatch_signature"]=sig
              job={"workflow":wf,"id":did,"dispatch_status":"PENDING"}; jobs.append(job)
              try:
                  status,_=call("POST",f"/repos/{repo}/actions/workflows/{wf}/dispatches",{"ref":"main","inputs":inputs})
                  if status!=204: raise RuntimeError(f"Unexpected dispatch status {status}")
                  job["dispatch_status"]="ACCEPTED"
                  print(f"Accepted {wf}; correlation ID {did}; target SHA {target}")
              except Exception as exc:
                  # Explicit 4xx rejection is definite; transport/5xx outcomes are ambiguous.
                  # Never print upstream exception text; it may contain untrusted data.
                  match=re.search(r"HTTP (\d{3})",str(exc))
                  code=int(match.group(1)) if match else None
                  if code is not None and 400 <= code < 500:
                      job["dispatch_status"]="FAILED"; job["dispatch_error"]=f"HTTP_{code}"
                      results[did]={"status":"DISPATCH_FAILED","conclusion":"failure"}
                      print(f"::error::Dispatch rejected for {wf}; correlation ID {did}; http_status={code}")
                  else:
                      job["dispatch_status"]="UNKNOWN"; job["dispatch_error"]=type(exc).__name__
                      print(f"::error::Dispatch outcome unknown for {wf}; correlation ID {did}; error_type={type(exc).__name__}")
          # Reconcile accepted and ambiguous attempts. Definite 4xx rejections are
          # terminal and must not consume the child monitoring window.
          pending={j["id"]:j for j in jobs if j["dispatch_status"] in ("ACCEPTED","UNKNOWN")}
          deadline=time.time()+32*60
          while pending and time.time()<deadline:
              for did,j in list(pending.items()):
                  try:
                      _,data=call("GET",f"/repos/{repo}/actions/workflows/{j['workflow']}/runs?event=workflow_dispatch&branch=main&per_page=30")
                  except Exception as exc:
                      j["monitor_error"]=type(exc).__name__
                      print(f"::warning::Monitoring query failed for {j['workflow']}; correlation ID {did}; error_type={type(exc).__name__}")
                      continue
                  matches=[r for r in data.get("workflow_runs",[]) if did in (r.get("display_title") or "")]
                  if not matches: continue
                  run=max(matches,key=lambda x:x.get("created_at",""))
                  if run.get("created_at","")<time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime(started-5)): continue
                  if run.get("status")=="completed":
                      results[did]={"run_id":run["id"],"url":run.get("html_url"),"status":run["status"],"conclusion":run.get("conclusion")}
                      print(f"Child {j['workflow']} run_id={run['id']} conclusion={run.get('conclusion')}"); del pending[did]
              if pending: time.sleep(10)
          for did,j in pending.items():
              results[did]={"status":"NOT_COMPLETED_BEFORE_TIMEOUT","conclusion":"failure"}
              print(f"::error::Child {j['workflow']} correlation_id={did} NOT_COMPLETED_BEFORE_TIMEOUT")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as out:
              out.write("\n## GitHub API child dispatch results\n\n- Shared immutable target SHA: `"+target+"`\n\n| Workflow | Correlation ID | Dispatch | Run ID | Conclusion |\n|---|---|---|---:|---|\n")
              for j in jobs:
                  r=results.get(j["id"],{})
                  out.write(f"| {j['workflow']} | `{j['id']}` | {j['dispatch_status']} | {r.get('run_id','NOT FOUND')} | {r.get('conclusion',r.get('status','UNKNOWN'))} |\n")
          if len(jobs)!=3 or any(j["dispatch_status"]!="ACCEPTED" for j in jobs) or any(results.get(j["id"],{}).get("conclusion")!="success" for j in jobs):
              print("::error::Batch incomplete: at least one dispatch or child run failed, could not be correlated, or timed out."); sys.exit(1)
          PY
