name: MediaHub Contour A — Gemini GitHub transport batch

run-name: Gemini transport qualification probe — Wave 213

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Explicitly confirm starting three bounded Gemini runs"
        required: true
        type: choice
        options:
          - no
          - yes
        default: no

permissions:
  contents: read
  actions: write

concurrency:
  group: mediahub-gemini-transport-batch
  cancel-in-progress: false

jobs:
  dispatch-and-verify:
    if: inputs.confirm == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Dispatch the three fixed-scope agents
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [[ "$CONFIRM" == "yes" ]] || { echo "::error::Explicit confirmation is required."; exit 1; }
          started_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "started_at=$started_at" >> "$GITHUB_OUTPUT"

          dispatch_one() {
            local workflow="$1"
            local task="$2"
            local payload code
            payload="$(jq -cn --arg task "$task" '{
              ref:"main",
              inputs:{task:$task,base_ref:"main",scope:"contour-a"}
            }')"
            code="$(curl --silent --show-error --output /tmp/dispatch-response.json --write-out '%{http_code}' \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/json" \
              --data "$payload" \
              "https://api.github.com/repos/VlDMlNSh/mediahub-os/actions/workflows/$workflow/dispatches")"
            if [[ "$code" != "204" ]]; then
              echo "::error::Dispatch failed for $workflow (HTTP $code). Response body suppressed from logs."
              exit 1
            fi
            echo "Accepted workflow dispatch: $workflow"
          }

          dispatch_one "gemini-autonomous-engineering.yml" \
            "Wave 213 / agent-1 transport smoke: read GEMINI.md from main using the configured GitHub MCP tool, then produce one bounded evidence checkpoint and isolated Draft PR. Include exact source refs, successful tool-call evidence, and remaining unknowns. Static review only; no secret values, no tests, no additional workflow dispatch, no merge or deployment."
          dispatch_one "gemini-agent-2.yml" \
            "Wave 213 / agent-2 transport and workflow parity review: use the configured GitHub MCP tool to read GEMINI.md from main, then produce one bounded evidence checkpoint and isolated Draft PR. Compare the three Gemini workflow source files for dispatch inputs, secret-reference names, permissions and output validation; cite exact refs and hashes. Do not inspect secret values, run tests, dispatch other workflows, merge or deploy."
          dispatch_one "gemini-agent-3.yml" \
            "Wave 213 / agent-3 schema evidence review: use the configured GitHub MCP tool to read GEMINI.md from main, then produce one bounded evidence checkpoint and isolated Draft PR. Inspect the current task-envelope, agent-registry and evidence-manifest schema candidates; report paths, refs, SHA, Draft 2020-12 gaps and negative-fixture recommendations. Static review only; do not install dependencies, run tests, inspect secret values, dispatch other workflows, merge or deploy."

      - name: Find and monitor all three workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED_AT: ${{ steps.dispatch.outputs.started_at }}
        run: |
          set -euo pipefail
          declare -A workflow_paths=(
            [agent1]="gemini-autonomous-engineering.yml"
            [agent2]="gemini-agent-2.yml"
            [agent3]="gemini-agent-3.yml"
          )
          declare -A run_ids=()
          declare -A statuses=()
          declare -A conclusions=()
          deadline=$((SECONDS + 2100))

          while (( SECONDS < deadline )); do
            all_terminal=true
            for agent in agent1 agent2 agent3; do
              path="${workflow_paths[$agent]}"
              if [[ -z "${run_ids[$agent]:-}" ]]; then
                data="$(curl --fail-with-body --silent --show-error \
                  --header "Accept: application/vnd.github+json" \
                  --header "Authorization: Bearer $GH_TOKEN" \
                  --header "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/VlDMlNSh/mediahub-os/actions/workflows/$path/runs?event=workflow_dispatch&per_page=20")"
                id="$(jq -r --arg since "$STARTED_AT" '[.workflow_runs[] | select(.event == "workflow_dispatch" and .created_at >= $since and .head_branch == "main")] | sort_by(.created_at) | last | .id // empty' <<<"$data")"
                if [[ -n "$id" ]]; then
                  run_ids[$agent]="$id"
                  echo "Discovered $agent run: $id"
                else
                  all_terminal=false
                  continue
                fi
              fi

              run="$(curl --fail-with-body --silent --show-error \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/VlDMlNSh/mediahub-os/actions/runs/${run_ids[$agent]}")"
              status="$(jq -r '.status' <<<"$run")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
              statuses[$agent]="$status"
              conclusions[$agent]="$conclusion"
              if [[ "$status" != "completed" ]]; then
                all_terminal=false
              fi
              printf '%s run=%s status=%s conclusion=%s\n' "$agent" "${run_ids[$agent]}" "$status" "${conclusion:-pending}"
            done

            if [[ "$all_terminal" == "true" ]]; then
              break
            fi
            sleep 20
          done

          {
            echo "## Gemini transport batch — Wave 213"
            echo
            echo "| Agent | Run ID | Status | Conclusion |"
            echo "|---|---:|---|---|"
            for agent in agent1 agent2 agent3; do
              echo "| $agent | ${run_ids[$agent]:-not-found} | ${statuses[$agent]:-not-found} | ${conclusions[$agent]:-not-found} |"
            done
            echo
            echo "Run links:"
            for agent in agent1 agent2 agent3; do
              if [[ -n "${run_ids[$agent]:-}" ]]; then
                echo "- $agent: https://github.com/VlDMlNSh/mediahub-os/actions/runs/${run_ids[$agent]}"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

          for agent in agent1 agent2 agent3; do
            if [[ -z "${run_ids[$agent]:-}" ]]; then
              echo "::error::No matching run found for $agent before timeout."
              exit 1
            fi
            if [[ "${statuses[$agent]:-}" != "completed" || "${conclusions[$agent]:-}" != "success" ]]; then
              echo "::error::$agent did not complete successfully."
              exit 1
            fi
          done
          echo "All three Gemini workflow runs completed successfully. Review artifacts and PRs separately before accepting agent output."
