name: MediaHub Contour A — Gemini GitHub API dispatch controller
run-name: MediaHub Gemini controller — ${{ github.event.comment.id && format('next-comment-{0}', github.event.comment.id) || inputs.mode || 'probe' }} — Wave 317
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Probe does not launch; agents dispatches three roles; review dispatches one fixed read-only review task"
        required: true
        type: choice
        options: [probe, agents, review]
        default: probe
      confirm:
        description: "Explicitly confirm dispatch of the selected bounded Gemini task or tasks"
        required: true
        type: boolean
        default: false
      target_sha:
        description: "Optional immutable full commit SHA; blank resolves main once"
        required: false
        type: string
        default: ""
  issue_comment:
    types: [created]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/gemini-batch-dispatch-controller.yml"
      - ".github/workflows/gemini-autonomous-engineering.yml"
      - ".github/workflows/gemini-reusable-context-probe-wave284.yml"
      - ".github/workflows/gemini-agent-2.yml"
      - ".github/workflows/gemini-agent-3.yml"
      - ".github/workflows/gemini-fcc-independent-review-wave409.yml"
      - "tests/test_gemini_controller_positive_context_probe_wave292_contract.py"
      - ".github/workflows/gemini-workflow-contract-validation-wave284.yml"
      - "tests/test_gemini_child_signed_dispatch_runtime_contract.py"
      - "tests/test_gemini_transport_controller_contract.py"
      - "tests/test_gemini_controller_trigger_path_coverage_contract.py"
permissions: {}
concurrency:
  group: mediahub-gemini-controller-batch
  cancel-in-progress: false
jobs:
  probe:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'probe')
    name: Non-launching no-secret caller-context probe
    uses: ./.github/workflows/gemini-reusable-context-probe-wave284.yml
    permissions: {}
  assert_probe_context:
    if: always() && (github.event_name == 'pull_request' || inputs.mode == 'probe')
    needs: probe
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Assert caller context without credentials
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          OBSERVED_EVENT_NAME: ${{ needs.probe.outputs.caller_event_name }}
          OBSERVED_WORKFLOW_REF: ${{ needs.probe.outputs.caller_workflow_ref }}
          OBSERVED_TRUSTED_CONTROLLER: ${{ needs.probe.outputs.caller_trusted_controller }}
          TRUSTED_REF: 'VlDMlNSh/mediahub-os/.github/workflows/gemini-batch-dispatch-controller.yml@refs/heads/main'
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$OBSERVED_EVENT_NAME" == "workflow_dispatch" ]]
            [[ "$OBSERVED_WORKFLOW_REF" == "$TRUSTED_REF" ]]
            [[ "$OBSERVED_TRUSTED_CONTROLLER" == "true" ]]
          else
            [[ "$EVENT_NAME" == "pull_request" ]]
            [[ "$OBSERVED_EVENT_NAME" == "pull_request" ]]
            [[ "$OBSERVED_WORKFLOW_REF" == *"/.github/workflows/gemini-batch-dispatch-controller.yml@refs/pull/"* ]]
            [[ "$OBSERVED_TRUSTED_CONTROLLER" == "false" ]]
          fi
          {
            echo "## Non-launching caller-context probe"
            echo "- Trigger: $EVENT_NAME"
            echo "- Observed event: $OBSERVED_EVENT_NAME"
            echo "- Observed workflow ref: $OBSERVED_WORKFLOW_REF"
            echo "- Trusted controller: $OBSERVED_TRUSTED_CONTROLLER"
            echo "- Transport/HMAC/provider secrets mapped: no"
            echo "- Gemini reachable in probe mode: no"
          } >> "$GITHUB_STEP_SUMMARY"
  readiness_gate:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'agents' && inputs.confirm == true) ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'review' && inputs.confirm == true) ||
      (github.event_name == 'issue_comment' && github.event.issue.number == 301 && github.event.issue.pull_request == null && github.event.comment.body == '/next' && github.event.comment.author_association == 'OWNER')
    name: Require explicit batch admission flag
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - id: gate
        shell: bash
        env:
          BATCH_ENABLED: ${{ vars.MEDIAHUB_GEMINI_BATCH_ENABLED }}
        run: |
          set -euo pipefail
          if [[ "${BATCH_ENABLED,,}" == "true" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Batch admission flag is enabled; remaining controller checks still apply."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Batch admission flag MEDIAHUB_GEMINI_BATCH_ENABLED is not true; no child dispatch will occur."
          fi
  dispatch_and_monitor:
    needs: readiness_gate
    if: >-
      needs.readiness_gate.outputs.enabled == 'true' &&
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.mode == 'agents' && inputs.confirm == true) ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'review' && inputs.confirm == true) ||
        (github.event_name == 'issue_comment' && github.event.issue.number == 301 && github.event.issue.pull_request == null && github.event.comment.body == '/next' && github.event.comment.author_association == 'OWNER')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions: {}
    steps:
      - name: Dispatch signed children and monitor exact run IDs
        shell: bash
        env:
          GH_API_TOKEN: ${{ secrets.MEDIAHUB_GITHUB_TOKEN }}
          HMAC_KEY: ${{ secrets.MEDIAHUB_DISPATCH_HMAC_KEY }}
          REQUESTED_SHA: ${{ inputs.target_sha }}
          REQUESTED_MODE: ${{ inputs.mode }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,hmac,json,os,re,sys,time,urllib.error,urllib.request,uuid
          repo=os.environ["REPOSITORY"]; token=os.environ.get("GH_API_TOKEN",""); key=os.environ.get("HMAC_KEY","")
          if not token or not key:
              print("::error::Required controller secrets are missing; fail closed before child dispatch."); sys.exit(2)
          api="https://api.github.com"
          headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+token,"X-GitHub-Api-Version":"2022-11-28","User-Agent":"MediaHub-Controller"}
          def call(method,path,body=None):
              data=None if body is None else json.dumps(body,separators=(",",":")).encode()
              req=urllib.request.Request(api+path,data=data,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      raw=r.read(); return r.status,json.loads(raw) if raw else None
              except urllib.error.HTTPError as e:
                  detail=e.read().decode("utf-8","replace")[:300]
                  raise RuntimeError(f"GitHub API {method} {path}: HTTP {e.code}: {detail}")
          source_comment_id=os.environ.get("SOURCE_COMMENT_ID","").strip()
          if source_comment_id:
              _,history=call("GET",f"/repos/{repo}/actions/workflows/gemini-batch-dispatch-controller.yml/runs?event=issue_comment&branch=main&per_page=100")
              duplicates=[r for r in history.get("workflow_runs",[]) if str(r.get("id"))!=os.environ.get("CURRENT_RUN_ID","") and ("next-comment-"+source_comment_id) in (r.get("display_title") or "")]
              if duplicates:
                  print("::notice::This /next comment already has a controller run; duplicate dispatch suppressed.")
                  sys.exit(0)
          target=os.environ.get("REQUESTED_SHA","").strip()
          if target and not re.fullmatch(r"[0-9a-fA-F]{40}",target):
              print("::error::target_sha must be a full 40-hex SHA."); sys.exit(2)
          if not target:
              _,ref=call("GET",f"/repos/{repo}/git/ref/heads/main"); target=ref["object"]["sha"]
          target=target.lower(); _,commit=call("GET",f"/repos/{repo}/commits/{target}")
          if commit.get("sha")!=target:
              print("::error::Immutable target SHA did not resolve exactly."); sys.exit(2)
          review_target_shas={"074f20eb495666946a14410ab88d566aaa754f24","4fe1486e2062d276c4dba2ab8c9ed97f261e9086"}
          if os.environ.get("REQUESTED_MODE","").strip()=="review" and target not in review_target_shas:
              print("::error::Review mode requires one of the two immutable, statically allowlisted FCC review targets."); sys.exit(2)
          print(f"Shared immutable target SHA: {target}")
          tasks=[
           ("gemini-autonomous-engineering.yml","Per-/next Agent 1 — bounded implementation. On the shared immutable target SHA, read the canonical map, Bootstrap, current checkpoint, Master Roadmap and Issue #301. Select the highest-priority open, unblocked next task; prefer reuse of stable existing components. Complete exactly one bounded implementation/evidence pass, preserve Baseline 2.0, historical IDs, issuer/capability boundaries, Product State Authority and provenance. Draft PR/report only; no merge, deployment, qualification, secret access or nested dispatch.","contour-a"),
           ("gemini-agent-2.yml","Per-/next Agent 2 — independent contract and test verification. Against the same immutable target SHA, map the current next-step acceptance criteria to source, contracts and tests; run or identify reproducible non-secret checks; report exact refs, blob SHAs, commands, outcomes and gaps. Do not claim to have reviewed Agent 1 changes created concurrently from this batch. Draft evidence/review only; no merge, deployment, qualification or nested dispatch.","contour-a"),
           ("gemini-agent-3.yml","Per-/next Agent 3 — independent security and provenance audit. Against the same immutable target SHA, audit controller/child transport, issuer/capability, secret separation, least privilege, HMAC, quota/fallback policy, evidence provenance and fail-closed behavior. Never read or output secret values. Report exact refs, blob SHAs, negative tests and residual risks. Draft audit only; no merge, deployment, qualification or nested dispatch.","contour-a")]
          requested_mode=os.environ.get("REQUESTED_MODE","").strip()
          if source_comment_id:
              requested_mode="agents"
          if requested_mode=="review":
              # Fixed read-only tasks keyed by immutable SHA; no caller-supplied task is accepted.
              review_tasks={
               "074f20eb495666946a14410ab88d566aaa754f24": ("gemini-fcc-independent-review-wave409.yml","Wave 408 independent review — inspect the exact merged source changes in PR #506 (merge SHA 3a0cda63a6e39b844c3d78bede4b777e3a0004bf) and PR #508 (merge/target SHA 074f20eb495666946a14410ab88d566aaa754f24), using the shared immutable target SHA as repository context. Review effective FCC managed-token initialization, bearer authentication and HTTP 401 behavior, secret isolation, free-only routing/no paid fallback, read-only tools/workspace, workflow gates, provenance and test coverage. Read the exact PR patches and current source/tests. Report findings by severity with file/path, line or evidence reference, impact, reproducible proof and PASS/FAIL/NOT VERIFIED. Treat absent checks/reviews as NOT VERIFIED. This is a review-only task: do not edit application/workflow code, read or print secret values, invoke any provider/model or runtime, dispatch other agents, merge, deploy, or qualify. Produce only a concise dated review report as the workflow artifact; do not create a PR or change repository files. State explicitly that no live runtime test was performed.", "contour-a"),
               "4fe1486e2062d276c4dba2ab8c9ed97f261e9086": ("gemini-fcc-independent-review-wave409.yml","Wave 427 independent review — audit the exact merged implementation from PR #530 at merge SHA 4fe1486e2062d276c4dba2ab8c9ed97f261e9086. Inspect the merged changes in .github/ai/model-router.yml, .github/workflows/mediahub-fcc-free-claude-worker.yml, scripts/verify_ai_factory.py, tests/ai/test_provider_selector.py and tests/test_mediahub_fcc_free_claude_workflow_contract.py. Verify the owner-only workflow_dispatch from main, explicit confirm flag, exact target-SHA equality, repository opt-in, secret isolation, concrete :free returned-model gate, pinned FCC and Claude Code, pinned ECC guidance and skill/license hashes, disabled paid fallback, isolated read-only workspace, artifact evidence, and distinct local FCC→Ollama Llama route. Treat missing independent review of PR #530 as a governance gap. Read source and test evidence only; do not read/print secrets, perform any provider/model/runtime call, send any local task, dispatch nested agents, edit files, merge, deploy, or qualify. Produce only a concise dated findings report as workflow artifact. State explicitly that no live runtime/provider test was performed.", "contour-a")
              }
              tasks=[review_tasks[target]]
          elif requested_mode!="agents":
              print("::error::Unsupported or missing dispatch mode; fail closed."); sys.exit(2)
          expected_count=len(tasks)
          started=time.time(); jobs=[]; results={}
          # Record each intended dispatch before making the API request. A failed
          # request must not erase evidence of earlier accepted children.
          for wf,task,scope in tasks:
              did=str(uuid.uuid4()); payload={"workflow_file":wf,"dispatch_id":did,"target_sha":target,"task":task,"base_ref":"main","scope":scope}
              sig=hmac.new(key.encode(),json.dumps(payload,sort_keys=True,separators=(",",":")).encode(),hashlib.sha256).hexdigest()
              inputs={k:str(payload[k]) for k in ("dispatch_id","target_sha","task","base_ref","scope")}; inputs["dispatch_signature"]=sig
              job={"workflow":wf,"id":did,"dispatch_status":"PENDING"}; jobs.append(job)
              try:
                  status,_=call("POST",f"/repos/{repo}/actions/workflows/{wf}/dispatches",{"ref":"main","inputs":inputs})
                  if status!=204: raise RuntimeError(f"Unexpected dispatch status {status}")
                  job["dispatch_status"]="ACCEPTED"
                  print(f"Accepted {wf}; correlation ID {did}; target SHA {target}")
              except Exception as exc:
                  # Explicit 4xx rejection is definite; transport/5xx outcomes are ambiguous.
                  # Never print upstream exception text; it may contain untrusted data.
                  match=re.search(r"HTTP (\d{3})",str(exc))
                  code=int(match.group(1)) if match else None
                  if code is not None and 400 <= code < 500 and code != 408:
                      job["dispatch_status"]="FAILED"; job["dispatch_error"]=f"HTTP_{code}"
                      results[did]={"status":"DISPATCH_FAILED","conclusion":"failure"}
                      print(f"::error::Dispatch rejected for {wf}; correlation ID {did}; http_status={code}")
                  else:
                      job["dispatch_status"]="UNKNOWN"; job["dispatch_error"]=type(exc).__name__
                      print(f"::error::Dispatch outcome unknown for {wf}; correlation ID {did}; error_type={type(exc).__name__}")
          # Reconcile accepted and ambiguous attempts. Definite 4xx rejections are
          # terminal and must not consume the child monitoring window.
          pending={j["id"]:j for j in jobs if j["dispatch_status"] in ("ACCEPTED","UNKNOWN")}
          deadline=time.time()+32*60
          while pending and time.time()<deadline:
              for did,j in list(pending.items()):
                  try:
                      _,data=call("GET",f"/repos/{repo}/actions/workflows/{j['workflow']}/runs?event=workflow_dispatch&branch=main&per_page=30")
                  except Exception as exc:
                      j["monitor_error"]=type(exc).__name__
                      print(f"::warning::Monitoring query failed for {j['workflow']}; correlation ID {did}; error_type={type(exc).__name__}")
                      continue
                  matches=[r for r in data.get("workflow_runs",[]) if did in (r.get("display_title") or "")]
                  if not matches: continue
                  run=max(matches,key=lambda x:x.get("created_at",""))
                  if run.get("created_at","")<time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime(started-5)): continue
                  if run.get("status")=="completed":
                      # Reconcile exact child jobs and evidence artifacts; empty API
                      # results are NOT VERIFIED and cannot be treated as success.
                      child_jobs=[]
                      try:
                          _,job_data=call("GET",f"/repos/{repo}/actions/runs/{run['id']}/jobs?per_page=100")
                          child_jobs=job_data.get("jobs",[])
                      except Exception as exc:
                          j["job_monitor_error"]=type(exc).__name__
                      job_ids=";".join(f"{item.get('id')}:{item.get('name')}:{item.get('conclusion') or item.get('status')}" for item in child_jobs) or "NOT_VERIFIED"
                      jobs_success=bool(child_jobs) and all(item.get("conclusion")=="success" for item in child_jobs)
                      artifact_digest="NOT_VERIFIED"
                      try:
                          _,artifact_data=call("GET",f"/repos/{repo}/actions/runs/{run['id']}/artifacts?per_page=100")
                          artifacts=[item for item in artifact_data.get("artifacts",[]) if not item.get("expired")]
                          if artifacts and all(item.get("digest") for item in artifacts):
                              artifact_digest=";".join(sorted(f"{item.get('name','unnamed')}={item['digest']}" for item in artifacts))
                      except Exception as exc:
                          j["artifact_monitor_error"]=type(exc).__name__
                      # If the POST response was lost but the child run is now
                      # correlated by its unique dispatch ID, record reconciliation.
                      if j["dispatch_status"]=="UNKNOWN":
                          j["dispatch_status"]="RECONCILED"
                          print(f"Reconciled ambiguous dispatch for {j['workflow']} using child run {run['id']}")
                      results[did]={"run_id":run["id"],"url":run.get("html_url"),"status":run["status"],"conclusion":run.get("conclusion"),"job_ids":job_ids,"jobs_success":jobs_success,"artifact_digest":artifact_digest}
                      print(f"Child {j['workflow']} run_id={run['id']} conclusion={run.get('conclusion')} jobs={job_ids} artifacts={artifact_digest}"); del pending[did]
              if pending: time.sleep(10)
          for did,j in pending.items():
              results[did]={"status":"NOT_COMPLETED_BEFORE_TIMEOUT","conclusion":"failure"}
              print(f"::error::Child {j['workflow']} correlation_id={did} NOT_COMPLETED_BEFORE_TIMEOUT")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as out:
              out.write("\n## GitHub API child dispatch results\n\n- Shared immutable target SHA: `"+target+"`\n\n| Workflow | Correlation ID | Dispatch | Run ID | Conclusion | Child jobs | Artifact digests |\n|---|---|---|---:|---|---|---|\n")
              for j in jobs:
                  r=results.get(j["id"],{})
                  out.write(f"| {j['workflow']} | `{j['id']}` | {j['dispatch_status']} | {r.get('run_id','NOT FOUND')} | {r.get('conclusion',r.get('status','UNKNOWN'))} | {r.get('job_ids','NOT_VERIFIED')} | {r.get('artifact_digest','NOT_VERIFIED')} |\n")
          if len(jobs)!=expected_count or any(j["dispatch_status"] not in ("ACCEPTED","RECONCILED") for j in jobs) or any(results.get(j["id"],{}).get("conclusion")!="success" or not results.get(j["id"],{}).get("jobs_success",False) or results.get(j["id"],{}).get("artifact_digest")=="NOT_VERIFIED" for j in jobs):
              print("::error::Dispatch incomplete: at least one selected child failed, could not be correlated, or lacked verified job/artifact evidence."); sys.exit(1)
          PY
