name: MediaHub Contour A — Gemini GitHub transport batch

run-name: Gemini controller-only batch — Wave 292

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Use the no-secret caller-context probe by default; agent execution is a separate explicit mode"
        required: true
        type: choice
        options:
          - "probe"
          - "agents"
        default: "probe"
      confirm:
        description: "Explicitly confirm starting three bounded Gemini jobs (agents mode only)"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/gemini-batch-dispatch-controller.yml"
      - ".github/workflows/gemini-autonomous-engineering.yml"
      - ".github/workflows/gemini-agent-2.yml"
      - ".github/workflows/gemini-agent-3.yml"
      - "tests/test_gemini_controller_positive_context_probe_wave292_contract.py"

# Caller permissions are the ceiling for reusable workflows. No transport token
# is needed: child workflows execute as jobs in this same controller run.
permissions: {}

concurrency:
  group: mediahub-gemini-controller-batch
  cancel-in-progress: false

jobs:
  agent1:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'agents' && inputs.confirm == 'yes'
    name: Agent 1 — bounded engineering
    uses: ./.github/workflows/gemini-autonomous-engineering.yml
    with:
      task: >-
        Wave 243 / agent-1: perform one bounded, evidence-backed Contour A
        engineering task. Read the canonical map, bootstrap, checkpoint and
        Master Roadmap as needed; preserve Baseline 2.0, authority boundaries,
        and provenance. Create one isolated Draft PR only. No merge, deployment,
        qualification, additional model calls, or workflow dispatch.
      base_ref: main
      scope: contour-a
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    permissions:
      contents: write
      pull-requests: write
      issues: read

  agent2:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'agents' && inputs.confirm == 'yes'
    name: Agent 2 — research and architecture
    uses: ./.github/workflows/gemini-agent-2.yml
    with:
      task: >-
        Wave 243 / agent-2: perform one bounded Contour A research/architecture
        task with exact source refs and blob SHAs. Separate verified facts from
        hypotheses; create one isolated Draft PR only. No merge, deployment,
        qualification, additional model calls, or workflow dispatch.
      base_ref: main
      scope: contour-a
    secrets:
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
    permissions:
      contents: write
      pull-requests: write
      issues: read

  agent3:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'agents' && inputs.confirm == 'yes'
    name: Agent 3 — security and verification review
    uses: ./.github/workflows/gemini-agent-3.yml
    with:
      task: >-
        Wave 243 / agent-3: perform one bounded security and verification review
        of Contour A with exact source refs, blob SHAs, test evidence, and open
        risks. Do not claim independent review of work you authored. Create one
        isolated Draft PR only. No merge, deployment, qualification, additional
        model calls, or workflow dispatch.
      base_ref: main
      scope: contour-a
    secrets:
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
    permissions:
      contents: write
      pull-requests: write
      issues: read

  probe:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'probe')
    name: No-secret reusable caller-context probe
    uses: ./.github/workflows/gemini-reusable-context-probe-wave284.yml
    permissions: {}

  assert_probe_context:
    if: always() && (github.event_name == 'pull_request' || inputs.mode == 'probe')
    name: Assert positive dispatch or negative PR caller context
    needs: probe
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Assert caller context and emit safe evidence
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          OBSERVED_EVENT_NAME: ${{ needs.probe.outputs.caller_event_name }}
          OBSERVED_WORKFLOW_REF: ${{ needs.probe.outputs.caller_workflow_ref }}
          OBSERVED_TRUSTED_CONTROLLER: ${{ needs.probe.outputs.caller_trusted_controller }}
          TRUSTED_CONTROLLER_REF: 'VlDMlNSh/mediahub-os/.github/workflows/gemini-batch-dispatch-controller.yml@refs/heads/main'
        run: |
          set -euo pipefail
          printf 'Caller event: %s\n' "$OBSERVED_EVENT_NAME"
          printf 'Caller workflow ref: %s\n' "$OBSERVED_WORKFLOW_REF"
          printf 'Trusted controller: %s\n' "$OBSERVED_TRUSTED_CONTROLLER"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$OBSERVED_EVENT_NAME" == "workflow_dispatch" ]]
            [[ "$OBSERVED_WORKFLOW_REF" == "$TRUSTED_CONTROLLER_REF" ]]
            [[ "$OBSERVED_TRUSTED_CONTROLLER" == "true" ]]
          else
            [[ "$EVENT_NAME" == "pull_request" ]]
            [[ "$OBSERVED_EVENT_NAME" == "pull_request" ]]
            [[ "$OBSERVED_WORKFLOW_REF" == *"/.github/workflows/gemini-batch-dispatch-controller.yml@refs/pull/"* ]]
            [[ "$OBSERVED_TRUSTED_CONTROLLER" == "false" ]]
          fi
          {
            echo "## Non-launching controller caller-context probe"
            echo
            echo "- Trigger event: $EVENT_NAME"
            echo "- Observed caller event: $OBSERVED_EVENT_NAME"
            echo "- Observed workflow ref: $OBSERVED_WORKFLOW_REF"
            echo "- Trusted controller: $OBSERVED_TRUSTED_CONTROLLER"
            echo "- Provider secret mapped to probe: no"
            echo "- Model/provider job reachable in probe mode: no"
          } >> "$GITHUB_STEP_SUMMARY"

  summarize:
    if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'agents' && inputs.confirm == 'yes'
    name: Fail-closed batch summary
    needs: [agent1, agent2, agent3]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Record reusable-workflow conclusions
        shell: bash
        env:
          AGENT1_RESULT: ${{ needs.agent1.result }}
          AGENT2_RESULT: ${{ needs.agent2.result }}
          AGENT3_RESULT: ${{ needs.agent3.result }}
        run: |
          set -euo pipefail
          {
            echo "## Gemini controller-only batch"
            echo
            echo "- Controller run ID: ${GITHUB_RUN_ID}"
            echo "- Controller workflow ref: ${GITHUB_WORKFLOW_REF}"
            echo
            echo "| Child workflow | Job conclusion |"
            echo "|---|---|"
            echo "| gemini-autonomous-engineering.yml | ${AGENT1_RESULT} |"
            echo "| gemini-agent-2.yml | ${AGENT2_RESULT} |"
            echo "| gemini-agent-3.yml | ${AGENT3_RESULT} |"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${AGENT1_RESULT}" != "success" || "${AGENT2_RESULT}" != "success" || "${AGENT3_RESULT}" != "success" ]]; then
            echo "::error::At least one reusable child workflow did not succeed; batch fails closed."
            exit 1
          fi
          echo "All three reusable child workflows succeeded. Their jobs and artifacts are attached to controller run ${GITHUB_RUN_ID}; review outputs independently."
