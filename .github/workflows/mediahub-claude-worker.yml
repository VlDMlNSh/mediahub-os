name: MediaHub Claude bounded worker via OpenRouter

on:
  workflow_dispatch:
    inputs:
      task_prompt:
        description: "Bounded development task"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mediahub-claude-worker
  cancel-in-progress: false

jobs:
  claude:
    if: vars.MEDIAHUB_ALLOW_METERED_OPENROUTER == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_BASE_URL: https://openrouter.ai/api
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_API_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Trust workspace for non-interactive Claude Code
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import json
          from pathlib import Path
          path = Path.home() / ".claude.json"
          data = {}
          if path.exists():
              data = json.loads(path.read_text())
          projects = data.setdefault("projects", {})
          projects.setdefault("/home/runner/work/mediahub-os/mediahub-os", {})["hasTrustDialogAccepted"] = True
          path.write_text(json.dumps(data, sort_keys=True, indent=2) + "\n")
          PY2

      - name: Run bounded Claude worker
        env:
          TASK_PROMPT: ${{ inputs.task_prompt }}
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY}"
          test -n "${ANTHROPIC_AUTH_TOKEN}"
          python3 - <<'PY'
          import os, re
          p = os.environ["TASK_PROMPT"]
          if not p.strip() or len(p) > 12000:
              raise SystemExit("invalid task prompt")
          if re.search(r"(?i)(api[_ -]?key|secret|password|token|credential|authorization|bearer)", p):
              raise SystemExit("credential-bearing prompt rejected")
          PY
          claude --version
          claude auth status || true
          set +e
          claude --print --output-format text \
            --bare \
            --allowed-tools "Read,Glob,Grep,Edit,Write" \
            --disallowed-tools "Bash,WebFetch,WebSearch,NotebookEdit" \
            --permission-mode acceptEdits \
            --append-system-prompt "Bounded MediaHub development worker. Work only inside the checked-out repository. Do not use shell commands, network access, credentials, destructive operations, git mutations, commits, pushes, or production actions. Make only the requested bounded code changes and report the result." \
            --debug-file .mediahub-claude-debug.log \
            "${TASK_PROMPT}" > .mediahub-claude-result.txt 2> .mediahub-claude-stderr.txt
          rc=$?
          set -e
          echo "CLAUDE_EXIT_CODE=${rc}"
          cat .mediahub-claude-stderr.txt || true
          tail -n 120 .mediahub-claude-debug.log || true
          exit "${rc}"

      - name: Credential-free evidence check
        run: |
          set -euo pipefail
          if grep -Eiq '(sk-ant-|ANTHROPIC_API_KEY=|Authorization: Bearer|api[_-]?key[[:space:]]*[:=]|password[[:space:]]*[:=])' .mediahub-claude-result.txt; then
            echo "credential material detected in evidence"
            exit 1
          fi
          test -s .mediahub-claude-result.txt

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@v4
        with:
          name: mediahub-claude-worker-evidence-${{ github.run_id }}
          path: |
            .mediahub-claude-result.txt
          retention-days: 7
