name: Astra Cloud Runtime Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [astra-cloud-bootstrap]

jobs:
  validate:
    name: Astra Cloud Runtime Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
      - name: Validate contracts
        run: python3 tools/validate_contracts.py
      - name: Astra cloud runtime tests
        env:
          PYTHONPATH: ${{ github.workspace }}/runtime
        run: python3 -m pytest -q tests/test_cloud_admission.py tests/ai/test_cloud_orchestrator_failover.py
