name: Astra Cloud Runtime Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [astra-cloud-bootstrap]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate contracts
        run: python3 tools/validate_contracts.py
      - name: Astra Cloud AI tests
        run: python3 -m unittest discover -s tests/ai -p 'test_*.py'
