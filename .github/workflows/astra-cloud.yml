name: Astra Cloud Runtime Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [astra-cloud-bootstrap]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate contracts
        run: python3 tools/validate_contracts.py
      - name: Install Python qualification dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input PyYAML
      - name: Astra Cloud tests
        run: python3 -m unittest -v tests.test_cloud_admission tests.test_hybrid_agent_auth_probe
