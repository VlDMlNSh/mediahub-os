name: Astra Verify

on:
  push:
    branches: [main]
    paths-ignore:
      - "ops/mesh/**"
      - "ops/p2p/**"
      - "architecture/mesh/**"
      - "tests/test_mesh_*.py"
      - "tests/test_p2p_*.py"
  pull_request:
    branches: [main]
    paths-ignore:
      - "ops/mesh/**"
      - "ops/p2p/**"
      - "architecture/mesh/**"
      - "tests/test_mesh_*.py"
      - "tests/test_p2p_*.py"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check --no-input PyYAML
      - name: Install torrent test dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends transmission-cli
      - name: Compile
        run: python -m compileall -q .
      - name: Cloud admission unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Signed command smoke test
        env:
          ASTRA_COMMAND_HMAC_KEY: smoke-test-key
        run: |
          python tools/sign_astra_command.py smoke-node health > /tmp/command.json
          python - <<'PY'
          import json
          c=json.load(open("/tmp/command.json"))
          assert c["node_id"] == "smoke-node"
          assert c["operation"] == "health"
          assert len(c["signature"]) == 64
          PY

  gemini_caller_context_probe:
    name: Non-launching reusable caller-context probe
    uses: ./.github/workflows/gemini-caller-context-probe.yml
    permissions: {}

  assert_gemini_caller_context_probe:
    name: Assert non-controller caller is denied
    if: always()
    needs: [gemini_caller_context_probe]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require guarded job to be skipped for this caller
        shell: bash
        env:
          GUARDED_RESULT: ${{ needs.gemini_caller_context_probe.outputs.guarded_job_result }}
          CALLER_EVENT_NAME: ${{ needs.gemini_caller_context_probe.outputs.caller_event_name }}
          CALLER_WORKFLOW_REF: ${{ needs.gemini_caller_context_probe.outputs.caller_workflow_ref }}
        run: |
          set -euo pipefail
          expected='VlDMlNSh/mediahub-os/.github/workflows/gemini-batch-dispatch-controller.yml@refs/heads/main'
          [[ -n "$CALLER_EVENT_NAME" ]]
          [[ -n "$CALLER_WORKFLOW_REF" ]]
          if [[ "$GUARDED_RESULT" != "skipped" ]]; then
            echo "::error::Non-controller caller was not denied (job result: $GUARDED_RESULT)."
            exit 1
          fi
          if [[ "$CALLER_EVENT_NAME" == "workflow_dispatch" && "$CALLER_WORKFLOW_REF" == "$expected" ]]; then
            echo "::error::Probe unexpectedly used the authorized controller context."
            exit 1
          fi
          {
            echo "## Non-controller caller was denied"
            echo
            echo "- Observed event: $CALLER_EVENT_NAME"
            echo "- Observed workflow ref: $CALLER_WORKFLOW_REF"
            echo "- Guarded sentinel job result: $GUARDED_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
