name: Astra Verify

on:
  push:
    branches: [main]
    paths-ignore:
      - "ops/mesh/**"
      - "ops/p2p/**"
      - "architecture/mesh/**"
      - "tests/test_mesh_*.py"
      - "tests/test_p2p_*.py"
  pull_request:
    branches: [main]
    paths-ignore:
      - "ops/mesh/**"
      - "ops/p2p/**"
      - "architecture/mesh/**"
      - "tests/test_mesh_*.py"
      - "tests/test_p2p_*.py"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check --no-input PyYAML
      - name: Install torrent test dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends transmission-cli
      - name: Lint controller and Gemini reusable workflows
        run: >-
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          .github/workflows/astra-verify.yml
          .github/workflows/gemini-batch-dispatch-controller.yml
          .github/workflows/gemini-autonomous-engineering.yml
          .github/workflows/gemini-agent-2.yml
          .github/workflows/gemini-agent-3.yml

      - name: Compile
        run: python -m compileall -q .
      - name: Gemini reusable-workflow contract tests
        run: python -m unittest discover -s tests -p 'test_gemini_reusable_workflow_contract.py'
      - name: Cloud admission unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Signed command smoke test
        env:
          ASTRA_COMMAND_HMAC_KEY: smoke-test-key
        run: |
          python tools/sign_astra_command.py smoke-node health > /tmp/command.json
          python - <<'PY'
          import json
          c=json.load(open("/tmp/command.json"))
          assert c["node_id"] == "smoke-node"
          assert c["operation"] == "health"
          assert len(c["signature"]) == 64
          PY
