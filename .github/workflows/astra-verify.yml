name: Astra Verify

on:
  push:
    branches: [main]
    paths-ignore:
      - "ops/mesh/**"
      - "ops/p2p/**"
      - "architecture/mesh/**"
      - "tests/test_mesh_*.py"
      - "tests/test_p2p_*.py"
  pull_request:
    branches: [main]
    paths-ignore:
      - "ops/mesh/**"
      - "ops/p2p/**"
      - "architecture/mesh/**"
      - "tests/test_mesh_*.py"
      - "tests/test_p2p_*.py"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
      - name: Install torrent test dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends transmission-cli
      - name: Compile
        run: python -m compileall -q .
      - name: Cloud admission unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Signed command smoke test
        env:
          ASTRA_COMMAND_HMAC_KEY: smoke-test-key
        run: |
          python tools/sign_astra_command.py smoke-node health > /tmp/command.json
          python - <<'PY'
          import json
          c=json.load(open("/tmp/command.json"))
          assert c["node_id"] == "smoke-node"
          assert c["operation"] == "health"
          assert len(c["signature"]) == 64
          PY
