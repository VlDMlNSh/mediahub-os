name: Astra Verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python qualification dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-input PyYAML

      - name: Compile
        run: python -m compileall -q .
      - name: Cloud admission unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Signed command smoke test
        env:
          ASTRA_COMMAND_HMAC_KEY: smoke-test-key
        run: |
          python tools/sign_astra_command.py smoke-node health > /tmp/command.json
          python - <<'PY'
          import json
          c=json.load(open("/tmp/command.json"))
          assert c["node_id"] == "smoke-node"
          assert c["operation"] == "health"
          assert len(c["signature"]) == 64
          PY
