name: MediaHub reconciled P0-08 verification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      verification_sha:
        description: 'Exact reconciliation commit SHA to verify'
        required: true
        default: 'cae0f0098b49f9bae9476c8dd47a0acdd0a15f53'
        type: string

permissions:
  contents: read

jobs:
  verification:
    name: Reconciled P0-07 + P0-08 verification
    runs-on: [self-hosted, mediahub-runner]
    timeout-minutes: 30
    steps:
      - name: Checkout exact verification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.verification_sha }}
          fetch-depth: 1

      - name: Verify runner, exact head, and clean worktree
        shell: bash
        run: |
          set -eu
          test "$(id -un)" = "mediahub-runner"
          test "$(id -u)" = "1001"
          test "$(id -g)" = "1001"
          test "$(hostname)" = "mh-dev-01"
          if sudo -n true >/dev/null 2>&1; then
            echo 'ERROR: runner has passwordless sudo capability'
            exit 1
          fi
          expected='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.verification_sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          test -z "$(git status --short)"
          echo "verified_commit=$actual"

      - name: Verify frozen P0-03 through P0-07 integrity
        shell: bash
        run: |
          set -eu
          test "$(git rev-parse HEAD:runtime/mediahub_runtime/proposals.py)" = "0fc1ea9b9f5e16ee4dae9bf25faf885f1b0d7a8a"
          test -f runtime/mediahub_runtime/in_memory_state.py
          test -f runtime/mediahub_runtime/consumer_boundary.py
          test -f runtime/mediahub_runtime/authorization.py
          test -f runtime/mediahub_runtime/configuration_policy.py
          test -f runtime/mediahub_runtime/policy_evaluator.py
          echo 'frozen_p0_03_to_p0_07=STRUCTURALLY_PRESENT'
          echo 'frozen_p0_06_proposals=UNCHANGED'

      - name: Targeted P0-07 tests
        shell: bash
        run: |
          set -eu
          PYTHONPATH=runtime:. python3 -m pytest \
            tests/runtime/test_configuration_policy.py \
            tests/runtime/test_configuration_policy_authorization.py \
            tests/runtime/test_policy_evaluator.py \
            tests/runtime/test_configuration_policy_operations.py \
            tests/runtime/test_p0_07_security_invariants.py -v

      - name: Targeted P0-08 tests
        shell: bash
        run: |
          set -eu
          PYTHONPATH=runtime:. python3 -m pytest \
            tests/runtime/test_plugin_manifest.py \
            tests/runtime/test_plugin_capabilities.py \
            tests/runtime/test_plugin_boundary.py \
            tests/runtime/test_plugin_authorization.py \
            tests/runtime/test_plugin_lifecycle.py \
            tests/runtime/test_p0_08_lifecycle_security.py \
            tests/runtime/test_plugin_resources.py \
            tests/runtime/test_plugin_proposals.py \
            tests/runtime/test_p0_08_security_invariants.py -v

      - name: Forbidden capability and persistence scan
        shell: bash
        run: |
          set -eu
          python3 - <<'PY'
          import ast
          from pathlib import Path

          files = [p for p in Path('runtime/mediahub_runtime').glob('plugin_*.py')]
          forbidden_modules = {'subprocess','socket','requests','urllib','http.client','sqlite3','sqlalchemy','shelve','dbm','pickle','shutil'}
          forbidden_calls = {'system','popen','Popen','check_output','check_call','create_subprocess','eval','exec','compile','open','write_text','write_bytes','urlopen','create_engine'}
          for path in files:
              tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import) and any(a.name in forbidden_modules for a in node.names):
                      raise SystemExit(f'{path}: forbidden import')
                  if isinstance(node, ast.ImportFrom) and (node.module or '') in forbidden_modules:
                      raise SystemExit(f'{path}: forbidden import {node.module}')
                  if isinstance(node, ast.Call):
                      name = node.func.id if isinstance(node.func, ast.Name) else node.func.attr if isinstance(node.func, ast.Attribute) else None
                      if name in forbidden_calls:
                          raise SystemExit(f'{path}: forbidden call {name}')
          print('p0_08_capability_scan=PASS')
          print('p0_08_persistence_scan=PASS')
          PY

      - name: P0-08 authority binding scan
        shell: bash
        run: |
          set -eu
          python3 - <<'PY'
          import ast
          from pathlib import Path
          forbidden = {'StateAuthority','CanonicalStore','PersistenceHandle','MutableState','Checkpoint','Transaction'}
          for path in Path('runtime/mediahub_runtime').glob('plugin_*.py'):
              tree = ast.parse(path.read_text(encoding='utf-8'))
              names = {n.id for n in ast.walk(tree) if isinstance(n, ast.Name)}
              imports = {a.name.split('.')[-1] for n in ast.walk(tree) if isinstance(n, ast.Import) for a in n.names}
              imports |= {a.name for n in ast.walk(tree) if isinstance(n, ast.ImportFrom) for a in n.names}
              hit = forbidden & (names | imports)
              if hit:
                  raise SystemExit(f'{path}: forbidden authority/persistence names {sorted(hit)}')
          print('p0_08_authority_binding_scan=PASS')
          PY

      - name: Full regression
        shell: bash
        run: |
          set -eu
          PYTHONPATH=runtime:. python3 -m pytest tests/ -v

      - name: Final verification state
        if: ${{ always() }}
        shell: bash
        run: |
          set -u
          echo "commit=$(git rev-parse HEAD 2>/dev/null || echo unavailable)"
          git status --short 2>/dev/null || true
