name: MediaHub MH-04 verification readiness

on:
  push:
    branches:
      - 'dev/mh04/**'
  pull_request:
    branches:
      - 'recovery/full-functional-spec'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mh04-readiness:
    name: MH-04 contract and evidence readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify canonical MH-04 artifacts
        shell: bash
        run: |
          set -euo pipefail
          required=(
            architecture/MH-04-state-authority-implementation-gate.md
            verification/MH-04-verification-matrix-v1.0.yaml
            verification/MH-04-evidence-record.schema.yaml
            security/MH-04-authority-negative-test-matrix-v1.0.yaml
            verification/MH-04-candidate-api-to-v1.0-verification-map.md
          )
          for f in "${required[@]}"; do
            test -f "$f"
            echo "artifact_present=$f"
          done

      - name: Verify blocked-by-design guardrails
        shell: bash
        run: |
          set -euo pipefail
          gate='architecture/MH-04-state-authority-implementation-gate.md'
          grep -Fq 'Status: PROPOSED / NOT ACCEPTED' "$gate"
          grep -Fq 'IMPLEMENTATION AUTHORIZATION: BLOCKED' "$gate"
          grep -Fq 'State Authority is the sole canonical mutation authority' "$gate"
          echo 'architecture_acceptance=NOT_ACCEPTED'
          echo 'implementation_authorization=BLOCKED'
          echo 'shadow_authority_guard=present'

      - name: Verify verification matrix semantics
        shell: bash
        run: |
          set -euo pipefail
          matrix='verification/MH-04-verification-matrix-v1.0.yaml'
          grep -Fq 'implementation_authorization: BLOCKED' "$matrix"
          for id in V-01 V-02 V-03 V-04 V-05 V-06 V-07 V-08 V-09 V-10 V-11 V-12 V-13 V-14 V-15; do
            grep -Fq "id: $id" "$matrix"
          done
          grep -Fq 'V-13' "$matrix"
          grep -Fq 'physical_persistence_not_authorized_by_current_foundation' "$matrix"
          echo 'verification_cases=V-01..V-15_PRESENT'
          echo 'persistence_boundary=EXPLICITLY_BLOCKED'

      - name: Execute current static contract verification
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m unittest discover -s tests/static -p 'test_*.py' -v
          echo 'static_contract_verification=EXECUTED'

      - name: Evidence-only classification
        shell: bash
        run: |
          set -euo pipefail
          echo "git_sha=$(git rev-parse HEAD)"
          echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          echo "workflow_run=${GITHUB_RUN_ID}"
          echo 'classification=READINESS_ONLY'
          echo 'production_authorization=NOT_GRANTED'
          echo 'acceptance=NOT_GRANTED'
