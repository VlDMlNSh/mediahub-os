name: MediaHub MH-04 verification readiness

on:
  push:
    branches:
      - 'dev/mh04/**'
  pull_request:
    branches:
      - 'recovery/full-functional-spec'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mh04-readiness:
    name: MH-04 contract and evidence readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify canonical MH-04 artifacts
        shell: bash
        run: |
          set -euo pipefail
          required=(
            architecture/MH-04-state-authority-implementation-gate.md
            architecture/MH-04-state-authority-contract-v1.0.md
            verification/MH-04-verification-matrix-v1.0.yaml
            verification/MH-04-evidence-record.schema.yaml
            verification/MH-04-qualification-gate-v1.0.md
            security/MH-04-authority-negative-test-matrix-v1.0.yaml
            security/MH-04-supervisor-negative-test-contract-v1.0.yaml
            verification/MH-04-candidate-api-to-v1.0-verification-map.md
          )
          for f in "${required[@]}"; do
            test -f "$f"
            echo "artifact_present=$f"
          done

      - name: Verify accepted implementation scope and guardrails
        shell: bash
        run: |
          set -euo pipefail
          gate='architecture/MH-04-state-authority-implementation-gate.md'
          grep -Fq 'ACCEPTED FOR AUTHORIZED IN-MEMORY SCOPE' 'architecture/MH-04-state-authority-contract-v1.0.md'
          grep -Fq 'State Authority is the sole canonical mutation authority' "$gate"
          grep -Fq 'physical persistence' "$gate"
          grep -Fq 'production release' "$gate"
          qualification='verification/MH-04-qualification-gate-v1.0.md'
          grep -Fq 'Status: OPEN' "$qualification"
          grep -Fq 'V-13 recorded as BLOCKED' "$qualification"
          supervisor='security/MH-04-supervisor-negative-test-contract-v1.0.yaml'
          grep -Fq 'actual_runtime_execution_required' "$supervisor"
          grep -Fq 'independent_security_review_required' "$supervisor"
          echo 'architecture_acceptance=ACCEPTED_FOR_AUTHORIZED_SCOPE'
          echo 'implementation_authorization=AUTHORIZED_FOR_IN_MEMORY_SCOPE'
          echo 'production_authorization=NOT_GRANTED'
          echo 'persistence=BLOCKED_BY_SCOPE'

      - name: Verify verification matrix semantics
        shell: bash
        run: |
          set -euo pipefail
          matrix='verification/MH-04-verification-matrix-v1.0.yaml'
          for id in V-01 V-02 V-03 V-04 V-05 V-06 V-07 V-08 V-09 V-10 V-11 V-12 V-13 V-14 V-15; do
            grep -Fq "id: $id" "$matrix"
          done
          grep -Fq 'blocking_reason: physical_persistence_not_authorized_by_current_foundation' "$matrix"
          echo 'verification_cases=V-01..V-15_PRESENT'
          echo 'persistence_boundary=EXPLICITLY_BLOCKED'

      - name: Execute current static contract verification
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m unittest discover -s tests/static -p 'test_*.py' -v

      - name: Execute current runtime verification
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/runtime -p 'test_*.py' -v

      - name: Evidence identity
        shell: bash
        run: |
          set -euo pipefail
          echo "git_sha=$(git rev-parse HEAD)"
          echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          echo "workflow_run=${GITHUB_RUN_ID}"
          echo 'classification=RUNTIME_AND_CONTRACT_VERIFICATION'
          echo 'production_authorization=NOT_GRANTED'
          echo 'qualification=REVIEW_REQUIRED'
