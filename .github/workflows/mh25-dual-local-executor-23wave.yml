name: MH-25 dual local executor 23-wave qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mh25-dual-local-executor-23wave
  cancel-in-progress: false

jobs:
  qualify:
    name: 23-wave FCC / OmniRoute / ECC qualification
    runs-on: [self-hosted, macOS, ARM64, astra-control]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Create isolated G4 worktree
        shell: bash
        run: |
          set -euo pipefail
          g4_root="$RUNNER_TEMP/astra-g4-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          g4_output="$RUNNER_TEMP/astra-g4-output-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$g4_root" "$g4_output"
          git worktree add --detach "$g4_root" "$GITHUB_SHA"
          test "$(git -C "$g4_root" rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$g4_output"
          echo "G4_ROOT=$g4_root" >> "$GITHUB_ENV"
          echo "G4_OUTPUT_DIR=$g4_output" >> "$GITHUB_ENV"

      - name: Canonical preflight
        shell: bash
        working-directory: ${{ env.G4_ROOT }}
        run: |
          set -euo pipefail
          host="$(hostname)"
          test "$host" = "Voktors-Mini.Dlink" || test "$host" = "Voktors-Mac-mini"
          test -z "$(git status --short)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m compileall -q runtime tests astra_github_agent.py
      - name: Runtime identity and launcher inventory
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/.local/npm/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/npm/bin" >> "$GITHUB_PATH"
          id
          printf 'PATH=%s\n' "$PATH"
          for x in codex claude fcc-codex fcc-claude omniroute ecc ecc-cli; do
            if command -v "$x" >/tmp/mh25-"$x"-path 2>/dev/null; then
              printf '%s=' "$x"
              cat /tmp/mh25-"$x"-path
            else
              printf '%s=NOT_FOUND\n' "$x"
            fi
          done
      - name: Execute 23 qualification rounds
        shell: bash
        env:
          PYTHONPATH: ${{ env.G4_ROOT }}
          ASTRA_WORKTREE: ${{ env.G4_ROOT }}
          ASTRA_NODE_ID: Voktors-Mac-mini.local
          ASTRA_FCC_ENV_FILE: /Users/voktor/Library/Application Support/MediaHub/fcc.env
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/.local/npm/bin:$PATH"
          test -f "$ASTRA_FCC_ENV_FILE"
          omni_model="$(curl -fsS --max-time 8 http://127.0.0.1:20128/v1/models | python3 -c 'import json,sys; d=json.load(sys.stdin); rows=[x.get("id","") for x in d.get("data",[]) if isinstance(x,dict) and str(x.get("id","")).startswith("llama-cpp//") and "qwen2.5-coder-1.5b-instruct" in str(x.get("id",""))]; print(rows[0] if rows else "")')"
          test -n "$omni_model"
          export ASTRA_OMNIROUTE_MODEL="$omni_model"
          set -a
          . "$ASTRA_FCC_ENV_FILE"
          set +a
          export ASTRA_FCC_ENV_FILE
          test -n "${HOST:-}"
          test -n "${PORT:-}"
          test -n "${MODEL:-}"
          if ! curl -fsS --max-time 3 "http://${HOST}:${PORT}/health" >/dev/null 2>&1; then
            nohup fcc-server --host "$HOST" --port "$PORT" >/tmp/astra-g4-fcc-server.log 2>&1 &
            fcc_pid=$!
            cleanup() { kill "$fcc_pid" 2>/dev/null || true; }
            trap cleanup EXIT
            for _ in $(seq 1 30); do
              curl -fsS --max-time 2 "http://${HOST}:${PORT}/health" >/dev/null 2>&1 && break
              sleep 1
            done
          fi
          curl -fsS --max-time 5 "http://${HOST}:${PORT}/health" >/dev/null
          test -n "${ANTHROPIC_API_KEY:-}"
          python3 - <<'PY'
          import json, os
          import astra_github_agent as a
          command = {
              "command_id": "MH25-DUAL-EXECUTOR-23WAVE-${{ github.run_id }}",
              "node_id": os.environ["ASTRA_NODE_ID"],
              "operation": "dual_local_executor_23wave",
              "target_sha": "${{ github.sha }}",
              "workflow_only": False,
              "owned_paths": ["control/qualification/mh-dev-01-dual-local-executors"],
              "title": "MH-25 23-round FCC vs OmniRoute local executor qualification",
          }
          result = a.execute(command)
          output_dir = os.environ["G4_OUTPUT_DIR"]
          os.makedirs(output_dir, exist_ok=True)
          with open(os.path.join(output_dir, "result.json"), "w", encoding="utf-8") as f:
              json.dump(result, f, indent=2, sort_keys=True)
              f.write("\n")
          print(json.dumps({
              "status": result.get("status"),
              "phase": result.get("phase"),
              "node_id": result.get("node_id"),
              "rounds": len(result.get("rounds", [])),
              "summary": result.get("summary"),
              "selection_order": result.get("selection_order"),
              "selected_full_pass": result.get("selected_full_pass"),
              "ecc_policy": result.get("ecc_policy"),
          }, indent=2, sort_keys=True))
          raise SystemExit(0 if result.get("status") == "PASS" else 1)
          PY
      - name: Materialize canonical G4 evidence
        if: always()
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python3 ops/qualification/materialize_g4_evidence.py \
            "${G4_OUTPUT_DIR}/result.json" \
            "${G4_OUTPUT_DIR}/g4-115.json" \
            --expected-sha "${{ github.sha }}"
      - name: Independently verify G4 evidence
        if: always()
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python3 ops/qualification/verify_g4_115.py \
            "${G4_OUTPUT_DIR}/g4-115.json" \
            --expected-sha "${{ github.sha }}"
      - name: Publish qualification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mh25-dual-local-executor-23wave-${{ github.run_id }}
          path: ${{ env.G4_OUTPUT_DIR }}/
          retention-days: 30

      - name: Remove isolated G4 worktree
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set +e
          if [ -n "${G4_ROOT:-}" ] && git worktree list --porcelain | grep -Fq "worktree $G4_ROOT"; then
            git worktree remove --force "$G4_ROOT"
          fi
          if [ -n "${G4_OUTPUT_DIR:-}" ]; then
            rm -rf "$G4_OUTPUT_DIR"
          fi
