name: MediaHub boundary guard

on:
  push:
    paths:
      - "contracts/**"
      - "profiles/connectors/**"
      - "tools/validate_*.py"
      - "runtime/**"
      - "tests/runtime/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "contracts/**"
      - "profiles/connectors/**"
      - "tools/validate_*.py"
      - "runtime/**"
      - "tests/runtime/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python3 -m pip install --disable-pip-version-check pytest==7.4.4
      - run: python3 tools/validate_contracts.py
      - run: python3 tools/validate_connectors.py
      - run: python3 -m compileall -q runtime tools
      - run: PYTHONPATH=runtime python3 -m pytest -q tests/runtime
