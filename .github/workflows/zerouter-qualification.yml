name: Zerouter credential and model qualification
# Fresh qualification trigger 2026-09-29

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/zerouter-qualification.yml"
      - "runtime/mediahub_runtime/cloud_orchestrator.py"
      - "profiles/agent-registry.json"

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ZEROUTER_API_KEY: ${{ secrets.ZEROUTER_API_KEY }}
    steps:
      - name: Verify credential presence
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ZEROUTER_API_KEY}"
          echo '{"credential_present":true}'

      - name: Verify model catalog
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail-with-body --silent --show-error --max-time 20 -H "Authorization: Bearer ${ZEROUTER_API_KEY}" https://api.zerouter.ai/v1/models)"
          python3 - "$body" <<'PY'
          import json, sys
          data=json.loads(sys.argv[1])
          ids=[str(x.get("id","")) for x in data.get("data",[])]
          print(json.dumps({
              "status":"PASS",
              "model_count":len(ids),
              "claude_models":[x for x in ids if "claude" in x.lower()],
              "codex_or_gpt_models":[x for x in ids if ("codex" in x.lower() or "gpt" in x.lower())]
          }, sort_keys=True))
          PY

      - name: Verify OpenAI-compatible Codex/GPT path
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          code="$(curl --silent --show-error --max-time 30 -o "$tmp" -w '%{http_code}'             -H "Authorization: Bearer ${ZEROUTER_API_KEY}"             -H "Content-Type: application/json"             https://api.zerouter.ai/v1/responses             -d '{"model":"gpt-5.4","input":"Return exactly OK."}')"
          python3 - "$code" "$tmp" <<'PY'
          import json, sys
          code=int(sys.argv[1])
          body=json.load(open(sys.argv[2]))
          if 200 <= code < 300:
              out={"status":"PASS","http_status":code,"response_id":body.get("id","present")}
          elif code == 402:
              out={"status":"BLOCKED_BILLING","http_status":code,"reason":"gateway accepted credential but invocation requires available billing/credits"}
          elif code in (401,403):
              out={"status":"BLOCKED_AUTH","http_status":code}
          else:
              out={"status":"BLOCKED_RUNTIME","http_status":code,"error_type":body.get("error",{}).get("type")}
          print(json.dumps(out, sort_keys=True))
          if out["status"] == "BLOCKED_AUTH":
              raise SystemExit(1)
          PY

      - name: Verify Anthropic-compatible Claude path
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          code="$(curl --silent --show-error --max-time 30 -o "$tmp" -w '%{http_code}'             -H "Authorization: Bearer ${ZEROUTER_API_KEY}"             -H "Content-Type: application/json"             -H "anthropic-version: 2023-06-01"             https://api.zerouter.ai/v1/messages             -d '{"model":"claude-sonnet-5","max_tokens":32,"messages":[{"role":"user","content":"Return exactly OK."}]}')"
          python3 - "$code" "$tmp" <<'PY'
          import json, sys
          code=int(sys.argv[1])
          body=json.load(open(sys.argv[2]))
          if 200 <= code < 300:
              out={"status":"PASS","http_status":code,"response_id":body.get("id","present")}
          elif code == 402:
              out={"status":"BLOCKED_BILLING","http_status":code,"reason":"gateway accepted credential but invocation requires available billing/credits"}
          elif code in (401,403):
              out={"status":"BLOCKED_AUTH","http_status":code}
          else:
              out={"status":"BLOCKED_RUNTIME","http_status":code,"error_type":body.get("error",{}).get("type")}
          print(json.dumps(out, sort_keys=True))
          if out["status"] == "BLOCKED_AUTH":
              raise SystemExit(1)
          PY
