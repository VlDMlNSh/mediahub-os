name: MediaHub Trusted Provider Qualification

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider lane to qualify
        required: true
        type: choice
        options: [openai, anthropic, gemini, openrouter, groq, together, huggingface]
      model:
        description: Provider model identifier
        required: true
        type: string

permissions:
  contents: read

# Manual trusted lane only. Never run from attacker-controlled PR state.
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PROVIDER: ${{ inputs.provider }}
      MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify provider-plane contracts
        run: python3 -m pytest -q tests/test_mediahub_provider_plane.py tests/test_mediahub_provider_gateway.py tests/test_mediahub_provider_adapters.py
      - name: Validate selected credential presence
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          case "$PROVIDER" in
            openai) test -n "$OPENAI_API_KEY" ;;
            anthropic) test -n "$ANTHROPIC_API_KEY" ;;
            gemini) test -n "$GEMINI_API_KEY" ;;
            openrouter) test -n "$OPENROUTER_API_KEY" ;;
            groq) test -n "$GROQ_API_KEY" ;;
            together) test -n "$TOGETHER_API_KEY" ;;
            huggingface) test -n "$HF_TOKEN" ;;
            *) echo unsupported-provider >&2; exit 2 ;;
          esac
      - name: Evidence identity
        if: always()
        run: |
          echo "commit=$(git rev-parse HEAD)"
          echo "provider=$PROVIDER"
          echo "model=$MODEL"
          echo credential_value=SUPPRESSED
