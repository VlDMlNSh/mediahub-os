name: MediaHub P0-07 verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p0-07-verification:
    name: P0-07 exact-head verification
    runs-on: [self-hosted, mediahub-runner]
    timeout-minutes: 30
    steps:
      - name: Checkout exact P0-07 verification baseline
        uses: actions/checkout@v4
        with:
          ref: 249d9f4a604d20ba770b93f31e0db47af1f20228
          fetch-depth: 1

      - name: Verify runner, repository, exact head, and clean worktree
        shell: bash
        run: |
          set -eu
          test "$(id -un)" = "mediahub-runner"
          test "$(id -u)" = "1001"
          test "$(id -g)" = "1001"
          test "$(hostname)" = "mh-dev-01"
          if sudo -n true >/dev/null 2>&1; then
            echo 'ERROR: runner has passwordless sudo capability'
            exit 1
          fi
          expected='249d9f4a604d20ba770b93f31e0db47af1f20228'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          test -z "$(git status --short)"
          echo "host=$(hostname)"
          echo "user=$(id -un)"
          echo "uid=$(id -u)"
          echo "gid=$(id -g)"
          echo "verified_commit=$actual"
          echo 'worktree=clean'

      - name: Targeted P0-07 tests
        shell: bash
        run: |
          set -eu
          PYTHONPATH=runtime:. python3 -m pytest \
            tests/runtime/test_configuration_policy.py \
            tests/runtime/test_configuration_policy_authorization.py \
            tests/runtime/test_policy_evaluator.py \
            tests/runtime/test_configuration_policy_operations.py \
            tests/runtime/test_p0_07_security_invariants.py -v

      - name: P0-07 forbidden capability and persistence scan
        shell: bash
        run: |
          set -eu
          files='runtime/mediahub_runtime/configuration_policy.py runtime/mediahub_runtime/configuration_policy_authorization.py runtime/mediahub_runtime/policy_evaluator.py runtime/mediahub_runtime/configuration_policy_operations.py runtime/mediahub_runtime/proposal_plugin_boundary.py'
          if grep -nE '(^|[[:space:]])(import|from)[[:space:]]+(subprocess|socket|requests|urllib|http\.client)([[:space:]]|$)' $files; then
            echo 'forbidden external-execution-or-network import detected'
            exit 1
          fi
          if grep -nE '(subprocess\.|socket\.|os\.system|os\.popen|Popen\(|check_output\(|check_call\(|create_subprocess|eval\(|exec\()' $files; then
            echo 'forbidden execution capability detected'
            exit 1
          fi
          if grep -nE '(^|[[:space:]])(import|from)[[:space:]]+(sqlite3|sqlalchemy|shelve|dbm|pickle)([[:space:]]|$)' $files; then
            echo 'persistence/unsafe-serialization import detected'
            exit 1
          fi
          if grep -nE '(sqlite3\.|create_engine\(|write_text\(|write_bytes\(|\.write\(|shelve\.|dbm\.)' $files; then
            echo 'filesystem/persistence capability detected'
            exit 1
          fi
          if grep -nE '(requests\.|urllib\.|http\.client|urlopen\(|Path\([^)]*\)\.write|open\()' $files; then
            echo 'external I/O capability detected'
            exit 1
          fi
          echo 'p0_07_capability_scan=PASS'
          echo 'p0_07_persistence_scan=PASS'

      - name: Frozen-layer integrity scan
        shell: bash
        run: |
          set -eu
          test "$(git rev-parse HEAD:runtime/mediahub_runtime/proposals.py)" = "$(git rev-parse 0fc1ea9b9f5e16ee4dae9bf25faf885f1b0d7a8a:runtime/mediahub_runtime/proposals.py)"
          echo 'frozen_p0_06_proposals=UNCHANGED'

      - name: Full regression
        shell: bash
        run: |
          set -eu
          PYTHONPATH=runtime:. python3 -m pytest tests/ -v

      - name: Final P0-07 verification state
        if: ${{ always() }}
        shell: bash
        run: |
          set -u
          echo '=== P0-07 VERIFICATION RESULT ==='
          echo "host=$(hostname)"
          echo "user=$(id -un)"
          echo "commit=$(git rev-parse HEAD 2>/dev/null || echo unavailable)"
          echo 'worktree:'
          git status --short 2>/dev/null || true
