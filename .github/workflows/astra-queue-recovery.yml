name: Astra queue recovery gate

on:
  push:
    paths:
      - ".github/workflows/astra-queue-recovery.yml"

permissions:
  contents: write

concurrency:
  group: astra-queue-recovery
  cancel-in-progress: false

jobs:
  release-and-run-canonical-qualification:
    runs-on: [self-hosted, mediahub-runner]
    timeout-minutes: 10
    steps:
      - name: Release only the bounded blocked qualification child
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, signal, time
          from pathlib import Path

          target = "astra_gold_executor.py"
          matches = []
          for entry in Path("/proc").iterdir():
              if not entry.name.isdigit():
                  continue
              try:
                  pid = int(entry.name)
                  raw = (entry / "cmdline").read_bytes().split(b"\0")
                  cmd = " ".join(x.decode(errors="replace") for x in raw if x)
              except (FileNotFoundError, PermissionError, ProcessLookupError):
                  continue
              if target in cmd and pid != os.getpid():
                  matches.append((pid, cmd))

          print("qualification_executor_matches=", len(matches))
          for pid, cmd in matches:
              print("pid=", pid, "cmd=", cmd[:300])

          if len(matches) == 0:
              print("qualification_executor=absent")
              raise SystemExit(0)
          if len(matches) != 1:
              raise SystemExit("BLOCK: expected exactly one canonical qualification executor")

          pid, _ = matches[0]
          os.kill(pid, signal.SIGTERM)
          deadline = time.time() + 10
          while time.time() < deadline:
              if not Path(f"/proc/{pid}").exists():
                  print("qualification_executor=terminated")
                  raise SystemExit(0)
              time.sleep(0.5)

          os.kill(pid, signal.SIGKILL)
          print("qualification_executor=force_terminated")
          PY

      - name: Checkout current main for canonical transport probe
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify canonical node identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "mh-dev-01"
          test "$(id -un)" = "mediahub-runner"
          echo "host=$(hostname)"
          echo "user=$(id -un)"
          echo "runner_identity=PASS"
          echo "head=$(git rev-parse HEAD)"

      - name: Execute pending Astra command through canonical worker code
        shell: bash
        env:
          ASTRA_GITHUB_REPO: VlDMlNSh/mediahub-os
          ASTRA_NODE_ID: mh-dev-01
          ASTRA_WORKTREE: /home/mediahub/astra-work
          ASTRA_POLL_SECONDS: "15"
        run: |
          set -euo pipefail
          test -f astra_github_agent.py
          timeout --signal=TERM --kill-after=20s 180s python3 astra_github_agent.py &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          deadline=$(( $(date +%s) + 165 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if git ls-remote --heads origin astra-node/mh-dev-01 | grep -q .; then
              echo "worker_result_branch_observed=true"
              break
            fi
            sleep 10
          done
          wait "$worker_pid" || true

      - name: Verify fresh result provenance
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "astra-node/mh-dev-01"
          git show "origin/astra-node/mh-dev-01:control/results/mh-dev-01.json" > /tmp/mh-dev-01-result.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/mh-dev-01-result.json")
          r=json.loads(p.read_text())
          print("command_id=",r.get("command_id"))
          print("target_sha=",r.get("target_sha"))
          print("execution_head=",r.get("execution_head"))
          print("agent_source_sha=",r.get("result",{}).get("agent_source_sha", r.get("agent_source_sha")))
          print("completed_at=",r.get("completed_at"))
          assert r.get("command_id") == "astra-exec-backend-qualification-20260929T020000Z"
          assert r.get("node_id") == "mh-dev-01"
          PY

# qualification transport recovery wave: current main
