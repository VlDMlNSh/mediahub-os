name: Temporary PAT_DISPATCH smoke target

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accept-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm workflow_dispatch reached default-branch workflow
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          echo "PASS: default-branch workflow_dispatch received"
