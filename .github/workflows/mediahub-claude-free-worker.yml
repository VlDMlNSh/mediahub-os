name: MediaHub Claude-compatible free worker

on:
  workflow_dispatch:
    inputs:
      task_prompt:
        description: "Bounded development task"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mediahub-claude-free-worker
  cancel-in-progress: false

jobs:
  free_openrouter:
    if: vars.MEDIAHUB_ALLOW_FREE_OPENROUTER == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_BASE_URL: https://openrouter.ai/api
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_API_KEY: ""
      ANTHROPIC_MODEL: openrouter/free
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Trust workspace
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path.home() / ".claude.json"
          data = json.loads(path.read_text()) if path.exists() else {}
          data.setdefault("projects", {}).setdefault("/home/runner/work/mediahub-os/mediahub-os", {})["hasTrustDialogAccepted"] = True
          path.write_text(json.dumps(data, sort_keys=True, indent=2) + "\n")
          PY

      - name: Run bounded Claude-compatible free worker
        env:
          TASK_PROMPT: ${{ inputs.task_prompt }}
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY}"
          python3 - <<'PY'
          import os, re
          p = os.environ["TASK_PROMPT"]
          if not p.strip() or len(p) > 12000:
              raise SystemExit("invalid task prompt")
          if re.search(r"(?i)(api[_ -]?key|secret|password|token|credential|authorization|bearer)", p):
              raise SystemExit("credential-bearing prompt rejected")
          PY
          claude --print --output-format text --bare \
            --allowed-tools "Read,Glob,Grep,Edit,Write" \
            --disallowed-tools "Bash,WebFetch,WebSearch,NotebookEdit" \
            --permission-mode acceptEdits \
            --append-system-prompt "Bounded MediaHub worker. Work only inside the checked-out repository. Do not use shell commands, network access, credentials, destructive operations, git mutations, commits, pushes, or production actions. The model backend is OpenRouter free inference, not an Anthropic-paid model. Make only requested bounded changes and report the result." \
            "${TASK_PROMPT}" > .mediahub-claude-free-result.txt

      - name: Credential-free evidence check
        run: |
          set -euo pipefail
          if grep -Eiq '(sk-ant-|sk-or-v1-|ANTHROPIC_API_KEY=|OPENROUTER_API_KEY=|Authorization: Bearer|api[_-]?key[[:space:]]*[:=]|password[[:space:]]*[:=])' .mediahub-claude-free-result.txt; then
            echo "credential material detected in evidence"
            exit 1
          fi
          test -s .mediahub-claude-free-result.txt

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@v4
        with:
          name: mediahub-claude-free-worker-evidence-${{ github.run_id }}
          path: .mediahub-claude-free-result.txt
          retention-days: 7
