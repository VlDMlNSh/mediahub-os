name: MH-25 first 24h autonomous development queue
# Activation marker: queue task MH25-QUEUE-001

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mh25-first-24h-autonomous-development
  cancel-in-progress: false

jobs:
  first-24h-queue:
    name: First real 24h queue run
    runs-on: [self-hosted, linux, x64, mediahub-control]
    timeout-minutes: 1450
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Canonical runner preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "mh-dev-01"
          test "$(id -un)" = "mediahub-runner"
          test -z "$(git status --short)"
          test "$(git hash-object astra_github_agent.py)" = "$(git rev-parse HEAD:astra_github_agent.py)"
          python3 -m compileall -q runtime tests astra_github_agent.py
          PYTHONPATH=runtime:. python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Execute bounded autonomous queue waves for 24h
        shell: bash
        run: |
          set -euo pipefail
          export ASTRA_QUEUE_STATE_DIR="$RUNNER_TEMP/mh25-24h-queue-state"
          export ASTRA_CODEX_SANDBOX_MODE="danger-full-access"
          rm -rf "$ASTRA_QUEUE_STATE_DIR"
          mkdir -p "$ASTRA_QUEUE_STATE_DIR"
          test -w "$ASTRA_QUEUE_STATE_DIR"
          mkdir -p /tmp/mh25-24h
          start="$(date +%s)"
          end=$((start+86400))
          wave=0
          while [ "$(date +%s)" -lt "$end" ]; do
            wave=$((wave+1))
            echo "wave=$wave started=$(date -u +%FT%TZ)"
            git fetch origin "$GITHUB_REF_NAME" --depth=50
            git reset --hard "origin/$GITHUB_REF_NAME"
            set +e
            ASTRA_QUEUE_STATE_DIR="$ASTRA_QUEUE_STATE_DIR" PYTHONPATH=runtime:. python3 -m mediahub_runtime.autonomous_queue | tee "/tmp/mh25-24h/wave-$wave.log"
            rc=${PIPESTATUS[0]}
            set -e
            test "$rc" -eq 0
            if ! grep -Eq '"status": "(PASS|IDLE)"' "/tmp/mh25-24h/wave-$wave.log"; then
              echo "BLOCK: queue wave did not produce PASS or IDLE"
              exit 1
            fi
            sleep 600
          done
          test -n "$(find /tmp/mh25-24h -type f -name "wave-*.log" -print -exec grep -l '"status": "PASS"' {} \; | head -1)"
          echo "queue_24h=PASS"
      - name: Upload 24h queue evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mh25-first-24h-queue-${{ github.run_id }}
          path: /tmp/mh25-24h/
          retention-days: 14
