name: MediaHub MH-04 Runtime Tests

on:
  push:
    branches:
      - dev/mh04/state-authority-foundation
  workflow_dispatch:

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Runtime tests
        run: python3 -m unittest discover -s tests/runtime -p 'test_*.py' -v
      - name: Evidence identity
        run: |
          echo "git_sha=$(git rev-parse HEAD)"
          echo "branch=${GITHUB_REF_NAME}"
          echo "workflow_run=${GITHUB_RUN_ID}"
          echo "classification=RUNTIME_TEST_EXECUTION"
