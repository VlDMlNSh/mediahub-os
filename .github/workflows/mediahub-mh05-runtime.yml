name: MediaHub MH-05 Consumer Boundary Tests

on:
  push:
    branches:
      - 'dev/mh05/**'
      - 'remediation/mh05-r3-event-evidence'
  pull_request:
    branches:
      - 'recovery/full-functional-spec'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact implementation revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify governance authorization
        run: |
          grep -q 'ACCEPTED / IMPLEMENTATION AUTHORIZED' governance/MH-05-IMPLEMENTATION-AUTHORIZATION-2026-09-06.md
          grep -q 'does NOT authorize' governance/MH-05-IMPLEMENTATION-AUTHORIZATION-2026-09-06.md
          grep -q 'Consumer Boundary' architecture/MH-05-consumer-boundary-contract-v1.0.md || true
      - name: Run MH-05 runtime tests
        env:
          PYTHONPATH: runtime
        run: python3 -m unittest discover -s tests/runtime -p 'test_mh05_*.py' -v
      - name: Run full runtime regression
        env:
          PYTHONPATH: runtime
        run: python3 -m unittest discover -s tests/runtime -p 'test_*.py' -v
      - name: Record exact verification identity
        run: |
          echo "checked_out_commit=$(git rev-parse HEAD)"
          echo "event_commit=${GITHUB_SHA}"
          echo "pull_request_head_sha=${{ github.event.pull_request.head.sha || '' }}"
          echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          echo "workflow_run=${GITHUB_RUN_ID}"
          python3 --version
          echo 'qualification=EXECUTION_EVIDENCE_ONLY_NOT_APPROVAL'
