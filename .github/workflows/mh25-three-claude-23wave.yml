name: Astra Gold Three-Claude 23-Wave Qualification
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mh25-three-claude-23wave.yml
      - ops/qualification/run_claude_23wave.py
      - ops/qualification/verify_three_claude_23wave.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astra-gold-three-claude-23wave
  cancel-in-progress: false

jobs:
  claude-mh1:
    name: Claude executor / mh-dev-01
    runs-on: [self-hosted, linux, x64, mediahub-control]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Admission
        run: |
          set -euo pipefail
          test "$(hostname)" = "mh-dev-01"
          test "$(id -un)" = "mediahub-runner"
          command -v claude
          command -v ollama
          command -v fcc-server
          ollama show qwen2.5-coder:1.5b >/dev/null
      - name: 23 real Claude rounds
        run: |
          python3 ops/qualification/run_claude_23wave.py             --node mh-dev-01             --model qwen2.5-coder:1.5b             --marker MEDIAHUB_CLAUDE_MH1_23WAVE_OK             --output claude-mh1-23wave.jsonl             --env-file /home/mediahub/.config/mediahub/fcc.env             --fcc /home/mediahub/.local/bin/fcc-server
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-claude-mh1-23wave-${{ github.sha }}
          path: claude-mh1-23wave.jsonl
          if-no-files-found: error

  claude-mac:
    name: Claude executor / Voktors-Mac-mini
    runs-on: [self-hosted, macOS, ARM64, astra-control]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Admission
        run: |
          set -euo pipefail
          host="$(hostname)"
          test "$host" = "Voktors-Mini.Dlink" || test "$host" = "Voktors-Mac-mini"
          test "$(id -un)" = "voktor"
          command -v claude
          command -v ollama
          test -x "/Users/voktor/Library/Application Support/pipx/venvs/free-claude-code/bin/fcc-server"
          ollama show qwen2.5-coder:1.5b >/dev/null
      - name: 23 real Claude rounds
        run: |
          python3 ops/qualification/run_claude_23wave.py             --node Voktors-Mac-mini.local             --model qwen2.5-coder:1.5b             --marker MEDIAHUB_CLAUDE_MAC_23WAVE_OK             --output claude-mac-23wave.jsonl             --env-file "/Users/voktor/Library/Application Support/MediaHub/fcc.env"             --fcc "/Users/voktor/Library/Application Support/pipx/venvs/free-claude-code/bin/fcc-server"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-claude-mac-23wave-${{ github.sha }}
          path: claude-mac-23wave.jsonl
          if-no-files-found: error

  claude-mh2:
    name: Claude executor / mh-dev-02
    runs-on: [self-hosted, linux, x64, mediahub-provider]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Admission
        run: |
          set -euo pipefail
          test "$(hostname)" = "mh-dev-02"
          test "$(id -un)" = "mediahub"
          command -v claude
          command -v ollama
          command -v fcc-server
          ollama show qwen2.5-coder:3b >/dev/null
      - name: 23 real Claude rounds
        run: |
          python3 ops/qualification/run_claude_23wave.py             --node mh-dev-02             --model qwen2.5-coder:3b             --marker MEDIAHUB_CLAUDE_MH2_23WAVE_OK             --output claude-mh2-23wave.jsonl             --env-file /home/mediahub/.config/mediahub/fcc.env             --fcc /home/mediahub/.local/bin/fcc-server
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-claude-mh2-23wave-${{ github.sha }}
          path: claude-mh2-23wave.jsonl
          if-no-files-found: error

  aggregate:
    name: Aggregate three-Claude qualification
    needs: [claude-mh1, claude-mac, claude-mh2]
    if: ${{ always() }}
    runs-on: [self-hosted, linux, x64, mediahub-control]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: astra-claude-mh1-23wave-${{ github.sha }}
          path: evidence/mh1
      - uses: actions/download-artifact@v4
        with:
          name: astra-claude-mac-23wave-${{ github.sha }}
          path: evidence/mac
      - uses: actions/download-artifact@v4
        with:
          name: astra-claude-mh2-23wave-${{ github.sha }}
          path: evidence/mh2
      - name: Verify all three lanes
        run: |
          python3 ops/qualification/verify_three_claude_23wave.py             --mh1 evidence/mh1/claude-mh1-23wave.jsonl             --mac evidence/mac/claude-mac-23wave.jsonl             --mh2 evidence/mh2/claude-mh2-23wave.jsonl             --expected-sha "$GITHUB_SHA"
      - name: Write PASS evidence
        run: |
          printf 'THREE_CLAUDE_23WAVE=PASS\nG-5=3\ntarget_sha=%s\n' "$GITHUB_SHA" > three-claude-qualification.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-three-claude-23wave-${{ github.sha }}
          path: three-claude-qualification.txt
