name: Astra GOLD 24h real soak

on:
  workflow_dispatch:
    inputs:
      queue_command_id:
        description: "Fresh autonomous_queue PASS command_id for this exact commit"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: astra-gold-24h-real-soak
  cancel-in-progress: false

# GOLD is an explicit admission action. Ordinary repository changes must never
# start a new 24h soak.

jobs:
  preflight:
    name: GOLD preflight on canonical node
    runs-on: [self-hosted, linux, x64, mh-dev-01-canonical]
    timeout-minutes: 30
    outputs:
      target_sha: ${{ steps.queue_gate.outputs.target_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.target_sha }}
          fetch-depth: 1
      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
      - name: Verify prior autonomous queue PASS admission
        id: queue_gate
        shell: bash
        env:
          ASTRA_QUEUE_COMMAND_ID: ${{ inputs.queue_command_id }}
        run: |
          set -euo pipefail
          test -n "$ASTRA_QUEUE_COMMAND_ID"
          git fetch origin "+astra-node/mh-dev-01:refs/remotes/origin/astra-node/mh-dev-01"
          git show "origin/astra-node/mh-dev-01:control/results/mh-dev-01.json" > /tmp/astra-queue-result.json
          python3 - <<'PY'
          import json, os
          d=json.load(open("/tmp/astra-queue-result.json"))
          result=d.get("result", {})
          queue=result.get("queue", {})
          assert d.get("command_id") == os.environ["ASTRA_QUEUE_COMMAND_ID"]
          assert d.get("node_id") == "mh-dev-01"
          target_sha=d.get("target_sha")
          assert isinstance(target_sha, str) and len(target_sha) == 40
          assert d.get("execution_head") == target_sha
          assert d.get("returncode") == 0
          assert result.get("phase") == "autonomous_queue"
          assert result.get("status") == "PASS"
          assert queue.get("status") == "PASS"
          assert int(queue.get("workers", 0)) >= 1
          assert all(item.get("status") == "VERIFIED" for item in queue.get("results", []))
          Path(os.environ["GITHUB_OUTPUT"]).write_text(f"target_sha={target_sha}\n", encoding="utf-8")
          PY

      - name: Verify canonical runner identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "mh-dev-01"
          test "$(id -un)" = "mediahub-runner"
          test -z "$(git status --short)"
          # The canonical agent is continuously updated on main, so a hardcoded
          # blob literal cannot be maintained and only produces guaranteed drift.
          # Record the exact checked-out agent blob as fresh soak evidence; the
          # running worker is bound to this same file by
          # ops/qualification/verify_transport_health.py, which compares the
          # worker's reported agent_source_sha against the actual agent bytes.
          blob_sha="$(git hash-object astra_github_agent.py)"
          test -n "$blob_sha"
          echo "runner=$(hostname)"
          echo "agent_blob_sha=$blob_sha"
      - name: Verify existing canonical Astra worker
        shell: bash
        run: |
          set -euo pipefail
          pgrep -af "astra_github_agent.py" | tee /tmp/astra-workers.txt
          worker_pid="$(pgrep -u "$(id -u)" -f "astra_github_agent.py" | head -n1)"
          test -n "$worker_pid"
          test "$(ps -o user= -p "$worker_pid" | xargs)" = "$(id -un)"
          worker_sha="$(python3 -c 'import hashlib; print(hashlib.sha256(open("astra_github_agent.py","rb").read()).hexdigest())')"
          echo "worker_pid=$worker_pid" > /tmp/astra-worker-binding.env
          echo "worker_sha=$worker_sha" >> /tmp/astra-worker-binding.env
          echo "canonical_worker_present=true"
      - name: Repository and runtime regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q runtime tests astra_github_agent.py
          PYTHONPATH=runtime:. python3 -m pytest -q tests/
      - name: Preflight evidence
        if: always()
        run: |
          echo "phase=GOLD_PREFLIGHT"
          echo "commit=$(git rev-parse HEAD)"
          echo "worker_present=$(pgrep -f 'astra_github_agent.py' >/dev/null && echo true || echo false)"

  soak:
    name: 24h autonomous runtime soak
    needs: preflight
    runs-on: [self-hosted, linux, x64, mh-dev-01-canonical]
    timeout-minutes: 1450
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
      - name: Bind to the already-running canonical worker
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "mh-dev-01"
          test "$(id -un)" = "mediahub-runner"
          pgrep -af "astra_github_agent.py" | tee /tmp/astra-workers.txt
          worker_pid="$(pgrep -u "$(id -u)" -f "astra_github_agent.py" | head -n1)"
          test -n "$worker_pid"
          test "$(ps -o user= -p "$worker_pid" | xargs)" = "$(id -un)"
          worker_sha="$(python3 -c 'import hashlib; print(hashlib.sha256(open("astra_github_agent.py","rb").read()).hexdigest())')"
          echo "worker_pid=$worker_pid" > /tmp/astra-worker-binding.env
          echo "worker_sha=$worker_sha" >> /tmp/astra-worker-binding.env
          echo "duplicate_worker_launch=false"
      - name: Run first real test iteration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/astra-gold
          date -u +%FT%TZ > /tmp/astra-gold/started_at
          python3 -m compileall -q runtime tests astra_github_agent.py
          PYTHONPATH=runtime:. python3 -m pytest -q tests/ | tee /tmp/astra-gold/first-real-test.log
          pgrep -af "astra_github_agent.py" | tee /tmp/astra-gold/worker-after-first-test.txt
          echo "first_real_test=PASS"
      - name: Autonomous 24h verification loop
        shell: bash
        run: |
          set -euo pipefail
          end=$(( $(date +%s) + 86400 ))
          iteration=0
          while [ "$(date +%s)" -lt "$end" ]; do
            iteration=$((iteration+1))
            ts="$(date -u +%FT%TZ)"
            echo "iteration=$iteration timestamp=$ts"
            pgrep -af "astra_github_agent.py" | tee -a /tmp/astra-gold/worker.log
            test -s /tmp/astra-worker-binding.env
            . /tmp/astra-worker-binding.env
            test -d "/proc/$worker_pid"
            test "$(ps -o user= -p "$worker_pid" | xargs)" = "$(id -un)"
            current_worker_sha="$(python3 -c 'import hashlib; print(hashlib.sha256(open("astra_github_agent.py","rb").read()).hexdigest())')"
            test "$current_worker_sha" = "$worker_sha"
            PYTHONPATH=runtime:. python3 -m pytest -q tests/ | tee "/tmp/astra-gold/test-$iteration.log"
            test "$(pgrep -u "$(id -u)" -f "astra_github_agent.py" | wc -l)" -ge 1
            sleep 600
          done
          echo "soak_24h=PASS"
      - name: Sanitized GOLD evidence
        if: always()
        shell: bash
        run: |
          set -u
          echo "phase=GOLD_24H_SOAK"
          echo "commit=$(git rev-parse HEAD 2>/dev/null || echo unavailable)"
          echo "host=$(hostname)"
          echo "worker_present=$(pgrep -f 'astra_github_agent.py' >/dev/null && echo true || echo false)"
          echo "secret_values=SUPPRESSED"
      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-gold-24h-evidence-${{ github.run_id }}
          path: /tmp/astra-gold/
          retention-days: 14
