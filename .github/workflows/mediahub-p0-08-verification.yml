name: MediaHub P0-08 verification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      verification_sha:
        description: 'Exact P0-08 implementation commit SHA to verify'
        required: true
        default: '9829fd6c4cc104172167b88c8f95dd63b12ac9f2'
        type: string

permissions:
  contents: read

jobs:
  p0-08-verification:
    name: P0-08 exact-head verification
    runs-on: [self-hosted, mediahub-runner]
    timeout-minutes: 30
    steps:
      - name: Checkout exact P0-08 verification commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.verification_sha }}
          fetch-depth: 1

      - name: Verify runner, repository, exact head, and clean worktree
        shell: bash
        run: |
          set -eu
          test "$(id -un)" = "mediahub-runner"
          test "$(id -u)" = "1001"
          test "$(id -g)" = "1001"
          test "$(hostname)" = "mh-dev-01"
          if sudo -n true >/dev/null 2>&1; then
            echo 'ERROR: runner has passwordless sudo capability'
            exit 1
          fi
          expected='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.verification_sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          test -z "$(git status --short)"
          echo "host=$(hostname)"
          echo "user=$(id -un)"
          echo "uid=$(id -u)"
          echo "gid=$(id -g)"
          echo "verified_commit=$actual"
          echo 'worktree=clean'

      - name: Verify frozen P0-03 through P0-07 layer integrity
        shell: bash
        run: |
          set -eu
          expected_p0_06_proposals='0fc1ea9b9f5e16ee4dae9bf25faf885f1b0d7a8a'
          actual_p0_06_proposals="$(git rev-parse HEAD:runtime/mediahub_runtime/proposals.py)"
          test "$actual_p0_06_proposals" = "$expected_p0_06_proposals"
          echo "frozen_p0_06_proposals_blob=$actual_p0_06_proposals"
          echo 'frozen_p0_06_proposals=UNCHANGED'

      - name: Targeted P0-08 tests
        shell: bash
        run: |
          set -eu
          PYTHONPATH=runtime:. python3 -m pytest \
            tests/runtime/test_plugin_manifest.py \
            tests/runtime/test_plugin_capabilities.py \
            tests/runtime/test_plugin_boundary.py \
            tests/runtime/test_plugin_authorization.py \
            tests/runtime/test_plugin_lifecycle.py \
            tests/runtime/test_p0_08_lifecycle_security.py \
            tests/runtime/test_plugin_resources.py \
            tests/runtime/test_plugin_proposals.py \
            tests/runtime/test_p0_08_security_invariants.py -v

      - name: P0-08 forbidden capability scan
        shell: bash
        run: |
          set -eu
          python3 - <<'PY'
          import ast
          from pathlib import Path

          files = [
              Path('runtime/mediahub_runtime/plugin_manifest.py'),
              Path('runtime/mediahub_runtime/plugin_capabilities.py'),
              Path('runtime/mediahub_runtime/plugin_boundary.py'),
              Path('runtime/mediahub_runtime/plugin_authorization.py'),
              Path('runtime/mediahub_runtime/plugin_lifecycle.py'),
              Path('runtime/mediahub_runtime/plugin_resources.py'),
              Path('runtime/mediahub_runtime/plugin_proposals.py'),
          ]
          forbidden_modules = {
              'subprocess', 'socket', 'requests', 'urllib', 'http.client',
              'sqlite3', 'sqlalchemy', 'shelve', 'dbm', 'pickle', 'shutil',
          }
          forbidden_calls = {
              'system', 'popen', 'Popen', 'check_output', 'check_call',
              'create_subprocess', 'eval', 'exec', 'compile', 'open',
              'write_text', 'write_bytes', 'urlopen', 'create_engine',
          }

          for path in files:
              tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          if alias.name in forbidden_modules:
                              raise SystemExit(f'{path}: forbidden import {alias.name}')
                  elif isinstance(node, ast.ImportFrom):
                      module = node.module or ''
                      if module in forbidden_modules:
                          raise SystemExit(f'{path}: forbidden import {module}')
                  elif isinstance(node, ast.Call):
                      if isinstance(node.func, ast.Name) and node.func.id in forbidden_calls:
                          raise SystemExit(f'{path}: forbidden call {node.func.id}')
                      if isinstance(node.func, ast.Attribute) and node.func.attr in forbidden_calls:
                          raise SystemExit(f'{path}: forbidden call {node.func.attr}')

          print('p0_08_capability_scan=PASS')
          print('p0_08_persistence_scan=PASS')
          PY

      - name: P0-08 authority binding scan
        shell: bash
        run: |
          set -eu
          python3 - <<'PY'
          import ast
          from pathlib import Path

          names = {
              'StateAuthority', 'CanonicalStore', 'PersistenceHandle',
              'MutableState', 'Checkpoint', 'Transaction'
          }
          for path in Path('runtime/mediahub_runtime').glob('plugin_*.py'):
              tree = ast.parse(path.read_text(encoding='utf-8'))
              imported = {
                  alias.name.split('.')[-1]
                  for node in ast.walk(tree)
                  if isinstance(node, ast.Import)
                  for alias in node.names
              }
              imported_from = {
                  alias.name
                  for node in ast.walk(tree)
                  if isinstance(node, ast.ImportFrom)
                  for alias in node.names
              }
              runtime_names = {
                  node.id
                  for node in ast.walk(tree)
                  if isinstance(node, ast.Name)
              }
              forbidden = names & (imported | imported_from | runtime_names)
              if forbidden:
                  raise SystemExit(f'{path}: forbidden authority/persistence names: {sorted(forbidden)}')
          PY
          echo 'p0_08_authority_binding_scan=PASS'

      - name: Full regression
        shell: bash
        run: |
          set -eu
          PYTHONPATH=runtime:. python3 -m pytest tests/ -v

      - name: Final P0-08 verification state
        if: ${{ always() }}
        shell: bash
        run: |
          set -u
          echo '=== P0-08 VERIFICATION RESULT ==='
          echo "host=$(hostname)"
          echo "user=$(id -un)"
          echo "commit=$(git rev-parse HEAD 2>/dev/null || echo unavailable)"
          echo 'worktree:'
          git status --short 2>/dev/null || true
