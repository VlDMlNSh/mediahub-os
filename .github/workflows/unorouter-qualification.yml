name: UnoRouter runtime and credential qualification
# Fresh qualification trigger 2026-09-29

on:
  push:
    paths:
      - ".github/workflows/unorouter-qualification.yml"
      - ".github/workflows/unorouter-runtime-qualification.yml"
      - "runtime/mediahub_runtime/cloud_orchestrator.py"
      - "profiles/agent-registry.json"
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      UNOROUTER_API_KEY: ${{ secrets.UNOROUTER_API_KEY }}
    steps:
      - name: Verify credential and model catalog
        shell: bash
        run: |
          set -euo pipefail
          test -n "${UNOROUTER_API_KEY}"
          body="$(curl --fail-with-body --silent --show-error --max-time 20 -H "Authorization: Bearer ${UNOROUTER_API_KEY}" https://api.unorouter.com/v1/models)"
          python3 - "$body" <<'PY'
          import json, sys
          d=json.loads(sys.argv[1]); ids=[str(x.get("id","")) for x in d.get("data",[])]
          print(json.dumps({"status":"PASS","credential_present":True,"model_count":len(ids),"free_models":[x for x in ids if x.endswith(":free")][:20],"claude_models":[x for x in ids if "claude" in x.lower()][:20],"gpt_or_codex_models":[x for x in ids if ("gpt" in x.lower() or "codex" in x.lower())][:20]},sort_keys=True))
          PY

      - name: Verify free OpenAI-compatible inference
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          code="$(curl --silent --show-error --max-time 45 -o "$tmp" -w '%{http_code}' -H "Authorization: Bearer ${UNOROUTER_API_KEY}" -H "Content-Type: application/json" https://api.unorouter.com/v1/chat/completions -d '{"model":"gpt-oss-120b:free","messages":[{"role":"user","content":"Return exactly OK."}],"max_tokens":8}')"
          python3 - "$code" "$tmp" <<'PY'
          import json,sys
          code=int(sys.argv[1]); d=json.load(open(sys.argv[2]))
          if 200 <= code < 300: print(json.dumps({"status":"PASS","http_status":code,"model":"gpt-oss-120b:free","response_id":d.get("id","present")},sort_keys=True))
          elif code in (401,403): print(json.dumps({"status":"BLOCKED_AUTH","http_status":code},sort_keys=True)); raise SystemExit(1)
          elif code==402: print(json.dumps({"status":"BLOCKED_BILLING","http_status":code},sort_keys=True))
          else: print(json.dumps({"status":"BLOCKED_RUNTIME","http_status":code,"error_type":d.get("error",{}).get("type")},sort_keys=True))
          PY

      - name: Verify Claude-compatible inference
        shell: bash
        run: |
          set -euo pipefail
          models="$(curl --fail-with-body --silent --show-error --max-time 20 -H "Authorization: Bearer ${UNOROUTER_API_KEY}" https://api.unorouter.com/v1/models)"
          model="$(python3 - "$models" <<'PY'
          import json,sys
          ids=[str(x.get("id","")) for x in json.loads(sys.argv[1]).get("data",[])]
          free=[x for x in ids if "claude" in x.lower() and x.endswith(":free")]
          paid=[x for x in ids if "claude" in x.lower()]
          print((free or paid or [""])[0])
          PY
          )"
          test -n "$model"
          tmp="$(mktemp)"
          python3 - "$model" "$tmp" <<'PY'
          import json, os, subprocess, sys
          model, path = sys.argv[1], sys.argv[2]
          payload=json.dumps({"model":model,"max_tokens":8,"messages":[{"role":"user","content":"Return exactly OK."}]})
          p=subprocess.run(["curl","--silent","--show-error","--max-time","45","-o",path,"-w","%{http_code}","-H",f"Authorization: Bearer {os.environ['UNOROUTER_API_KEY']}","-H","Content-Type: application/json","-H","anthropic-version: 2023-06-01","https://api.unorouter.com/v1/messages","-d",payload],capture_output=True,text=True,check=True)
          code=int(p.stdout.strip()); d=json.load(open(path))
          if 200 <= code < 300: print(json.dumps({"status":"PASS","http_status":code,"model":model,"response_id":d.get("id","present")},sort_keys=True))
          elif code in (401,403): print(json.dumps({"status":"BLOCKED_AUTH","http_status":code,"model":model},sort_keys=True)); raise SystemExit(1)
          elif code==402: print(json.dumps({"status":"BLOCKED_BILLING","http_status":code,"model":model},sort_keys=True))
          else: print(json.dumps({"status":"BLOCKED_RUNTIME","http_status":code,"model":model,"error_type":d.get("error",{}).get("type")},sort_keys=True))
          PY

      - name: Verify Codex custom-provider configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/codex-home"
          cat > "$RUNNER_TEMP/codex-home/config.toml" <<'TOML'
          model_provider = "unorouter"
          [model_providers.unorouter]
          name = "UnoRouter"
          base_url = "https://api.unorouter.com/v1"
          wire_api = "responses"
          env_key = "UNOROUTER_API_KEY"
          TOML
          echo '{"status":"PASS","codex_provider_config":"validated","env_key":"UNOROUTER_API_KEY","secret_value_printed":false}'
