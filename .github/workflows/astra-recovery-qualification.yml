name: Astra Recovery Qualification

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recovery-negative:
    name: Astra recovery and negative qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Astra branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install pinned qualification toolchain
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input -r ci-requirements.txt

      - name: Run recovery and negative tests
        env:
          EVIDENCE_BRANCH: engineering/astra-recovery-evidence-${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import tempfile
          from pathlib import Path

          from ops.astra_github_coding_protocol import (
              EvidenceEnvelope,
              ExecutionIdentity,
              ProtocolError,
              accept_result,
              validate_fence,
              validate_operation_key,
          )
          from ops.astra_scheduler import Scheduler

          SHA = "a" * 40
          evidence = {
              "schema_version": 1,
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_sha": os.environ["GITHUB_SHA"],
              "gates": {},
          }

          with tempfile.TemporaryDirectory() as td:
              db = Path(td) / "controller.db"
              s = Scheduler(db, lease_seconds=5)
              task_id = s.enqueue("coding", "recovery", SHA, task_id="ASTRA-RECOVERY-RESTART")
              s.close()

              restarted = Scheduler(db, lease_seconds=5)
              task = restarted.select()
              assert task is not None and task.task_id == task_id
              lease = restarted.claim(task, "worker-A", now=100.0)
              restarted.close()

              recovered = Scheduler(db, lease_seconds=5)
              assert recovered.reconcile(now=106.0) == 1
              recovered_task = recovered.select()
              assert recovered_task is not None
              assert recovered_task.generation == task.generation + 1
              stale_rejected = False
              try:
                  recovered.complete(lease, True, "stale-worker")
              except RuntimeError:
                  stale_rejected = True
              assert stale_rejected
              evidence["gates"]["controller_restart_and_lease_recovery"] = "PASS"
              evidence["gates"]["worker_disappearance_requeue"] = "PASS"

          identity = ExecutionIdentity.from_mapping({
              "schema_version": 1,
              "task_id": "ASTRA-NEG-1",
              "execution_id": "exec-neg-1",
              "generation": 1,
              "lease_id": "lease-neg-1",
              "owner_id": "worker-A",
              "operation_key": "coding.execute",
              "target_sha": SHA,
              "created_at": "2026-09-27T00:00:00Z",
              "expires_at": "2026-09-27T01:00:00Z",
          })
          validate_fence(
              identity,
              task_id="ASTRA-NEG-1",
              execution_id="exec-neg-1",
              generation=1,
              lease_id="lease-neg-1",
              owner_id="worker-A",
              target_sha=SHA,
          )

          for name, func in {
              "wrong_owner_fenced": lambda: validate_fence(
                  identity, task_id="ASTRA-NEG-1", execution_id="exec-neg-1",
                  generation=1, lease_id="lease-neg-1", owner_id="worker-B", target_sha=SHA),
              "stale_generation_fenced": lambda: validate_fence(
                  identity, task_id="ASTRA-NEG-1", execution_id="exec-neg-1",
                  generation=2, lease_id="lease-neg-1", owner_id="worker-A", target_sha=SHA),
              "wrong_target_fenced": lambda: validate_fence(
                  identity, task_id="ASTRA-NEG-1", execution_id="exec-neg-1",
                  generation=1, lease_id="lease-neg-1", owner_id="worker-A", target_sha="b"*40),
              "operation_key_mismatch": lambda: validate_operation_key(identity, "coding.other"),
          }.items():
              try:
                  func()
              except ProtocolError:
                  evidence["gates"][name] = "PASS"
              else:
                  raise AssertionError(name + " was not rejected")

          item = EvidenceEnvelope(
              identity=identity,
              worker="gemini",
              model="gemini-3.5-flash-lite",
              provider="gemini",
              changed_files=("qualification/example.py",),
              tests=("pytest -q",),
              security_results=("negative-fence-tests PASS",),
              commit_sha="c"*40,
              remote_sha="c"*40,
              artifact_sha256="d"*64,
              terminal_status="SUCCEEDED",
          )
          digest = accept_result(item)
          assert digest == item.digest()
          assert accept_result(item, current=item) == digest
          conflict = EvidenceEnvelope(
              identity=item.identity,
              worker=item.worker,
              model=item.model,
              provider=item.provider,
              changed_files=("qualification/other.py",),
              tests=item.tests,
              security_results=item.security_results,
              commit_sha=item.commit_sha,
              remote_sha=item.remote_sha,
              artifact_sha256=item.artifact_sha256,
              terminal_status=item.terminal_status,
          )
          try:
              accept_result(conflict, current=item)
          except ProtocolError:
              evidence["gates"]["duplicate_identical_result_idempotent"] = "PASS"
              evidence["gates"]["duplicate_conflicting_result_rejected"] = "PASS"
          else:
              raise AssertionError("conflicting duplicate evidence accepted")

          evidence["status"] = "PASS"
          evidence["operator"] = "GitHub Actions"
          evidence["notes"] = [
              "Controller restart and worker disappearance were simulated with a durable SQLite ledger.",
              "Fence tests cover owner, generation, target SHA and operation key.",
              "Duplicate evidence tests cover idempotent identical and conflicting results.",
              "This is qualification evidence for failure/recovery semantics, not a substitute for a physical multi-node crash drill.",
          ]

          path = Path("qualification") / f"astra-recovery-{os.environ['GITHUB_RUN_ID']}.json"
          path.parent.mkdir(exist_ok=True)
          path.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          subprocess.run(["git", "config", "user.name", "Astra Qualification Bot"], check=True)
          subprocess.run(["git", "config", "user.email", "astra-qualification@users.noreply.github.com"], check=True)
          subprocess.run(["git", "checkout", "-b", os.environ["EVIDENCE_BRANCH"]], check=True)
          subprocess.run(["git", "add", str(path)], check=True)
          subprocess.run(["git", "commit", "-m", "astra(qualification): record recovery evidence"], check=True)
          subprocess.run(["git", "push", "origin", os.environ["EVIDENCE_BRANCH"]], check=True)
          remote = subprocess.check_output(
              ["git", "ls-remote", "origin", f"refs/heads/{os.environ['EVIDENCE_BRANCH']}"],
              text=True,
          ).split()[0]
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert remote == commit
          evidence["commit_sha"] = commit
          evidence["remote_sha"] = remote
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY

      - name: Publish recovery evidence
        uses: actions/upload-artifact@v4.6.2
        with:
          name: astra-recovery-${{ github.run_id }}
          path: qualification/astra-recovery-${{ github.run_id }}.json
          if-no-files-found: error
