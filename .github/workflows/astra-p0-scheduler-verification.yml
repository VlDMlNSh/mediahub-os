name: Astra P0 Scheduler Verification
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  scheduler-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install test toolchain
        run: python3 -m pip install --disable-pip-version-check --no-input pytest==7.4.4
      - name: Verify Astra protocol and scheduler
        run: python3 -m pytest -q tests/test_astra_github_coding_protocol.py tests/test_astra_scheduler.py
