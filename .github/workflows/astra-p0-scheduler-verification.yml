name: Astra P0 Scheduler Verification
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  scheduler-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install test toolchain
        run: python3 -m pip install --disable-pip-version-check --no-input pytest==7.4.4
      - name: Verify Astra protocol and scheduler
        run: python3 -m pytest -q tests/test_astra_github_coding_protocol.py tests/test_astra_scheduler.py


  ollama-coding-e2e:
    name: Ollama coding worker E2E
    runs-on: [self-hosted, mediahub-runner]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Run bounded Ollama coding cycle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          branch=f"engineering/astra-ollama-e2e-{os.environ['GITHUB_RUN_ID']}"
          subprocess.run(["git","checkout","-b",branch],check=True)
          subprocess.run(["git","config","user.name","Astra Ollama Qualification Bot"],check=True)
          subprocess.run(["git","config","user.email","astra-qualification@users.noreply.github.com"],check=True)
          target=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          with urllib.request.urlopen("http://127.0.0.1:11434/api/tags",timeout=5) as r:
              tags=json.load(r)
          models=[m.get("name","") for m in tags.get("models",[]) if isinstance(m,dict)]
          if not any(x.startswith("qwen2.5-coder:3b") or x.startswith("qwen2.5-coder-3b") for x in models):
              raise SystemExit("qwen2.5-coder:3b model not present")
          prompt='''Return ONLY valid JSON with exactly two string fields:
          {"ops/astra_generated_ollama_e2e.py":"...","tests/test_astra_generated_ollama_e2e.py":"..."}
          The production file must define cycle_marker() -> str and return exactly "ASTRA_OLLAMA_E2E".
          The test file must import cycle_marker and define a pytest test function named test_cycle_marker that asserts cycle_marker() == "ASTRA_OLLAMA_E2E".
          Both files must be complete valid Python source. The test must be discoverable by pytest. Do not touch any other file.'''
          body=json.dumps({"model":"qwen2.5-coder:3b","prompt":prompt,"stream":False,"format":"json","options":{"temperature":0,"num_predict":512}}).encode()
          req=urllib.request.Request("http://127.0.0.1:11434/api/generate",data=body,headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=600) as r:
              response=json.load(r)
          generated=json.loads(str(response.get("response","")))
          expected={"ops/astra_generated_ollama_e2e.py","tests/test_astra_generated_ollama_e2e.py"}
          if set(generated)!=expected:
              raise SystemExit(f"unexpected generated paths: {set(generated)}")
          for path,content in generated.items():
              if not isinstance(content,str) or not content.strip():
                  raise SystemExit(f"empty generated file: {path}")
              if not content.lstrip().startswith(("#","import ","from ","def ","class ","\"\"\"")):
                  raise SystemExit(f"generated file is not valid-looking Python: {path}")
          test_source=generated["tests/test_astra_generated_ollama_e2e.py"]
          if "def test_cycle_marker" not in test_source or "cycle_marker()" not in test_source:
              raise SystemExit("generated test is not pytest-discoverable")
              Path(path).parent.mkdir(parents=True,exist_ok=True)
              Path(path).write_text(content,encoding="utf-8")
          subprocess.run(["python3","-m","pytest","-q","tests/test_astra_generated_ollama_e2e.py"],check=True)
          status=subprocess.check_output(["git","status","--porcelain"],text=True).splitlines()
          paths={line[3:] for line in status if len(line)>=4}
          if paths!=expected:
              raise SystemExit(f"unexpected worktree paths: {paths}")
          generated_sha=hashlib.sha256(json.dumps(generated,sort_keys=True).encode()).hexdigest()
          subprocess.run(["git","add",*sorted(expected)],check=True)
          subprocess.run(["git","commit","-m","astra(ollama-e2e): complete local coding cycle"],check=True)
          commit=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          subprocess.run(["git","push","origin",branch],check=True)
          remote=subprocess.check_output(["git","ls-remote","origin",f"refs/heads/{branch}"],text=True).split()[0]
          if remote!=commit:
              raise SystemExit(f"remote SHA mismatch: {remote} != {commit}")
          print(json.dumps({"status":"PASS","worker":"ollama","model":"qwen2.5-coder:3b","target_sha":target,"commit_sha":commit,"remote_sha":remote,"generated_sha256":generated_sha},sort_keys=True))
          PY
