name: Astra node result publication

on:
  workflow_call:
    inputs:
      artifact_name:
        description: "Sanitized controller result artifact"
        required: true
        type: string
      artifact_file:
        description: "File name inside the artifact"
        required: true
        type: string
      node_id:
        description: "Astra node identity"
        required: true
        type: string
      command_id:
        description: "Expected command identity"
        required: true
        type: string
      target_sha:
        description: "Expected target source SHA"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: astra-node-result-publication-${{ inputs.node_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50
          persist-credentials: true

      - name: Download sanitized controller result
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: .astra-result
          merge-multiple: false

      - name: Validate publication payload
        shell: bash
        env:
          ARTIFACT_FILE: ${{ inputs.artifact_file }}
          COMMAND_ID: ${{ inputs.command_id }}
          NODE_ID: ${{ inputs.node_id }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          test -s ".astra-result/${ARTIFACT_FILE}"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          d=json.loads(Path(".astra-result/"+os.environ["ARTIFACT_FILE"]).read_text(encoding="utf-8"))
          assert d.get("command_id") == os.environ["COMMAND_ID"]
          assert d.get("node_id") == os.environ["NODE_ID"]
          assert d.get("target_sha") == os.environ["TARGET_SHA"]
          assert re.fullmatch(r"[0-9a-f]{40}", str(d.get("target_sha","")))
          assert d.get("execution_head") == d.get("target_sha")
          assert d.get("secret_values") == "SUPPRESSED"
          result=d.get("result",{})
          assert result.get("status") in {"PASS","BLOCKED","FAILED"}
          print("publication_payload=VALID")
          PY

      - name: Verify result branch base
        shell: bash
        run: |
          set -euo pipefail
          node="${{ inputs.node_id }}"
          if git ls-remote --exit-code origin "refs/heads/astra-node/$node" >/dev/null 2>&1; then
            git fetch origin "refs/heads/astra-node/$node:refs/remotes/origin/astra-node/$node"
            git checkout --detach "origin/astra-node/$node"
          else
            git checkout --detach origin/main
          fi

      - name: Publish sanitized result
        shell: bash
        run: |
          set -euo pipefail
          node="${{ inputs.node_id }}"
          mkdir -p control/results
          cp ".astra-result/${{ inputs.artifact_file }}" "control/results/$node.json"
          git add "control/results/$node.json"
          if git diff --cached --quiet; then
            echo "publication=NOOP"
            exit 0
          fi
          git config user.name "Astra Node Result Publisher"
          git config user.email "astra-result-publisher@localhost"
          git commit -m "astra: publish sanitized result $node"
          git push origin "HEAD:refs/heads/astra-node/$node"

      - name: Verify remote publication
        shell: bash
        run: |
          set -euo pipefail
          node="${{ inputs.node_id }}"
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin "refs/heads/astra-node/$node" | awk '{print $1}')"
          test -n "$remote_sha"
          test "$remote_sha" = "$local_sha"
          echo "publication=VERIFIED"
