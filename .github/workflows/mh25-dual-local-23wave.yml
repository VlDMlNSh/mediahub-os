name: MH-25 Dual Local Executor 23-Wave Qualification
on:
  push:
    branches:
      - main
      - engineering/**
    paths:
      - .github/workflows/mh25-dual-local-23wave.yml
      - astra_github_agent.py
      - ops/agent-fabric/providers/dual-local-executors.yaml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mh25-dual-local-23wave
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: [self-hosted, mediahub-runner]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          echo "source_sha=${GITHUB_SHA}"
          hostname
          command -v fcc-codex || true
          command -v fcc-claude || true
          command -v omniroute || true
          command -v codex || true
          command -v claude || true
          command -v ecc || command -v ecc-cli || true
          curl -fsS --max-time 5 http://127.0.0.1:8092/v1/models >/tmp/fcc-models.json
          curl -fsS --max-time 5 http://127.0.0.1:20128/v1/models >/tmp/omni-models.json
      - name: ASTRA GOLD architecture drift gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input PyYAML
          python3 -m unittest -v tests/test_astra_gold_architecture_drift.py
      - name: 23 round analysis and setup probes
        shell: bash
        run: |
          set -u
          : > mh25-23wave.jsonl
          for i in $(seq 1 23); do
            echo "ROUND $i"
            ts=$(date +%s)
            workspace="$GITHUB_WORKSPACE"
            run_probe() {
              local timeout_s="$1"
              local output="$2"
              shift 2
              "$@" >"$output" 2>&1
              local rc=$?
              printf '%s\n' "$rc"
            }
            record_probe() {
              local executor_id="$1"
              local provider_model_id="$2"
              local timeout_s="$3"
              local output="$4"
              local rc="$5"
              local marker="$6"
              local status=FAIL
              local verification_status=FAIL
              if [ "$rc" -eq 0 ] && grep -Fx "$marker" "$output" >/dev/null 2>&1; then
                status=PASS
                verification_status=PASS
              elif [ "$rc" -eq 124 ]; then
                verification_status=TIMEOUT
              fi
              python3 - "$executor_id" "$provider_model_id" "$timeout_s" "$output" "$rc" "$status" "$verification_status" "$marker" "$i" "$ts" "$workspace" >> mh25-23wave.jsonl <<'PY'
import hashlib, json, os, sys, uuid
(executor_id, provider_model_id, timeout_s, output, rc, status,
 verification_status, marker, round_no, timestamp, workspace) = sys.argv[1:]
try:
    exit_status=int(rc)
except ValueError:
    exit_status=255
record={
    "schema":"mediahub.astra-round-evidence.v1",
    "command_id":str(uuid.uuid4()),
    "node_id":os.uname().nodename,
    "component_id":"MH-25",
    "executor_id":executor_id,
    "provider_model_id":provider_model_id,
    "source_sha":os.environ["GITHUB_SHA"],
    "round":int(round_no),
    "timestamp":int(timestamp),
    "exit_status":exit_status,
    "timeout":int(timeout_s),
    "workspace":workspace,
    "verification_status":verification_status,
    "status":status,
    "marker":marker,
    "evidence_digest":""
}
record["evidence_digest"]=hashlib.sha256(
    json.dumps({k:v for k,v in record.items() if k!="evidence_digest"},
               sort_keys=True,separators=(",",":")).encode()
).hexdigest()
print(json.dumps(record,sort_keys=True))
PY
            }
            fcc_codex_rc=$(timeout 25s fcc-codex exec --skip-git-repo-check --sandbox read-only "Return exactly MEDIAHUB_FCC_CODEX_OK" </dev/null >/tmp/fcc-codex.out 2>&1); fcc_codex_rc=$?
            fcc_claude_rc=$(timeout 25s fcc-claude -p "Return exactly MEDIAHUB_FCC_CLAUDE_OK" --output-format text </dev/null >/tmp/fcc-claude.out 2>&1); fcc_claude_rc=$?
            omni_codex_rc=$(timeout 30s omniroute run codex --model auto -- exec --skip-git-repo-check --sandbox read-only "Return exactly MEDIAHUB_OMNI_CODEX_OK" </dev/null >/tmp/omni-codex.out 2>&1); omni_codex_rc=$?
            omni_claude_rc=$(timeout 30s omniroute run claude --model auto -- -p "Return exactly MEDIAHUB_OMNI_CLAUDE_OK" --output-format text </dev/null >/tmp/omni-claude.out 2>&1); omni_claude_rc=$?
            direct_claude_rc=$(timeout 30s claude -p "Return exactly MEDIAHUB_DIRECT_CLAUDE_OK" --output-format text </dev/null >/tmp/direct-claude.out 2>&1); direct_claude_rc=$?
            command -v fcc-codex >/dev/null 2>&1 || fcc_codex_rc=127
            command -v fcc-claude >/dev/null 2>&1 || fcc_claude_rc=127
            command -v omniroute >/dev/null 2>&1 || { omni_codex_rc=127; omni_claude_rc=127; }
            command -v claude >/dev/null 2>&1 || direct_claude_rc=127
            record_probe "CODEX_FCC" "${FCC_CODEX_PROVIDER_MODEL_ID:-UNRESOLVED_FCC_MODEL}" 25 /tmp/fcc-codex.out "$fcc_codex_rc" "MEDIAHUB_FCC_CODEX_OK"
            record_probe "CLAUDE_FCC" "${FCC_CLAUDE_PROVIDER_MODEL_ID:-UNRESOLVED_FCC_MODEL}" 25 /tmp/fcc-claude.out "$fcc_claude_rc" "MEDIAHUB_FCC_CLAUDE_OK"
            record_probe "CODEX_OMNIROUTE" "${OMNI_CODEX_PROVIDER_MODEL_ID:-UNRESOLVED_OMNI_MODEL}" 30 /tmp/omni-codex.out "$omni_codex_rc" "MEDIAHUB_OMNI_CODEX_OK"
            record_probe "CLAUDE_OMNIROUTE" "${OMNI_CLAUDE_PROVIDER_MODEL_ID:-UNRESOLVED_OMNI_MODEL}" 30 /tmp/omni-claude.out "$omni_claude_rc" "MEDIAHUB_OMNI_CLAUDE_OK"
            record_probe "CLAUDE_CODE_DIRECT" "${DIRECT_CLAUDE_PROVIDER_MODEL_ID:-UNRESOLVED_DIRECT_MODEL}" 30 /tmp/direct-claude.out "$direct_claude_rc" "MEDIAHUB_DIRECT_CLAUDE_OK"
          done
      - name: Selection and evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
import json, os, pathlib, shutil
rows=[json.loads(x) for x in pathlib.Path("mh25-23wave.jsonl").read_text().splitlines() if x.strip()]
required=[
    "CLAUDE_CODE_FCC","CLAUDE_FCC","CODEX_OMNIROUTE",
    "CLAUDE_OMNIROUTE","CLAUDE_CODE_DIRECT"
]
if len(rows) != 115:
    raise SystemExit(f"expected exactly 115 evidence rows, got {len(rows)}")
expected={(r,p) for r in range(1,24) for p in required}
actual={(r.get("round"),r.get("executor_id")) for r in rows}
if actual != expected:
    raise SystemExit("evidence matrix is not exactly 23 rounds x 5 mandatory paths")
if len({r.get("command_id") for r in rows}) != 115:
    raise SystemExit("command_id values are not unique")
if any(r.get("source_sha") != os.environ["GITHUB_SHA"] for r in rows):
    raise SystemExit("source_sha mismatch in round evidence")
if any(not r.get("evidence_digest") for r in rows):
    raise SystemExit("missing evidence_digest in round evidence")
if any(r.get("provider_model_id","").startswith("UNRESOLVED_") for r in rows):
    raise SystemExit("provider/model identity unresolved; qualification is fail-closed")
summary={}
for key in required:
    subset=[r for r in rows if r["executor_id"]==key]
    n=sum(r["status"]=="PASS" and r["verification_status"]=="PASS" for r in subset)
    summary[key]={"pass_count":n,"rounds":23,"pass_rate":n/23}
selected=[k for k,v in summary.items() if v["pass_count"]==23]
payload={
    "schema":"mediahub.dual-local-executor-23wave.v3",
    "source_sha":os.environ["GITHUB_SHA"],
    "node":os.uname().nodename,
    "summary":summary,
    "selected_full_pass":selected,
    "required_paths":required,
    "required_rounds_per_path":23,
    "required_total_rounds":115,
    "ecc":{"path":shutil.which("ecc") or shutil.which("ecc-cli") or "NOT_FOUND"},
    "policy":"explicit executor/provider-model identity required; no credentials emitted"
}
pathlib.Path("mh25-23wave-qualification.json").write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n")
print(json.dumps(payload,indent=2,sort_keys=True))
if set(selected) != set(required):
    raise SystemExit(2)
PY
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mh25-dual-local-23wave-${{ github.sha }}
          path: |
            mh25-23wave.jsonl
            mh25-23wave-qualification.json
            /tmp/fcc-models.json
            /tmp/omni-models.json
          if-no-files-found: warn
