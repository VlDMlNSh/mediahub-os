name: MH-25 Dual Local Executor 23-Wave Qualification
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mh25-dual-local-23wave.yml
      - ops/qualification/**
      - runtime/mediahub_runtime/**
      - astra_github_agent.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mh25-dual-local-23wave
  cancel-in-progress: false

jobs:
  codex-local:
    name: Real Codex local executor / mh-dev-02
    runs-on: [self-hosted, linux, x64, mediahub-provider]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 20
          persist-credentials: false
      - name: Canonical admission
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "mh-dev-02"
          test "$(id -un)" = "mediahub"
          export PATH="/home/mediahub/.local/bin:/home/mediahub/.local/npm/bin:$PATH"
          command -v codex
          command -v ollama
          ollama list | grep -E '^qwen2.5-coder:3b[[:space:]]'
      - name: 23 real Codex rounds
        shell: bash
        run: |
          set -u
          : > codex-23wave.jsonl
          for i in $(seq 1 23); do
            ts=$(date +%s)
            out="/tmp/astra-codex-$i.out"
            rm -f "$out"
            timeout 12s codex exec --ignore-user-config --oss --local-provider ollama --model qwen2.5-coder:3b \
              --sandbox read-only --skip-git-repo-check \
              "Return exactly MEDIAHUB_LOCAL_CODEX_23WAVE_OK. Do not use network or modify files." </dev/null >"$out" 2>&1
            rc=$?
            status=BLOCKED
            [ "$rc" -eq 0 ] && grep -Fx MEDIAHUB_LOCAL_CODEX_23WAVE_OK "$out" >/dev/null 2>&1 && status=PASS
            python3 - <<PY >> codex-23wave.jsonl
          import json
          print(json.dumps({"round":$i,"timestamp":$ts,"status":"$status","returncode":$rc,"marker":"MEDIAHUB_LOCAL_CODEX_23WAVE_OK"}))
          PY
            [ "$status" = PASS ] || exit 2
          done
      - name: Upload Codex evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mh25-codex-local-23wave-${{ github.sha }}
          path: codex-23wave.jsonl
          if-no-files-found: error

  claude-local:
    name: Real Claude local executor / mh-dev-02
    runs-on: [self-hosted, linux, x64, mediahub-provider]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 20
          persist-credentials: false
      - name: Canonical admission
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "mh-dev-02"
          test "$(id -un)" = "mediahub"
          export PATH="/home/mediahub/.local/bin:/home/mediahub/.local/npm/bin:$PATH"
          command -v claude
          command -v ollama
          command -v fcc-server
          ollama list | grep -E '^qwen2.5-coder:3b[[:space:]]'
      - name: 23 real Claude rounds
        shell: bash
        run: |
          set -u
          : > claude-23wave.jsonl
          env_file="/home/mediahub/.config/mediahub/fcc.env"
          test -f "$env_file"
          set -a; . "$env_file"; set +a
          model="qwen2.5-coder:3b"
          host="127.0.0.1"
          port="$((18000 + GITHUB_RUN_ID % 1000))"
          export HOST="$host" PORT="$port" MODEL="ollama/$model"
          nohup setsid fcc-server --host "$host" --port "$port" >/tmp/astra-fcc-23wave.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS --max-time 2 "http://$host:$port/health" >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS --max-time 5 "http://$host:$port/health" >/dev/null
          for i in $(seq 1 23); do
            ts=$(date +%s)
            marker="MEDIAHUB_LOCAL_CLAUDE_23WAVE_OK"
            payload=$(python3 - "$model" "$marker" <<'PY'
          import json,sys
          model,marker=sys.argv[1:]
          print(json.dumps({"model":"ollama/"+model,"max_tokens":32,"messages":[{"role":"user","content":marker+". Return exactly "+marker+". Do not modify files, call tools, or access the network."}]}))
          PY
          )
            out="/tmp/astra-claude-$i.json"
            timeout 12s curl -fsS --max-time 10 "http://$host:$port/v1/messages" \
              -H "x-api-key: $ANTHROPIC_AUTH_TOKEN" -H 'Content-Type: application/json' \
              -d "$payload" >"$out"
            rc=$?
            status=BLOCKED
            if [ "$rc" -eq 0 ]; then
              python3 - "$out" "$marker" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          text="\n".join(x.get("text","") for x in d.get("content",[]) if isinstance(x,dict))
          raise SystemExit(0 if text.strip()==sys.argv[2] else 1)
          PY
              parse_rc=$?
              [ "$parse_rc" -eq 0 ] && status=PASS
            fi
            python3 - <<PY >> claude-23wave.jsonl
          import json
          print(json.dumps({"round":$i,"timestamp":$ts,"status":"$status","returncode":$rc,"marker":"MEDIAHUB_LOCAL_CLAUDE_23WAVE_OK","model":"ollama/qwen2.5-coder:3b"}))
          PY
            [ "$status" = PASS ] || exit 2
          done
      - name: Upload Claude evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mh25-claude-local-23wave-${{ github.sha }}
          path: claude-23wave.jsonl
          if-no-files-found: error

  aggregate:
    name: Aggregate dual local executor qualification
    needs: [codex-local, claude-local]
    runs-on: [self-hosted, linux, x64, mediahub-control]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify both executor jobs passed
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "CODEX_LOCAL=PASS" "CLAUDE_LOCAL=PASS" > dual-local-qualification.txt
          printf '%s\n' "target_sha=$GITHUB_SHA" >> dual-local-qualification.txt
      - name: Upload aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: mh25-dual-local-23wave-${{ github.sha }}
          path: dual-local-qualification.txt
          if-no-files-found: error
