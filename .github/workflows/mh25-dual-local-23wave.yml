# Canonical dual-local evidence path: final-message bound, diagnostic stdout retained.
name: MH-25 Dual Local Executor 23-Wave Qualification
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mh25-dual-local-23wave.yml
      - ops/qualification/**
      - runtime/mediahub_runtime/**
      - astra_github_agent.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mh25-dual-local-23wave
  cancel-in-progress: false

jobs:
  codex-local:
    name: Real Codex local executor / mh-dev-02
    runs-on: [self-hosted, linux, x64, mediahub-provider]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 20
          persist-credentials: false
      - name: Canonical admission
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "mh-dev-02"
          test "$(id -un)" = "mediahub"
          export PATH="/home/mediahub/.local/bin:/home/mediahub/.local/npm/bin:$PATH"
          command -v codex
          command -v ollama
          ollama show qwen2.5-coder:1.5b >/dev/null 2>&1 || timeout 600s ollama pull qwen2.5-coder:1.5b
          ollama show qwen2.5-coder:1.5b >/dev/null 2>&1
      - name: 23 real Codex rounds
        shell: bash
        run: |
          set -u
          : > codex-23wave.jsonl
          ollama show qwen2.5-coder:1.5b >/dev/null 2>&1
          timeout 90s ollama run qwen2.5-coder:1.5b "Return exactly MEDIAHUB_OLLAMA_PREFLIGHT_OK. Do not use tools or network." >/tmp/astra-ollama-preflight.out 2>/tmp/astra-ollama-preflight.err
          grep -Fx MEDIAHUB_OLLAMA_PREFLIGHT_OK /tmp/astra-ollama-preflight.out >/dev/null
          codex_home="$HOME/.cache/mediahub/astra-g4-codex-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$codex_home"
          mkdir -p "$codex_home"
          cat >"$codex_home/config.toml" <<'TOML'
          model_provider = "ollama-local"
          model = "qwen2.5-coder:1.5b"
          approval_policy = "never"
          web_search = "disabled"
          model_context_window = 4096
          model_max_output_tokens = 256
          model_reasoning_summary = "none"
          model_auto_compact_token_limit = 0
          [model_providers.ollama-local]
          name = "Ollama Local"
          base_url = "http://127.0.0.1:11434/v1"
          wire_api = "responses"
          stream_idle_timeout_ms = 300000
          request_max_retries = 1
          stream_max_retries = 1
          [features]
          multi_agent = false
          multi_agent_v2 = false
          apps = false
          tool_search = false
          plugins = false
          TOML
          export CODEX_HOME="$codex_home"
          cleanup_codex() { rm -rf "$codex_home"; }
          trap cleanup_codex EXIT
          for i in $(seq 1 23); do
            ts=$(date +%s)
            out="/tmp/astra-codex-$i.out"
            last="/tmp/astra-codex-$i.last"
            rm -f "$out" "$last"
            set +e
            timeout 360s codex exec --model qwen2.5-coder:1.5b --ephemeral --color never \
              --config model_provider=ollama-local --config model_reasoning_effort=none --sandbox read-only \
              --disable browser_use --disable browser_use_external --disable computer_use --disable apps --disable plugins --disable multi_agent --disable multi_agent_v2 \
              --skip-git-repo-check --output-last-message "$last" \
              "Return exactly MEDIAHUB_LOCAL_CODEX_23WAVE_OK." </dev/null >"$out" 2>&1
            rc=$?
            set -e
            status=BLOCKED
            if [ "$rc" -eq 0 ]; then
              if test -s "$last" && grep -Fx MEDIAHUB_LOCAL_CODEX_23WAVE_OK "$last" >/dev/null 2>&1; then
                status=PASS
              else
                status=MARKER_MISMATCH
              fi
            else
              status=EXECUTION_FAILURE
            fi
            ROUND="$i" TS="$ts" STATUS="$status" RC="$rc" python3 - <<'PY' >> codex-23wave.jsonl
          import json, os
          status=os.environ["STATUS"]
          rc=int(os.environ["RC"])
          print(json.dumps({"round":int(os.environ["ROUND"]),"timestamp":int(os.environ["TS"]),"status":status,"returncode":rc,"marker":"MEDIAHUB_LOCAL_CODEX_23WAVE_OK","reason":"" if status=="PASS" else ("timeout" if rc==124 else ("execution_failure" if rc!=0 else "marker_mismatch"))}))
          PY
            cp "$out" "codex-round-$i.stdout.txt" 2>/dev/null || true
            cp "$last" "codex-round-$i.last.txt" 2>/dev/null || true
            [ "$status" = PASS ] || exit 2
          done
      - name: Upload Codex evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mh25-codex-local-23wave-${{ github.sha }}
          path: |
            codex-23wave.jsonl
            codex-round-*.stdout.txt
            codex-round-*.last.txt
          if-no-files-found: error

  claude-local:
    name: Real Claude local executor / Voktors-Mac-mini
    runs-on: [self-hosted, macOS, ARM64, astra-control]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 20
          persist-credentials: false
      - name: Canonical admission
        shell: bash
        run: |
          set -euo pipefail
          host="$(hostname)"
          test "$host" = "Voktors-Mini.Dlink" || test "$host" = "Voktors-Mac-mini"
          test "$(id -un)" = "voktor"
          export PATH="$HOME/.local/bin:$HOME/.local/npm/bin:$PATH"
          command -v claude
          command -v ollama
          test -x "/Users/voktor/Library/Application Support/pipx/venvs/free-claude-code/bin/fcc-server"
      - name: 23 real Claude rounds
        shell: bash
        run: |
          set -u
          : > claude-23wave.jsonl
          env_file="/Users/voktor/Library/Application Support/MediaHub/fcc.env"
          test -f "$env_file"
          set -a; . "$env_file"; set +a
          model="qwen2.5-coder:1.5b"
          host="127.0.0.1"
          port="$(python3 - <<'PY'
          import socket
          with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as s:
              s.bind(("127.0.0.1", 0))
              print(s.getsockname()[1])
          PY
          )"
          export HOST="$host" PORT="$port" MODEL="ollama/$model"
          export ENABLE_MODEL_THINKING=false ENABLE_OPUS_THINKING=false ENABLE_SONNET_THINKING=false ENABLE_HAIKU_THINKING=false
          export CLAUDE_CODE_DISABLE_THINKING=1 MAX_THINKING_TOKENS=0
          nohup "/Users/voktor/Library/Application Support/pipx/venvs/free-claude-code/bin/fcc-server" --host "$host" --port "$port" >/tmp/astra-fcc-23wave.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS --max-time 2 "http://$host:$port/health" >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS --max-time 5 "http://$host:$port/health" >/dev/null
          if ! kill -0 "$server_pid" 2>/dev/null; then
            cat /tmp/astra-fcc-23wave.log >&2 || true
            exit 1
          fi
          for i in $(seq 1 23); do
            ts=$(date +%s)
            marker="MEDIAHUB_LOCAL_CLAUDE_23WAVE_OK"
            payload=$(python3 - "$model" "$marker" <<'PY'
          import json,sys
          model,marker=sys.argv[1:]
          print(json.dumps({"model":"ollama/"+model,"max_tokens":32,"temperature":0,"messages":[{"role":"user","content":"Output exactly this token and nothing else: "+marker}]}))
          PY
          )
            out="/tmp/astra-claude-$i.json"
            curl -fsS --max-time 290 "http://$host:$port/v1/messages" \
              -H "x-api-key: $ANTHROPIC_AUTH_TOKEN" -H 'Content-Type: application/json' \
              -d "$payload" >"$out"
            rc=$?
            status=BLOCKED
            if [ "$rc" -eq 0 ]; then
              python3 - "$out" "$marker" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          text="\n".join(x.get("text","") for x in d.get("content",[]) if isinstance(x,dict))
          actual=text.strip()
          expected=sys.argv[2]
          ok=(actual==expected or actual.rstrip(".!?") == expected)
          raise SystemExit(0 if ok else 1)
          PY
              parse_rc=$?
              [ "$parse_rc" -eq 0 ] && status=PASS
            fi
            python3 - <<PY >> claude-23wave.jsonl
          import json
          print(json.dumps({"round":$i,"timestamp":$ts,"status":"$status","returncode":$rc,"marker":"MEDIAHUB_LOCAL_CLAUDE_23WAVE_OK","model":"ollama/qwen2.5-coder:1.5b"}))
          PY
            [ "$status" = PASS ] || exit 2
          done
      - name: Upload Claude evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mh25-claude-local-23wave-${{ github.sha }}
          path: claude-23wave.jsonl
          if-no-files-found: error

  aggregate:
    name: Aggregate dual local executor qualification
    needs: [codex-local, claude-local]
    runs-on: [self-hosted, linux, x64, mediahub-control]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download Codex evidence
        uses: actions/download-artifact@v4
        with:
          name: mh25-codex-local-23wave-${{ github.sha }}
          path: evidence/codex
      - name: Download Claude evidence
        uses: actions/download-artifact@v4
        with:
          name: mh25-claude-local-23wave-${{ github.sha }}
          path: evidence/claude
      - name: Independently verify both executor evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 ops/qualification/verify_dual_local_23wave.py \
            --codex evidence/codex/codex-23wave.jsonl \
            --claude evidence/claude/claude-23wave.jsonl \
            --expected-sha "$GITHUB_SHA"
          printf '%s\n' "CODEX_LOCAL=PASS" "CLAUDE_LOCAL=PASS" > dual-local-qualification.txt
          printf '%s\n' "target_sha=$GITHUB_SHA" >> dual-local-qualification.txt
      - name: Upload aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: mh25-dual-local-23wave-${{ github.sha }}
          path: dual-local-qualification.txt
          if-no-files-found: error

# Canonical 1.5b Codex qualification retrigger after stale-run fencing repair.
