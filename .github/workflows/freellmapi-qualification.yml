name: FreeLLMAPI Live Qualification

# Push/PR events run only deterministic tests on a GitHub-hosted runner.
# Live provider access requires an explicit workflow_dispatch on main with
# owner confirmation and a SHA bound to the workflow run.

on:
  push:
    branches: [main]
    paths:
      - 'runtime/mediahub_runtime/local_providers.py'
      - 'runtime/mediahub_runtime/cloud_orchestrator.py'
      - 'tests/ai/**'
      - '.github/workflows/freellmapi-qualification.yml'
      - 'tests/test_freellmapi_qualification_workflow_contract.py'
  pull_request:
    branches: [main]
    paths:
      - 'runtime/mediahub_runtime/local_providers.py'
      - 'runtime/mediahub_runtime/cloud_orchestrator.py'
      - 'tests/ai/**'
      - '.github/workflows/freellmapi-qualification.yml'
      - 'tests/test_freellmapi_qualification_workflow_contract.py'
  workflow_dispatch:
    inputs:
      confirm:
        description: "Explicitly authorize one FreeLLMAPI live qualification request"
        required: true
        type: boolean
        default: false
      target_sha:
        description: "Exact full SHA of main to qualify; must match this workflow run"
        required: true
        type: string

permissions:
  contents: read

# Separate contract CI from live qualification so an unavailable self-hosted
# runner cannot hold ordinary main/pull-request checks in a pending queue.
concurrency:
  group: freellmapi-${{ github.event_name == 'workflow_dispatch' && 'live' || 'contract' }}
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name != 'workflow_dispatch'
    name: Hosted FreeLLMAPI adapter and workflow contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PYTHONPATH: runtime
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          check-latest: false
      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
      - name: Verify adapter and qualification admission contracts
        run: >-
          python3 -m pytest -q
          tests/ai/test_cloud_orchestrator_failover.py
          tests/test_freellmapi_qualification_workflow_contract.py

  dispatch_gate:
    if: github.event_name == 'workflow_dispatch'
    name: Require owner-confirmed main SHA before live provider access
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      admitted: ${{ steps.gate.outputs.admitted }}
    steps:
      - id: gate
        name: Validate explicit confirmation and immutable target
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
          TARGET_SHA: ${{ inputs.target_sha }}
          CURRENT_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$CONFIRM" == "true" ]] || { echo "::error::confirm=true is required; no provider call admitted."; exit 1; }
          [[ "$SOURCE_REF" == "refs/heads/main" ]] || { echo "::error::live qualification must be dispatched from main."; exit 1; }
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ && "$TARGET_SHA" == "$CURRENT_SHA" ]] || { echo "::error::target_sha must be the exact 40-hex workflow SHA."; exit 1; }
          echo "admitted=true" >> "$GITHUB_OUTPUT"
          echo "Admission passed. Provider access remains isolated to the self-hosted qualification job."

  qualify:
    if: >-
      needs.dispatch_gate.outputs.admitted == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm == true &&
      inputs.target_sha == github.sha &&
      github.ref == 'refs/heads/main'
    needs: dispatch_gate
    runs-on: [self-hosted, linux, x64, mediahub-control]
    timeout-minutes: 10
    env:
      FREELLMAPI_URL: ${{ vars.MEDIAHUB_FREELLMAPI_URL }}
      FREELLMAPI_KEY_FILE: ${{ vars.MEDIAHUB_FREELLMAPI_KEY_FILE }}
      FREELLMAPI_MODEL: ${{ vars.MEDIAHUB_FREELLMAPI_MODEL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
      - name: Verify target node
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "mh-dev-01"
          test "$(id -un)" = "mediahub-runner"
          test -f "${FREELLMAPI_KEY_FILE:-$HOME/.config/mediahub/freellmapi.key}"
      - name: Verify adapter tests
        run: |
          python3 -m pytest -q tests/ai/test_cloud_orchestrator_failover.py
      - name: Query FreeLLMAPI models
        shell: bash
        run: |
          set -euo pipefail
          url="${FREELLMAPI_URL:-http://127.0.0.1:3001/v1}"
          key_file="${FREELLMAPI_KEY_FILE:-$HOME/.config/mediahub/freellmapi.key}"
          key="$(cat "$key_file")"
          python3 - "$url" "$key" <<'PY'
          import json, sys, urllib.request
          url, key = sys.argv[1], sys.argv[2]
          req = urllib.request.Request(
              url.rstrip("/") + "/models",
              headers={"Authorization": "Bearer " + key},
          )
          with urllib.request.urlopen(req, timeout=10) as response:
              body = json.loads(response.read().decode())
              print("models_http_status=" + str(response.status))
              models = body.get("data", [])
              print("model_count=" + str(len(models)))
              print("model_ids=" + json.dumps([m.get("id") for m in models if isinstance(m, dict)], separators=(",", ":")))
          PY
      - name: Live inference qualification
        shell: bash
        run: |
          set -euo pipefail
          url="${FREELLMAPI_URL:-http://127.0.0.1:3001/v1}"
          key_file="${FREELLMAPI_KEY_FILE:-$HOME/.config/mediahub/freellmapi.key}"
          model="${FREELLMAPI_MODEL:-qwen2.5-coder:3b}"
          key="$(cat "$key_file")"
          python3 - "$url" "$key" "$model" <<'PY'
          import json, sys, urllib.request
          url, key, model = sys.argv[1], sys.argv[2], sys.argv[3]
          marker = "MEDIAHUB_FREELLMAPI_LIVE_OK"
          payload = {
              "model": model,
              "messages": [{"role": "user", "content": "Reply exactly " + marker}],
              "temperature": 0,
              "max_tokens": 32,
          }
          req = urllib.request.Request(
              url.rstrip("/") + "/chat/completions",
              data=json.dumps(payload, separators=(",", ":")).encode(),
              headers={"Authorization": "Bearer " + key, "Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=120) as response:
              body = json.loads(response.read().decode())
              text = body["choices"][0]["message"]["content"].strip()
              print("inference_http_status=" + str(response.status))
              print("model=" + model)
              print("response_nonempty=" + str(bool(text)).lower())
              print("marker_present=" + str(text == marker).lower())
              if text != marker:
                  raise SystemExit("marker_mismatch")
          print("qualification=LIVE_QUALIFIED")
          PY
      - name: Sanitized evidence
        if: always()
        run: |
          echo "node=$(hostname)"
          echo "provider=freellmapi"
          echo "url=${FREELLMAPI_URL:-http://127.0.0.1:3001/v1}"
          echo "model=${FREELLMAPI_MODEL:-qwen2.5-coder:3b}"
          echo "secret_values=SUPPRESSED"
