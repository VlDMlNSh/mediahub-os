name: Gateway candidate validation

on:
  pull_request:
    paths:
      - "docker-compose.yml"
      - ".env.example"
      - "config/**"
      - "scripts/**"
      - "docs/gateway-architecture.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose and manifests
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i 's/CHANGE_ME_LONG_RANDOM_PASSWORD/test-password/g; s/CHANGE_ME_LONG_RANDOM_64_HEX/test-session-secret/g; s/CHANGE_ME_STRONG_PASSWORD/test-admin-password/g' .env
          docker compose config --quiet
          python3 -m json.tool config/channels.json >/dev/null
          python3 -m json.tool config/model-mapping.json >/dev/null
          python3 -m py_compile scripts/gateway-init.py
          test -x scripts/init-gateway.sh
      - name: Secret hygiene
        run: |
          set -euo pipefail
          if grep -RInE '(sk-[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_-]{20,}|BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY)'             docker-compose.yml .env.example config scripts docs/gateway-architecture.md; then
            echo "Potential credential material found"
            exit 1
          fi
