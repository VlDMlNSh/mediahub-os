name: MH-22 qualification v1.1
on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        required: true
        type: string
      run_id:
        required: true
        type: string
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qualification/mh22-executor-v1.1-20260930
          fetch-depth: 0
      - name: Verify exact candidate is available
        run: |
          git cat-file -e "${{ inputs.candidate_commit }}^{commit}"
          git merge-base --is-ancestor 471f709f5633feab7aeb62dd3ea52effad6d2bc4 "${{ inputs.candidate_commit }}"
      - name: Materialize exact candidate worktree
        run: |
          git worktree add --detach ./candidate "${{ inputs.candidate_commit }}"
      - name: Execute 23-pass evidence gate
        run: |
          python qualification/mh22_qualification_executor_v1_1.py \
            --repo ./candidate \
            --candidate-commit "${{ inputs.candidate_commit }}" \
            --run-id "${{ inputs.run_id }}" \
            --manifest "${{ github.workspace }}/qualification/mh22-executor-manifest-v1_1.json" \
            --output "${{ github.workspace }}/mh22-evidence.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mh22-evidence-${{ inputs.run_id }}
          path: mh22-evidence.json
