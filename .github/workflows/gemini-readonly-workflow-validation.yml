name: Gemini Read-only Workflow Contract

on:
  push:
    branches:
      - security/gemini-readonly-hardening-20261017
    paths:
      - ".github/workflows/gemini-readonly-audit.yml"
      - ".github/workflows/gemini-readonly-audit-retry.yml"
      - ".github/workflows/gemini-readonly-workflow-validation.yml"
      - "scripts/test_gemini_readonly_workflows.py"
      - "scripts/gemini_http_response.js"
      - "scripts/test_gemini_http_response.js"
      - "scripts/mark_gemini_missing_credential.js"
      - "scripts/test_gemini_missing_credential.js"
      - "scripts/gemini_provider_outcome.js"
      - "scripts/test_gemini_provider_outcome.js"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/gemini-readonly-audit.yml"
      - ".github/workflows/gemini-readonly-audit-retry.yml"
      - ".github/workflows/gemini-readonly-workflow-validation.yml"
      - "scripts/test_gemini_readonly_workflows.py"
      - "scripts/gemini_http_response.js"
      - "scripts/test_gemini_http_response.js"
      - "scripts/mark_gemini_missing_credential.js"
      - "scripts/test_gemini_missing_credential.js"
      - "scripts/gemini_provider_outcome.js"
      - "scripts/test_gemini_provider_outcome.js"

permissions:
  contents: read

concurrency:
  group: gemini-readonly-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-contract-tests:
    name: actionlint and security-contract regressions
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify checkout SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          echo "source_commit_sha=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Lint changed workflow definitions
        shell: bash
        run: |
          set -euo pipefail
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 \
            .github/workflows/gemini-readonly-audit.yml \
            .github/workflows/gemini-readonly-audit-retry.yml \
            .github/workflows/gemini-readonly-workflow-validation.yml

      - name: Test least privilege and workflow invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_gemini_readonly_workflows.py

      - name: Run executable provider and lifecycle regression tests
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test_gemini_http_response.js
          node scripts/test_gemini_missing_credential.js
          node scripts/test_gemini_provider_outcome.js
