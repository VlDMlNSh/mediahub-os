name: Astra distributed verification

on:
  workflow_call:
    inputs:
      command_id:
        required: true
        type: string
      target_sha:
        required: true
        type: string
    secrets:
      ASTRA_NODE_HMAC_KEY_MH_DEV_01:
        required: true
      ASTRA_NODE_HMAC_KEY_MH_DEV_02:
        required: true
      ASTRA_NODE_HMAC_KEY_VOKTORS_MAC:
        required: true
    outputs:
      status:
        description: "Fresh three-node distributed verification status"
        value: ${{ jobs.aggregate.outputs.status }}
      evidence_artifact:
        description: "Artifact containing fresh node attestations"
        value: ${{ jobs.aggregate.outputs.evidence_artifact }}
      provider_evidence_artifact:
        description: "Fresh A3 provider qualification evidence from the provider runner"
        value: astra-provider-qualification-${{ github.run_id }}-${{ github.run_attempt }}

permissions:
  contents: read

concurrency:
  group: astra-distributed-verification-${{ github.repository }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  node-mh-dev-01:
    name: Fresh attestation mh-dev-01
    runs-on: [self-hosted, linux, x64, mediahub-control]
    timeout-minutes: 15
    env:
      ASTRA_EXPECTED_NODE_ID: mh-dev-01
      ASTRA_COMMAND_ID: ${{ inputs.command_id }}
      ASTRA_TARGET_SHA: ${{ inputs.target_sha }}
      ASTRA_WORKTREE: ${{ github.workspace }}
      ASTRA_NODE_ATTESTATION_HMAC_KEY: ${{ secrets.ASTRA_NODE_HMAC_KEY_MH_DEV_01 }}
      ASTRA_NODE_ATTESTATION_OUTPUT: ${{ github.workspace }}/.astra-state/distributed-attestation/mh-dev-01.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 50
      - name: Canonical node admission
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "mh-dev-01"
          test "$(id -un)" = "mediahub-runner"
      - name: Produce fresh attestation
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ASTRA_NODE_ATTESTATION_HMAC_KEY"
          mkdir -p "$ASTRA_WORKTREE/.astra-state/distributed-attestation"
          python3 ops/qualification/produce_distributed_node_attestation.py
      - name: Upload node attestation
        uses: actions/upload-artifact@v4
        with:
          name: astra-distributed-attestation-mh-dev-01-${{ github.run_id }}-${{ github.run_attempt }}
          path: .astra-state/distributed-attestation/mh-dev-01.json
          if-no-files-found: error

  node-mh-dev-02:
    name: Fresh attestation mh-dev-02
    runs-on: [self-hosted, linux, x64, mediahub-provider]
    timeout-minutes: 20
    outputs:
      a3_status: ${{ steps.a3.outputs.status }}
    env:
      ASTRA_EXPECTED_NODE_ID: mh-dev-02
      ASTRA_COMMAND_ID: ${{ inputs.command_id }}
      ASTRA_TARGET_SHA: ${{ inputs.target_sha }}
      ASTRA_WORKTREE: ${{ github.workspace }}
      ASTRA_NODE_ATTESTATION_HMAC_KEY: ${{ secrets.ASTRA_NODE_HMAC_KEY_MH_DEV_02 }}
      ASTRA_NODE_ATTESTATION_OUTPUT: ${{ github.workspace }}/.astra-state/distributed-attestation/mh-dev-02.json
      MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
      SILICONFLOW_API_KEY_1: ${{ secrets.SILICONFLOW_API_KEY_1 }}
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      SILICONFLOW_API_KEY_2: ${{ secrets.SILICONFLOW_API_KEY_2 }}
      NOVITA_API_KEY_1: ${{ secrets.NOVITA_API_KEY_1 }}
      NOVITA_API_KEY: ${{ secrets.NOVITA_API_KEY }}
      NOVITA_API_KEY_2: ${{ secrets.NOVITA_API_KEY_2 }}
      ZAI_API_KEY_1: ${{ secrets.ZAI_API_KEY_1 }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      ZAI_API_KEY_2: ${{ secrets.ZAI_API_KEY_2 }}
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      AIONLABS_API_KEY: ${{ secrets.AIONLABS_API_KEY }}
      CLOUDFLARE_API_TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN_1 }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_API_TOKEN_2: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
      NARAROUTER_API_KEY_1: ${{ secrets.NARAROUTER_API_KEY_1 }}
      NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
      ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
      UNOROUTER_API_KEY: ${{ secrets.UNOROUTER_API_KEY }}
      ZEROUTER_API_KEY: ${{ secrets.ZEROUTER_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MISTRAL_API_KEY_1: ${{ secrets.MISTRAL_API_KEY_1 }}
      MISTRAL_API_KEY_2: ${{ secrets.MISTRAL_API_KEY_2 }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_1 }}
      CLOUDFLARE_ACCOUNT_ID_2: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 50
      - name: Distributed node admission
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "mh-dev-02"
          test "$(id -un)" = "mediahub"
      - name: Produce fresh attestation
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ASTRA_NODE_ATTESTATION_HMAC_KEY"
          mkdir -p "$ASTRA_WORKTREE/.astra-state/distributed-attestation"
          python3 ops/qualification/produce_distributed_node_attestation.py
      - name: Upload node attestation
        uses: actions/upload-artifact@v4
        with:
          name: astra-distributed-attestation-mh-dev-02-${{ github.run_id }}-${{ github.run_attempt }}
          path: .astra-state/distributed-attestation/mh-dev-02.json
          if-no-files-found: error

      - name: Execute A3 provider qualification on provider node
        id: a3
        shell: bash
        run: |
          set -u
          mkdir -p .astra-state/provider-qualification
          set +e
          python3 ops/qualification/qualify_execution_backends.py --target-sha "$ASTRA_TARGET_SHA" > .astra-state/provider-qualification/provider-model.json
          rc=$?
          set -e
          if [ ! -s .astra-state/provider-qualification/provider-model.json ]; then
            printf '%s\n' '{"schema":"mediahub.provider-model-qualification.v1","status":"BLOCKED","reason":"qualifier_no_output","target_sha":"'"$ASTRA_TARGET_SHA"'","node_id":"'"$ASTRA_EXPECTED_NODE_ID"'","secret_values":"SUPPRESSED"}' > .astra-state/provider-qualification/provider-model.json
          fi
          status="$(python3 - .astra-state/provider-qualification/provider-model.json <<'PY'
          import json, sys
          try:
              data=json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              print("BLOCKED")
              raise SystemExit
          print(data.get("status","BLOCKED"))
          PY
          )"
          if [ "$status" = "PASS" ]; then
            echo "status=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "status=BLOCKED" >> "$GITHUB_OUTPUT"
          fi
          echo "returncode=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload A3 provider qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-provider-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: .astra-state/provider-qualification/provider-model.json
          if-no-files-found: error
          retention-days: 7

  node-voktors-mac:
    name: Fresh attestation Voktors-Mac-mini.local
    runs-on: [self-hosted, macOS, ARM64, astra-control]
    timeout-minutes: 15
    env:
      ASTRA_EXPECTED_NODE_ID: Voktors-Mac-mini.local
      ASTRA_COMMAND_ID: ${{ inputs.command_id }}
      ASTRA_TARGET_SHA: ${{ inputs.target_sha }}
      ASTRA_WORKTREE: ${{ github.workspace }}
      ASTRA_NODE_ATTESTATION_HMAC_KEY: ${{ secrets.ASTRA_NODE_HMAC_KEY_VOKTORS_MAC }}
      ASTRA_NODE_ATTESTATION_OUTPUT: ${{ github.workspace }}/.astra-state/distributed-attestation/Voktors-Mac-mini.local.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 50
      - name: Distributed node admission
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "Voktors-Mini.Dlink"
          test "${RUNNER_NAME:-}" = "Voktors-Mini-Astra-Control"
          test "$(id -un)" = "voktor"
      - name: Produce fresh attestation
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ASTRA_NODE_ATTESTATION_HMAC_KEY"
          mkdir -p "$ASTRA_WORKTREE/.astra-state/distributed-attestation"
          python3 ops/qualification/produce_distributed_node_attestation.py
      - name: Upload node attestation
        uses: actions/upload-artifact@v4
        with:
          name: astra-distributed-attestation-voktors-mac-${{ github.run_id }}-${{ github.run_attempt }}
          path: .astra-state/distributed-attestation/Voktors-Mac-mini.local.json
          if-no-files-found: error

  aggregate:
    name: Canonical aggregate and verify
    needs:
      - node-mh-dev-01
      - node-mh-dev-02
      - node-voktors-mac
    runs-on: [self-hosted, linux, x64, mediahub-control]
    timeout-minutes: 15
    env:
      ASTRA_EXPECTED_NODE_ID: mh-dev-01
      ASTRA_NODE_ID: mh-dev-01
      ASTRA_COMMAND_ID: ${{ inputs.command_id }}
      ASTRA_TARGET_SHA: ${{ inputs.target_sha }}
      ASTRA_WORKTREE: ${{ github.workspace }}
      ASTRA_DISTRIBUTED_EVIDENCE_DIR: ${{ github.workspace }}/.astra-state/distributed-verification
      ASTRA_NODE_HMAC_KEY_MH_DEV_01: ${{ secrets.ASTRA_NODE_HMAC_KEY_MH_DEV_01 }}
      ASTRA_NODE_HMAC_KEY_MH_DEV_02: ${{ secrets.ASTRA_NODE_HMAC_KEY_MH_DEV_02 }}
      ASTRA_NODE_HMAC_KEY_VOKTORS_MAC: ${{ secrets.ASTRA_NODE_HMAC_KEY_VOKTORS_MAC }}
    outputs:
      status: ${{ steps.aggregate.outputs.status }}
      evidence_artifact: astra-distributed-evidence-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 50
      - name: Canonical node admission
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "mh-dev-01"
          test "$(id -un)" = "mediahub-runner"
      - name: Download fresh node attestations
        uses: actions/download-artifact@v4
        with:
          pattern: astra-distributed-attestation-*
          path: .astra-state/distributed-verification
          merge-multiple: true
      - name: Aggregate fresh distributed evidence
        id: aggregate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ASTRA_WORKTREE/.astra-state/distributed-verification"
          python3 ops/qualification/produce_distributed_verification_evidence.py
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result=json.loads(Path(".astra-state/distributed-verification-result.json").read_text())
          assert result["command_id"] == os.environ["ASTRA_COMMAND_ID"]
          assert result["node_id"] == "mh-dev-01"
          assert result["target_sha"] == os.environ["ASTRA_TARGET_SHA"]
          assert result["phase"] == "distributed_verification"
          assert result["returncode"] == 0
          assert result["status"] == "PASS"
          Path(os.environ["GITHUB_OUTPUT"]).write_text("status=PASS\n", encoding="utf-8")
          PY
      - name: Upload aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: astra-distributed-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .astra-state/distributed-verification/*.json
            .astra-state/distributed-verification-result.json
          if-no-files-found: error
