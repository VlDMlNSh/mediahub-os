name: ASTRA GOLD unified autonomous development qualification

on:
  workflow_dispatch:
    inputs:
      confirm_launch:
        description: "Explicit human confirmation to launch Astra Gold qualification"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: astra-gold-unified-qualification
  cancel-in-progress: false

jobs:
  g4-admission:
    name: Verify fresh G4 115-round evidence
    if: ${{ inputs.confirm_launch == true }}
    runs-on: [self-hosted, linux, x64, mediahub-control]
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Resolve exact G4 run for this source SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/astra-g4-115-qualification.yml/runs?branch=main&per_page=50" --jq '.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .status == "completed" and .conclusion == "success") | .id' | head -n 1)"
          test -n "$run_id"
          echo "G4_RUN_ID=$run_id" >> "$GITHUB_ENV"
      - name: Download exact G4 evidence artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .astra-state/g4
          gh run download "$G4_RUN_ID" -n "g4-115-$GITHUB_SHA" -D .astra-state/g4
          test -s .astra-state/g4/g4-115.json
      - name: Independently verify G4 evidence
        run: |
          set -euo pipefail
          python3 ops/qualification/verify_g4_115.py .astra-state/g4/g4-115.json --expected-sha "$GITHUB_SHA"

  prepare-command:
    needs: g4-admission
    if: ${{ inputs.confirm_launch == true }}
    name: Prepare signed GOLD command
    runs-on: [self-hosted, linux, x64, mediahub-control]
    timeout-minutes: 30
    outputs:
      command_id: ${{ steps.command.outputs.command_id }}
    env:
      ASTRA_NODE_HMAC_KEY_MH_DEV_01: ${{ secrets.ASTRA_NODE_HMAC_KEY_MH_DEV_01 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
          persist-credentials: false
      - name: Canonical runtime preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "mh-dev-01"
          test "$(id -un)" = "mediahub-runner"
          test -z "$(git status --short)"
          python3 -m compileall -q runtime tests astra_github_agent.py
          PYTHONPATH=runtime:. python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Canonical qualification launch gate schema
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tests/test_astra_gold_qualification_launch_schema.py tests/test_qualification_launch_gate.py tests/test_openopc_registry.py
      - name: ASTRA GOLD architecture drift gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tests/test_astra_gold_architecture_drift.py
      - name: Qualify hybrid cloud provider authentication
        shell: bash
        run: |
          set -euo pipefail
          python3 ops/qualification/hybrid_agent_auth_probe.py
      - name: Materialize and sign authoritative GOLD command
        id: command
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ASTRA_NODE_HMAC_KEY_MH_DEV_01"
          mkdir -p control/commands
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          node="mh-dev-01"
          command_id=f"ASTRA-GOLD-UNIFIED-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          p=Path("control/commands")/f"{node}.json"
          p.write_text(json.dumps({
              "schema_version":"mediahub.astra.control-command.v1",
              "command_id":command_id,
              "node_id":node,
              "operation":"autonomous_gold_mission",
              "target_sha":os.environ["GITHUB_SHA"],
              "workflow_only":True,
              "owned_paths":["architecture","ops/agent-fabric","ops/qualification","control/qualification"],
              "title":"Human-admitted unified ASTRA GOLD qualification",
              "description":"Execute the canonical Astra GOLD mission through signed command authority, fresh distributed verification, autonomous queue promotion gates, and immutable result publication.",
              "exclusive_actions":["execute"],
              "issued_at":int(time.time())
          }, indent=2)+"\n", encoding="utf-8")
          Path(os.environ["GITHUB_OUTPUT"]).write_text(f"command_id={command_id}\n", encoding="utf-8")
          PY
          python3 ops/control/sign_command.py control/commands/mh-dev-01.json
      - name: Publish signed command artifact
        uses: actions/upload-artifact@v4
        with:
          name: astra-gold-authoritative-command-${{ github.run_id }}-${{ github.run_attempt }}
          path: control/commands/mh-dev-01.json
          if-no-files-found: error
          retention-days: 1

  distributed-verification:
    needs: prepare-command
    if: ${{ inputs.confirm_launch == true }}
    uses: ./.github/workflows/astra-distributed-verification.yml
    with:
      command_id: ${{ needs.prepare-command.outputs.command_id }}
      target_sha: ${{ github.sha }}
    secrets:
      ASTRA_NODE_HMAC_KEY_MH_DEV_01: ${{ secrets.ASTRA_NODE_HMAC_KEY_MH_DEV_01 }}
      ASTRA_NODE_HMAC_KEY_MH_DEV_02: ${{ secrets.ASTRA_NODE_HMAC_KEY_MH_DEV_02 }}
      ASTRA_NODE_HMAC_KEY_VOKTORS_MAC: ${{ secrets.ASTRA_NODE_HMAC_KEY_VOKTORS_MAC }}

  provider-qualification:
    needs: prepare-command
    if: ${{ inputs.confirm_launch == true }}
    uses: ./.github/workflows/astra-provider-qualification.yml
    with:
      command_id: ${{ needs.prepare-command.outputs.command_id }}
      target_sha: ${{ github.sha }}
    secrets: inherit

  qualify:
    needs:
      - prepare-command
      - distributed-verification
      - provider-qualification
      - g4-admission
    if: ${{ inputs.confirm_launch == true && needs.distributed-verification.outputs.status == 'PASS' && needs.provider-qualification.outputs.status == 'PASS' && needs.g4-admission.result == 'success' }}
    name: Execute signed ASTRA GOLD mission
    runs-on: [self-hosted, linux, x64, mediahub-control]
    timeout-minutes: 90
    env:
      ASTRA_ONESHOT: "1"
      ASTRA_WORKFLOW_ONLY: "1"
      ASTRA_STATE_DIR: "${{ github.workspace }}/.astra-state"
      ASTRA_PROVIDER_EVIDENCE_PATH: "${{ github.workspace }}/.astra-state/provider-qualification/provider-model.json"
      ASTRA_DEFER_RESULT_PUBLICATION: "1"
      ASTRA_DISTRIBUTED_EVIDENCE_DIR: "${{ github.workspace }}/.astra-state"
      ASTRA_NODE_HMAC_KEY_MH_DEV_01: ${{ secrets.ASTRA_NODE_HMAC_KEY_MH_DEV_01 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Canonical admission
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "mh-dev-01"
          test "$(id -un)" = "mediahub-runner"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --short)"
      - name: Download signed command and fresh distributed evidence
        uses: actions/download-artifact@v4
        with:
          pattern: astra-gold-authoritative-command-*
          path: .astra-state/command
          merge-multiple: true
      - name: Download distributed evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.distributed-verification.outputs.evidence_artifact }}
          path: .astra-state

      - name: Download provider qualification evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.provider-qualification.outputs.evidence_artifact }}
          path: .astra-state/provider-qualification

      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
      - name: Verify signed command binding
        shell: bash
        run: |
          set -euo pipefail
          cp .astra-state/command/mh-dev-01.json control/commands/mh-dev-01.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("control/commands/mh-dev-01.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          expected=f"ASTRA-GOLD-UNIFIED-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          assert d["command_id"] == expected
          assert d["node_id"] == "mh-dev-01"
          assert d["operation"] == "autonomous_gold_mission"
          assert d["workflow_only"] is True
          assert d["target_sha"] == os.environ["GITHUB_SHA"]
          assert isinstance(d.get("signature"), str) and len(d["signature"]) == 64
          PY
      - name: Execute signed Astra controller
        shell: bash
        run: |
          set -euo pipefail
          python3 astra_github_agent.py
      - name: Validate fresh GOLD mission result
        shell: bash
        run: |
          set -euo pipefail
          test -s control/results/mh-dev-01.json
          python3 - <<'PY'
          import json, os
          d=json.load(open("control/results/mh-dev-01.json"))
          result=d.get("result",{})
          expected=f"ASTRA-GOLD-UNIFIED-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          assert d.get("command_id") == expected
          assert d.get("node_id") == "mh-dev-01"
          assert d.get("target_sha") == os.environ["GITHUB_SHA"]
          assert d.get("execution_head") == d.get("target_sha")
          assert d.get("returncode") == 0
          assert result.get("phase") == "autonomous_queue"
          assert result.get("status") == "PASS"
          queue=result.get("queue",{})
          assert queue.get("status") == "PASS"
          assert int(queue.get("workers",0)) >= 1
          assert all(item.get("status") == "VERIFIED" for item in queue.get("results",[]))
          print("ASTRA_GOLD_MISSION_PASS")
          PY

      - name: Stage sanitized GOLD result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s control/results/mh-dev-01.json
          cp control/results/mh-dev-01.json .astra-state/controller-result.json
          python3 - <<'PY'
          import json
          d=json.load(open(".astra-state/controller-result.json"))
          assert d.get("secret_values") == "SUPPRESSED"
          PY

      - name: Upload sanitized GOLD result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-gold-node-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: .astra-state/controller-result.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish sanitized qualification marker
        if: always()
        shell: bash
        run: |
          set -u
          echo "system=ASTRA_GOLD"
          echo "scope=whole_system"
          echo "commit=$(git rev-parse HEAD 2>/dev/null || echo unavailable)"
          echo "node=mh-dev-01"
          echo "credentials=SUPPRESSED"
