name: MediaHub one-time storage migration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mediahub-one-time-storage-migration.yml"

permissions:
  contents: write

concurrency:
  group: mediahub-one-time-storage-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: [self-hosted, linux, x64, mediahub-control]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Migrate verified local-ai data to MEDIAHUB_DATA
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          test "$(hostname)" = "mh-dev-01"
          test "$(id -un)" = "mediahub-runner"

          SRC=/home/mediahub/local-ai
          DST=/srv/mediahub/data/local-ai
          BACKUP=/home/mediahub/local-ai.root-backup
          MARKER=ops/storage/mediahub-storage-migration-result.md

          mkdir -p "$(dirname "$MARKER")"

          {
            echo "# MediaHub storage migration result"
            echo
            echo "- timestamp_utc: $(date -u +%FT%TZ)"
            echo "- host: $(hostname)"
            echo "- runner_user: $(id -un)"
            echo "- source: $SRC"
            echo "- target: $DST"
          } > "$MARKER"

          test -d "$SRC"
          test -d /srv/mediahub
          test -f /srv/mediahub/lost+found || true

          # The destination was prepared as /srv/mediahub/data owned by mediahub.
          # Do not weaken permissions. Use passwordless sudo only if already
          # configured for the runner; otherwise fail closed.
          as_mediahub() {
            if [ "$(id -un)" = "mediahub" ]; then
              "$@"
            else
              sudo -n -u mediahub -- "$@"
            fi
          }

          as_mediahub mkdir -p /srv/mediahub/data
          as_mediahub test -w /srv/mediahub/data

          if [ -e "$DST" ] && [ ! -d "$DST" ]; then
            echo "destination exists but is not a directory" >&2
            exit 1
          fi
          as_mediahub mkdir -p "$DST"

          # Idempotent copy. No deletion occurs before exact verification.
          if command -v rsync >/dev/null 2>&1; then
            as_mediahub rsync -aHAX --numeric-ids --delete "$SRC"/ "$DST"/
          else
            as_mediahub cp -a "$SRC"/. "$DST"/
          fi

          # Exact manifest comparison using relative path, size and SHA-256.
          python3 - "$SRC" "$DST" <<'PY'
          import hashlib, pathlib, sys
          src, dst = map(pathlib.Path, sys.argv[1:])

          def manifest(root):
              out = {}
              for p in sorted(root.rglob("*")):
                  if p.is_symlink():
                      raise SystemExit(f"symlink in migration tree is not permitted: {p}")
                  if p.is_file():
                      h = hashlib.sha256()
                      with p.open("rb") as f:
                          for chunk in iter(lambda: f.read(1024 * 1024), b""):
                              h.update(chunk)
                      rel = p.relative_to(root).as_posix()
                      out[rel] = (p.stat().st_size, h.hexdigest())
              return out

          a, b = manifest(src), manifest(dst)
          if a != b:
              only_a = sorted(set(a) - set(b))[:20]
              only_b = sorted(set(b) - set(a))[:20]
              changed = sorted(k for k in set(a) & set(b) if a[k] != b[k])[:20]
              print("IDENTICAL=False")
              print("only_source=", only_a)
              print("only_target=", only_b)
              print("changed=", changed)
              raise SystemExit(2)
          print(f"IDENTICAL=True files={len(a)} bytes={sum(v[0] for v in a.values())}")
          PY

          # Preserve rollback until the post-switch path check succeeds.
          if [ -e "$BACKUP" ] || [ -L "$BACKUP" ]; then
            as_mediahub rm -rf "$BACKUP"
          fi
          as_mediahub mv "$SRC" "$BACKUP"
          as_mediahub ln -s "$DST" "$SRC"

          test -L "$SRC"
          test "$(readlink "$SRC")" = "$DST"
          as_mediahub test -d "$SRC"
          as_mediahub test -f "$SRC/.DS_Store" 2>/dev/null || true

          # Path-level readback through the original canonical path.
          python3 - "$SRC" "$DST" <<'PY'
          import pathlib, sys
          a, b = map(pathlib.Path, sys.argv[1:])
          assert a.is_symlink()
          assert a.resolve() == b.resolve()
          assert a.is_dir() and b.is_dir()
          print("PATH_READBACK=PASS")
          PY

          # Only after exact verification and successful canonical-path readback
          # remove the root-filesystem backup to reclaim space.
          as_mediahub rm -rf "$BACKUP"

          {
            echo "- result: PASS"
            echo "- exact_manifest: PASS"
            echo "- canonical_path: $SRC -> $DST"
            echo "- root_backup_removed: true"
            echo "- source_directory_now_symlink: true"
            echo "- target_filesystem: /srv/mediahub"
            echo
            echo "No other active project/runtime trees were moved in this pass because they are not classified as safe data-only relocations."
          } >> "$MARKER"

          git config user.name "MediaHub Storage Migration"
          git config user.email "mediahub-storage-migration@users.noreply.github.com"
          git add "$MARKER" .github/workflows/mediahub-one-time-storage-migration.yml
          git rm .github/workflows/mediahub-one-time-storage-migration.yml
          git commit -m "ops: complete one-time storage migration"
          git push origin HEAD:main
