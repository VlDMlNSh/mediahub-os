name: Generate cloud-agent schema dependency lock

on:
  workflow_dispatch:
  push:
    paths:
      - "requirements/cloud-agent-schema-validation.in"
      - ".github/workflows/cloud-agent-lock-generation.yml"
      - "requirements/cloud-agent-lock-generation-bootstrap.lock"

permissions:
  contents: read

concurrency:
  group: cloud-agent-lock-generation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Make package-source selection explicit and ignore ambient runner pip configuration.
      PIP_CONFIG_FILE: /dev/null
      PIP_INDEX_URL: https://pypi.org/simple
    steps:
      - name: Checkout immutable event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install hash-locked bootstrap toolchain
        run: >-
          python -m pip install
          --disable-pip-version-check
          --no-input
          --upgrade
          --require-hashes
          --only-binary=:all:
          -r requirements/cloud-agent-lock-generation-bootstrap.lock
      - name: Verify the installed bootstrap toolchain
        run: |
          set -euo pipefail
          python -m pip check
          python - <<'PY'
          from importlib.metadata import version

          expected = {
              "build": "1.3.0",
              "click": "8.3.3",
              "packaging": "26.3",
              "pip": "26.2",
              "pip-tools": "7.6.2",
              "pyproject-hooks": "1.2.0",
              "setuptools": "84.0.0",
              "wheel": "0.48.0",
          }
          for distribution, expected_version in expected.items():
              actual = version(distribution)
              if actual != expected_version:
                  raise SystemExit(f"Expected {distribution}=={expected_version}, got {actual}")
              print(f"PASS {distribution}=={actual}")
          PY
      - name: Generate hash-locked requirements
        run: |
          env -u PIP_NO_INDEX PIP_CONFIG_FILE=/dev/null PIP_INDEX_URL=https://pypi.org/simple \
            CUSTOM_COMPILE_COMMAND='env -u PIP_NO_INDEX PIP_CONFIG_FILE=/dev/null PIP_INDEX_URL=https://pypi.org/simple python -m piptools compile --no-config --index-url=https://pypi.org/simple --resolver=backtracking --generate-hashes --strip-extras --output-file=requirements/cloud-agent-schema-validation.lock requirements/cloud-agent-schema-validation.in' \
            python -m piptools compile \
            --no-config \
            --index-url=https://pypi.org/simple \
            --verbose \
            --resolver=backtracking \
            --generate-hashes \
            --strip-extras \
            --output-file=requirements/cloud-agent-schema-validation.lock \
            requirements/cloud-agent-schema-validation.in
          python -m pip config debug
          python -m piptools compile --version
          python --version
          python -m pip --version
          sha256sum requirements/cloud-agent-schema-validation.in requirements/cloud-agent-schema-validation.lock
      - name: Capture lock regeneration diff
        if: always()
        run: |
          mkdir -p artifacts
          : > artifacts/cloud-agent-schema-validation-lock.diff
          if ! git diff --quiet -- requirements/cloud-agent-schema-validation.lock; then
            git diff --no-ext-diff -- requirements/cloud-agent-schema-validation.lock > artifacts/cloud-agent-schema-validation-lock.diff
            echo "LOCK_REGENERATION_MATCH=false"
          else
            echo "LOCK_REGENERATION_MATCH=true"
          fi
      - name: Publish regenerated lock and comparison evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: cloud-agent-schema-validation-lock-${{ github.sha }}
          path: |
            requirements/cloud-agent-schema-validation.lock
            artifacts/cloud-agent-schema-validation-lock.diff
          if-no-files-found: error
          retention-days: 7
      - name: Require byte-for-byte lock reproducibility
        if: success()
        run: |
          git diff --check
          git diff --exit-code -- requirements/cloud-agent-schema-validation.lock
      - name: Emit lock for auditable retrieval
        if: always()
        run: |
          cat requirements/cloud-agent-schema-validation.lock
          sha256sum requirements/cloud-agent-schema-validation.in requirements/cloud-agent-schema-validation.lock
