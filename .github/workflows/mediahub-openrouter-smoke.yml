name: MediaHub OpenRouter fallback smoke

on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: 'OpenRouter API endpoint'
        required: true
        default: 'https://eu.openrouter.ai/api/v1'
        type: string

permissions:
  contents: read

jobs:
  openrouter-smoke:
    name: Validate OpenRouter secret and API path
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_ENDPOINT: ${{ inputs.endpoint }}
    steps:
      - name: Validate secret presence without exposing it
        shell: bash
        run: |
          set -eu
          test -n "${OPENROUTER_API_KEY:-}"
          case "$OPENROUTER_API_KEY" in
            sk-or-*) echo 'openrouter_secret=present' ;;
            *) echo 'ERROR: OPENROUTER_API_KEY has an unexpected prefix' ; exit 1 ;;
          esac

      - name: Query model catalog
        shell: bash
        run: |
          set -eu
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl -sS -o "$response_file" -w '%{http_code}' \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H 'Accept: application/json' \
            "$OPENROUTER_ENDPOINT/models")"
          test "$status" = '200'
          python3 - "$response_file" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text())
          models = payload.get('data', [])
          assert isinstance(models, list) and models, 'OpenRouter returned no models'
          print(f'openrouter_api=PASS models_visible={len(models)}')
          PY
