name: MediaHub GitHub-hosted FCC free Claude worker
# The contract-test job is intentionally triggered when its test file changes.

on:
  pull_request:
    paths:
      - ".github/workflows/mediahub-fcc-free-claude-worker.yml"
      - "tests/test_mediahub_fcc_free_claude_workflow_contract.py"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Explicitly authorize one bounded run through the free-only OpenRouter router"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mediahub-fcc-free-claude-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Set up Python 3.14.7
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.7"
          check-latest: false

      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check uv==0.12.13

      - name: Check out FCC at reviewed immutable source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Alishahryar1/free-claude-code
          ref: 3d2ae2306752dbdf504714a5489bcfcf69b2d04a
          path: fcc
          persist-credentials: false

      - name: Install FCC from its locked dependency graph
        working-directory: fcc
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3d2ae2306752dbdf504714a5489bcfcf69b2d04a"
          uv sync --locked --no-dev
          uv run --locked fcc-server --version
          uv run --locked python -c "from importlib.metadata import distribution; d=distribution('free-claude-code'); names={e.name for e in d.entry_points}; assert {'fcc-server', 'fcc-claude'} <= names"

      - name: Confirm no provider or paid credential was used
        run: |
          set -euo pipefail
          test -z "${OPENROUTER_API_KEY:-}"
          test -z "${ANTHROPIC_API_KEY:-}"
          echo "FCC install smoke only; no provider/model request was made."


  managed-config-preflight:
    if: github.event_name == 'pull_request'
    name: FCC managed auth config preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Set up Python 3.14.7
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.7"
          check-latest: false

      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check uv==0.12.13

      - name: Check out FCC at reviewed immutable source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Alishahryar1/free-claude-code
          ref: 3d2ae2306752dbdf504714a5489bcfcf69b2d04a
          path: fcc
          persist-credentials: false

      - name: Install pinned FCC and verify managed bearer token without provider access
        working-directory: fcc
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3d2ae2306752dbdf504714a5489bcfcf69b2d04a"
          uv sync --locked --no-dev
          export HOME="$RUNNER_TEMP/fcc-preflight-home"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/fcc-preflight-xdg"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME"
          chmod 700 "$HOME" "$XDG_CONFIG_HOME"
          export PROXY_AUTH_ENABLED=true
          export ANTHROPIC_AUTH_TOKEN="mh-fcc-contract-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export FCC_ENV_FILE="$RUNNER_TEMP/fcc-preflight.env"
          umask 077
          printf 'ANTHROPIC_AUTH_TOKEN=%s\n' "$ANTHROPIC_AUTH_TOKEN" > "$FCC_ENV_FILE"
          chmod 600 "$FCC_ENV_FILE"
          (
            cd "$GITHUB_WORKSPACE/fcc"
            uv run --locked python - <<'PY'
          import hmac
          import os
          from free_claude_code.config.loader import get_settings

          settings = get_settings()
          assert settings.proxy_auth_enabled is True
          assert hmac.compare_digest(
              settings.proxy_auth_token, os.environ["ANTHROPIC_AUTH_TOKEN"]
          )
          print("FCC managed bearer-token preflight passed; token values withheld.")
          PY
          )
          uv run --locked python - <<'PY'
          import hmac
          import os
          import stat
          from pathlib import Path
          from free_claude_code.config.loader import get_settings

          settings = get_settings()
          assert settings.proxy_auth_enabled is True
          assert hmac.compare_digest(
              settings.proxy_auth_token, os.environ["ANTHROPIC_AUTH_TOKEN"]
          )
          managed = Path.home() / ".fcc" / ".env"
          assert managed.is_file()
          assert stat.S_IMODE(managed.stat().st_mode) == 0o600
          assert stat.S_IMODE(Path(os.environ["FCC_ENV_FILE"]).stat().st_mode) == 0o600
          print("FCC managed bearer-token preflight passed; token values withheld.")
          PY

  workflow-contract:
    if: github.event_name == 'pull_request'
    name: FCC worker workflow contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          check-latest: false

      - name: Run FCC workflow contract tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.4.2
          python -m pytest -q tests/test_mediahub_fcc_free_claude_workflow_contract.py

  dispatch-gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      admitted: ${{ steps.gate.outputs.admitted }}
    steps:
      - id: gate
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
          ALLOW_FCC_FREE_CLAUDE: ${{ vars.MEDIAHUB_ALLOW_FCC_FREE_CLAUDE }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRM" != "true" ]]; then
            echo "admitted=false" >> "$GITHUB_OUTPUT"
            echo "Dispatch not confirmed; no runner or provider started."
            exit 0
          fi
          [[ "$ALLOW_FCC_FREE_CLAUDE" == "true" ]] || { echo "FCC free Claude is not enabled by repository variable."; exit 1; }
          [[ -n "$OPENROUTER_API_KEY" ]] || { echo "Required secret OPENROUTER_API_KEY is missing."; exit 1; }
          echo "admitted=true" >> "$GITHUB_OUTPUT"

  bounded-worker:
    needs: dispatch-gate
    if: github.event_name == 'workflow_dispatch' && needs.dispatch-gate.outputs.admitted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Set up Python 3.14.7
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.7"
          check-latest: false

      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check uv==0.12.13

      - name: Check out FCC at reviewed immutable source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Alishahryar1/free-claude-code
          ref: 3d2ae2306752dbdf504714a5489bcfcf69b2d04a
          path: fcc
          persist-credentials: false

      - name: Set up Node for Claude Code
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install FCC and Claude Code
        working-directory: fcc
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3d2ae2306752dbdf504714a5489bcfcf69b2d04a"
          uv sync --locked --no-dev
          npm install --global @anthropic-ai/claude-code

      - name: Probe OpenRouter free router and record selected model
        id: provider_probe
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/openrouter-free-probe.json"
          status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --max-time 30 \
            -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
            -H "Content-Type: application/json" \
            -H "HTTP-Referer: https://github.com/VlDMlNSh/mediahub-os" \
            -H "X-Title: MediaHub bounded free-route smoke" \
            https://openrouter.ai/api/v1/chat/completions \
            --data '{"model":"openrouter/free","messages":[{"role":"user","content":"Reply with exactly MEDIAHUB_FREE_ROUTE_PROBE_OK"}],"max_tokens":24,"stream":false}')"
          if [[ "$status" != "200" ]]; then
            echo "OpenRouter free-router probe failed with HTTP $status; response body withheld."
            exit 1
          fi
          model_id="$(jq -er '.model | select(type == "string" and endswith(":free"))' "$response")" || {
            echo "Provider did not return a concrete :free model ID; fail closed."
            exit 1
          }
          request_id="$(jq -er '.id | select(type == "string" and length > 0)' "$response")"
          total_tokens="$(jq -er '.usage.total_tokens | numbers' "$response")"
          printf 'selected_model=%s\nrequest_id=%s\ntotal_tokens=%s\nroute=openrouter/free\n' \
            "$model_id" "$request_id" "$total_tokens" > "$RUNNER_TEMP/mediahub-free-route-metadata.txt"
          echo "model_id=$model_id" >> "$GITHUB_OUTPUT"
          echo "OpenRouter free-router probe succeeded; concrete model ID and request ID recorded."

      - name: Prepare isolated FCC configuration and empty workspace
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fcc-home" "$RUNNER_TEMP/fcc-xdg-config" "$RUNNER_TEMP/fcc-empty-workspace"
          chmod 700 "$RUNNER_TEMP/fcc-home" "$RUNNER_TEMP/fcc-xdg-config" "$RUNNER_TEMP/fcc-empty-workspace"
          test -z "$(find "$RUNNER_TEMP/fcc-home" -mindepth 1 -print -quit)"
          test -z "$(find "$RUNNER_TEMP/fcc-xdg-config" -mindepth 1 -print -quit)"
          test -z "$(find "$RUNNER_TEMP/fcc-empty-workspace" -mindepth 1 -print -quit)"

      - name: Run Claude Code through the pinned free model only
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL_ID: ${{ steps.provider_probe.outputs.model_id }}
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/fcc-home"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/fcc-xdg-config"
          unset ANTHROPIC_API_KEY MODEL_FALLBACKS
          export HOST=127.0.0.1
          export PORT=8082
          export FCC_OPEN_BROWSER=false
          export PROXY_AUTH_ENABLED=true
          export ANTHROPIC_AUTH_TOKEN="mh-fcc-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # FCC's pinned managed-config loader intentionally does not apply this
          # token as a process override. Import it once via the supported FCC_ENV_FILE
          # migration path so the server and client use the same run-scoped token.
          export FCC_ENV_FILE="$RUNNER_TEMP/fcc-runtime.env"
          umask 077
          printf 'ANTHROPIC_AUTH_TOKEN=%s\n' "$ANTHROPIC_AUTH_TOKEN" > "$FCC_ENV_FILE"
          chmod 600 "$FCC_ENV_FILE"
          export MODEL="open_router/${MODEL_ID}"
          export DISABLE_TELEMETRY=1
          export DISABLE_ERROR_REPORTING=1
          export DISABLE_AUTOUPDATER=1
          (
            cd "$GITHUB_WORKSPACE/fcc"
            uv run --locked fcc-server
          ) > "$RUNNER_TEMP/fcc-server.log" 2>&1 &
          FCC_PID=$!
          cleanup() {
            kill "$FCC_PID" 2>/dev/null || true
            wait "$FCC_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=false
          status="000"
          for _ in $(seq 1 60); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --max-time 2 \
              -H "Authorization: Bearer ${ANTHROPIC_AUTH_TOKEN}" \
              http://127.0.0.1:8082/v1/models || true)"
            if [[ "$status" == "200" ]]; then
              ready=true
              break
            fi
            if [[ "$status" == "401" ]]; then
              echo "FCC endpoint is reachable but rejected the run-scoped bearer token (HTTP 401); managed auth configuration did not take effect."
              exit 1
            fi
            sleep 2
          done
          if [[ "$ready" != "true" ]]; then
            echo "FCC endpoint did not become ready; final HTTP status ${status}; server logs withheld."
            exit 1
          fi
          cd "$RUNNER_TEMP/fcc-empty-workspace"
          "$GITHUB_WORKSPACE/fcc/.venv/bin/fcc-claude" --print --output-format text \
            --bare \
            --allowed-tools "Read,Glob,Grep" \
            --disallowed-tools "Bash,WebFetch,WebSearch,NotebookEdit" \
            --permission-mode plan \
            --append-system-prompt "Connectivity smoke only. No repository or personal data is available in this empty workspace. Do not use tools. Do not access credentials or the network. Return only the exact smoke marker requested by the user." \
            "Reply with exactly MEDIAHUB_FCC_FREE_ROUTE_OK" > "$RUNNER_TEMP/mediahub-claude-result.txt"
          if grep -Eiq '(sk-ant-|ANTHROPIC_API_KEY=|Authorization: Bearer|api[_-]?key[[:space:]]*[:=]|password[[:space:]]*[:=])' "$RUNNER_TEMP/mediahub-claude-result.txt" "$RUNNER_TEMP/mediahub-free-route-metadata.txt"; then
            echo "Credential-like material detected in evidence; evidence rejected."
            exit 1
          fi
          grep -Fq "MEDIAHUB_FCC_FREE_ROUTE_OK" "$RUNNER_TEMP/mediahub-claude-result.txt"
          test -s "$RUNNER_TEMP/mediahub-free-route-metadata.txt"
      - name: Upload bounded smoke evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mediahub-fcc-free-route-smoke-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mediahub-claude-result.txt
            ${{ runner.temp }}/mediahub-free-route-metadata.txt
          if-no-files-found: error
          retention-days: 7
