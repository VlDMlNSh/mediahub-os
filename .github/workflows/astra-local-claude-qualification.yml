name: Astra local Claude executor qualification

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - ".github/workflows/astra-local-claude-qualification.yml"
      - "ops/qualification/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astra-local-claude-qualification
  cancel-in-progress: false

jobs:
  qualify:
    name: Real Claude Code -> node-local FCC -> Ollama Qwen3B
    runs-on: [self-hosted, linux, x64, mediahub-provider]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 20
          persist-credentials: false

      - name: Canonical node admission
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "mh-dev-02"
          test "$(id -un)" = "mediahub"
          export PATH="/home/mediahub/.local/bin:/home/mediahub/.local/npm/bin:$PATH"
          command -v claude
          command -v ollama
          command -v fcc-server
          claude --version
          ollama show qwen2.5-coder:3b >/dev/null
          test -f /home/mediahub/.config/mediahub/fcc.env

      - name: Real Claude client through FCC
        shell: bash
        run: |
          set -uo pipefail
          export PATH="/home/mediahub/.local/bin:/home/mediahub/.local/npm/bin:$PATH"
          set -a
          . /home/mediahub/.config/mediahub/fcc.env
          set +a
          model="qwen2.5-coder:3b"
          test "${MODEL:-}" = "ollama/$model"
          token="${ANTHROPIC_AUTH_TOKEN:-}"
          test -n "$token"
          host="${HOST:-127.0.0.1}"
          port="${PORT:-8093}"
          if ! curl -fsS --max-time 3 "http://${host}:${port}/health" >/dev/null 2>&1; then
            nohup setsid fcc-server --host "$host" --port "$port" >/tmp/astra-fcc-real-claude.log 2>&1 &
            for _ in $(seq 1 30); do
              curl -fsS --max-time 2 "http://${host}:${port}/health" >/dev/null 2>&1 && break
              sleep 1
            done
          fi
          curl -fsS --max-time 5 "http://${host}:${port}/health" >/dev/null
          export ANTHROPIC_BASE_URL="http://${host}:${port}"
          export ANTHROPIC_AUTH_TOKEN="$token"
          export ANTHROPIC_API_KEY="$token"
          export ASTRA_FCC_TRANSPORT="fcc"
          export ASTRA_FCC_MODEL="ollama/$model"
          export CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC="1"
          marker="MEDIAHUB_REAL_CLAUDE_FCC_QWEN3B_PASS"
          out="/tmp/astra-real-claude.out"
          err="/tmp/astra-real-claude.err"
          set +e
          timeout 180s claude -p "Return exactly $marker." --output-format text --max-turns 1 >"$out" 2>"$err"
          rc=$?
          set -e
          python3 - "$out" "$err" "$rc" "$marker" "${GITHUB_SHA}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" <<'PY'
          import hashlib,json,sys,time
          from pathlib import Path
          out,err,rc,marker,sha,run_id,attempt=sys.argv[1:]
          text=Path(out).read_text(encoding="utf-8",errors="replace")
          payload={
            "schema":"mediahub.astra.local-claude-qualification.v8",
            "status":"PASS" if int(rc)==0 and marker in text else "BLOCKED",
            "phase":"local_claude_executor",
            "node_id":"mh-dev-02",
            "target_sha":sha,
            "command_id":f"LOCAL-CLAUDE-{run_id}-{attempt}",
            "executor_identity":"claude",
            "provider_or_transport_identity":"fcc",
            "model":"ollama/qwen2.5-coder:3b",
            "captured_at":int(time.time()),
            "marker":marker,
            "marker_present":marker in text,
            "exit_status":int(rc),
            "timeout":int(rc)==124,
            "stdout_sha256":"sha256:"+hashlib.sha256(Path(out).read_bytes()).hexdigest(),
            "stderr_present":Path(err).stat().st_size>0,
            "secret_values":"SUPPRESSED",
          }
          Path("astra-local-claude-qualification.json").write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(payload,sort_keys=True))
          raise SystemExit(0 if payload["status"]=="PASS" else 2)
          PY

      - name: Upload Claude qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-local-claude-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: astra-local-claude-qualification.json
          if-no-files-found: error
          retention-days: 30
