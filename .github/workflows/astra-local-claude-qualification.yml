name: Astra local Claude executor qualification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/astra-local-claude-qualification.yml"
      - "astra_github_agent.py"
      - "ops/qualification/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astra-local-claude-qualification
  cancel-in-progress: false

jobs:
  qualify:
    name: Local Claude executor on mh-dev-02
    runs-on: [self-hosted, linux, x64, mediahub-provider]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 20
          persist-credentials: false

      - name: Canonical node admission and launcher inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "mh-dev-02"
          test "$(id -un)" = "mediahub"
          export PATH="/home/mediahub/.local/bin:/home/mediahub/.local/npm/bin:$PATH"
          command -v claude
          claude --version

      - name: Bounded Claude Code via local FCC/Ollama
        id: qualify
        shell: bash
        run: |
          set -uo pipefail
          export PATH="/home/mediahub/.local/bin:/home/mediahub/.local/npm/bin:$PATH"
          export FCC_ENV_FILE="/home/mediahub/.config/mediahub/fcc.env"
          env_file="/home/mediahub/.config/mediahub/fcc.env"
          test -f "$env_file"
          model="gpt-oss:20b"
          command -v ollama
          command -v claude
          ollama_version="$(ollama --version 2>&1 | sed -E 's/.*version[[:space:]]+//' | sed -E 's/^is[[:space:]]+//' | head -n 1)"
          echo "ollama_version=${ollama_version}"
          python3 -c 'import re,sys; v=sys.argv[1].strip(); m=re.search(r"(\d+)\.(\d+)\.(\d+)",v); raise SystemExit("ollama_version_unparseable") if not m else None; raise SystemExit("ollama_too_old_for_anthropic_messages_api") if tuple(map(int,m.groups())) < (0,14,0) else None' "$ollama_version"
          ollama show "$model" >/dev/null 2>&1 || ollama pull "$model"
          marker="MEDIAHUB_LOCAL_CLAUDE_EXECUTOR_QUALIFICATION_OK"
          out="/tmp/astra-claude-result.txt"
          err="/tmp/astra-claude-stderr.txt"
          status="BLOCKED"
          reason="claude_execution_failed"
          exit_status=1
          : >"$out"
          : >"$err"
          export ANTHROPIC_BASE_URL="http://127.0.0.1:11434"
          export ANTHROPIC_AUTH_TOKEN="ollama"
          export ANTHROPIC_API_KEY=""
          export ANTHROPIC_MODEL="$model"
          export CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1
          export NO_PROXY="127.0.0.1,localhost"
          export no_proxy="127.0.0.1,localhost"
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
          timeout 900s claude --print --output-format text --bare --model "$model" "$marker. Return exactly $marker. Do not modify files, call tools, or access the network." >"$out" 2>"$err"
          exit_status=$?
          if [ "$exit_status" -eq 0 ] && grep -Fx "$marker" "$out" >/dev/null 2>&1; then
            status="PASS"
            reason=""
          elif [ "$exit_status" -eq 124 ]; then
            reason="claude_execution_timeout"
          fi
          export ASTRA_CLAUDE_STATUS="$status"
          export ASTRA_CLAUDE_REASON="$reason"
          export ASTRA_CLAUDE_EXIT_STATUS="$exit_status"
          python3 - <<'PY'
import hashlib, json, os, platform, re, time
from pathlib import Path
out=Path('/tmp/astra-claude-result.txt')
err=Path('/tmp/astra-claude-stderr.txt')
stderr=err.read_text(encoding='utf-8', errors='replace')
classifications=[]
for pat in (r'(?i)http[^\s]{0,24}', r'(?i)(timeout|timed out|unauthorized|forbidden|connection refused|not found|model)'):
    classifications.extend(re.findall(pat, stderr)[:8])
payload={
    'schema':'mediahub.astra.local-claude-qualification.v6',
    'status':os.environ['ASTRA_CLAUDE_STATUS'],
    'phase':'local_claude_executor',
    'node_id':platform.node(),
    'target_sha':os.environ['GITHUB_SHA'],
    'command_id':'LOCAL-CLAUDE-{}-{}'.format(os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']),
    'executor_identity':'claude',
    'provider_or_transport_identity':'fcc-local-ollama',
    'model':'ollama/qwen2.5-coder:7b',
    'captured_at':int(time.time()),
    'marker':'MEDIAHUB_LOCAL_CLAUDE_EXECUTOR_QUALIFICATION_OK',
    'marker_present':out.read_text(encoding='utf-8', errors='replace').strip()=='MEDIAHUB_LOCAL_CLAUDE_EXECUTOR_QUALIFICATION_OK',
    'exit_status':int(os.environ['ASTRA_CLAUDE_EXIT_STATUS']),
    'reason':os.environ['ASTRA_CLAUDE_REASON'],
    'stderr_classification':classifications[:16],
    'output_sha256':'sha256:'+hashlib.sha256(out.read_bytes()).hexdigest(),
    'stderr_present':err.stat().st_size>0,
    'secret_values':'SUPPRESSED',
}
print(json.dumps(payload, sort_keys=True))
Path('astra-local-claude-qualification.json').write_text(json.dumps(payload, indent=2, sort_keys=True)+'\n', encoding='utf-8')
PY
          test "$status" = "PASS"
      - name: Upload Claude qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-local-claude-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: astra-local-claude-qualification.json
          if-no-files-found: error
          retention-days: 30
