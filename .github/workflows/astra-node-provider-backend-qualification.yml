name: Astra Node Provider Backend Qualification

on:
  push:
    branches: [main]
    paths:
      - "ops/qualification/qualify_execution_backends.py"
      - ".github/workflows/astra-node-provider-backend-qualification.yml"
      - "runtime/mediahub_runtime/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: astra-node-provider-backend-qualification
  cancel-in-progress: false

jobs:
  qualify-node:
    runs-on: [self-hosted, mediahub-runner]
    timeout-minutes: 10
    env:
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      SILICONFLOW_API_KEY_1: ${{ secrets.SILICONFLOW_API_KEY_1 }}
      SILICONFLOW_API_KEY_2: ${{ secrets.SILICONFLOW_API_KEY_2 }}
      NOVITA_API_KEY: ${{ secrets.NOVITA_API_KEY }}
      NOVITA_API_KEY_1: ${{ secrets.NOVITA_API_KEY_1 }}
      NOVITA_API_KEY_2: ${{ secrets.NOVITA_API_KEY_2 }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      ZAI_API_KEY_1: ${{ secrets.ZAI_API_KEY_1 }}
      ZAI_API_KEY_2: ${{ secrets.ZAI_API_KEY_2 }}
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      AIONLABS_API_KEY: ${{ secrets.AIONLABS_API_KEY }}
      NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
      NARAROUTER_API_KEY_1: ${{ secrets.NARAROUTER_API_KEY_1 }}
      ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify canonical node
        run: |
          set -euo pipefail
          test "$(hostname)" = "mh-dev-01"

      - name: Run bounded backend qualification
        run: |
          set -euo pipefail
          python3 ops/qualification/qualify_execution_backends.py > astra-node-provider-backend-evidence.json
          cat astra-node-provider-backend-evidence.json

      - name: Publish sanitized node evidence
        if: always()
        run: |
          set -euo pipefail
          test -s astra-node-provider-backend-evidence.json
          git config user.name "Astra Provider Qualification"
          git config user.email "astra-provider-qualification@localhost"
          git fetch origin astra-provider-qualification/mh-dev-01:refs/remotes/origin/astra-provider-qualification/mh-dev-01 || true
          git checkout -B astra-provider-qualification/mh-dev-01
          mkdir -p control/provider-evidence
          cp astra-node-provider-backend-evidence.json control/provider-evidence/mh-dev-01.json
          git add control/provider-evidence/mh-dev-01.json
          git commit -m "astra: provider qualification evidence mh-dev-01" || true
          git push --force origin astra-provider-qualification/mh-dev-01

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-node-provider-backend-evidence
          path: astra-node-provider-backend-evidence.json
          if-no-files-found: error
