name: MH-22 qualification v1.1
on:
  workflow_dispatch:
    inputs:
      candidate_commit: {required: true, type: string}
      run_id: {required: true, type: string}
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: ${{ inputs.candidate_commit }, fetch-depth: 0}
      - name: Checkout executor branch
        run: |
          git fetch origin qualification/mh22-executor-v1.1-20260930
          git checkout qualification/mh22-executor-v1.1-20260930
      - name: Execute 23-pass evidence gate
        run: |
          python qualification/mh22_qualification_executor_v1_1.py             --repo .             --candidate-commit "${{ inputs.candidate_commit }}"             --run-id "${{ inputs.run_id }}"             --manifest qualification/mh22-executor-manifest-v1_1.json             --output mh22-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mh22-evidence-${{ inputs.run_id }}
          path: mh22-evidence.json
