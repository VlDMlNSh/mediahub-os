name: MediaHub Agent Fabric verification

on:
  push:
    branches: [main]
    paths:
      - "runtime/mediahub_runtime/agent_fabric.py"
      - "tests/test_agent_fabric.py"
      - "ops/agent-fabric/manifest/**"
      - ".github/agents/**"
      - ".github/agent-system/**"
      - ".github/workflows/mediahub-agent-fabric-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall -q runtime tests
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check --no-input pytest
      - name: Agent Fabric unit and collision/lease simulation
        run: python -m pytest -q tests/test_agent_fabric.py
      - name: Validate authoritative 23-lane manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("ops/agent-fabric/manifest/mediahub-23-lane-execution-manifest.json")
          d=json.loads(p.read_text())
          assert d["schema"]=="mediahub.agent-fabric.execution-manifest.v1"
          lanes=d["lanes"]
          assert len(lanes)==23
          assert {x["lane_id"] for x in lanes}=={f"MH-{i:02d}" for i in range(1,24)}
          assert all(x["disposition"] in {"WAIT","READY","CLAIMED","VERIFY","BLOCKED","CLOSED"} for x in lanes)
          assert all(x["owner"]=="UNKNOWN" or x["owner"] for x in lanes)
          assert d["promotion_rule"].startswith("PR existence alone")
          print("manifest=PASS lanes=23")
          PY
      - name: Read-back architecture invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              Path(".github/agent-system/architecture.md"),
              Path(".github/agent-system/boundaries.md"),
              Path("docs/checkpoints/mediahub-github-component-final-manifest-2.0.md"),
          ]
          text = "\n".join(p.read_text(encoding="utf-8") for p in files)
          required = ["AI", "Authority", "Cloud", "State Authority", "Remote Mobile", "Local Core"]
          missing = [item for item in required if item not in text]
          assert not missing, f"missing invariant tokens: {missing}"
          print("architecture_invariants=PASS")
          PY
