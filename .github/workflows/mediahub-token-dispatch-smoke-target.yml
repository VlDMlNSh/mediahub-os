name: Temporary token dispatch smoke target

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm dispatch
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = "workflow_dispatch"
          echo "PASS: temporary smoke target received workflow_dispatch"
          echo "ref=$REF_NAME"
