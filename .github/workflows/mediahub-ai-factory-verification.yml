name: MediaHub AI Factory verification

on:
  pull_request:
    paths:
      - '.github/agents/**'
      - '.github/copilot-instructions.md'
      - '.github/ai/**'
      - '.github/workflows/mediahub-openrouter-smoke.yml'
      - 'scripts/verify_ai_factory.py'
      - 'docs/ai/ECC-INTEGRATION.md'
      - 'oss/manifests/ecc.yaml'
      - 'oss/adapters/ecc/**'
      - 'contracts/ai/ai-agent-*.schema.json'
      - 'tests/ai/test_ecc_integration.py'
      - 'tests/ai/test_ecc_adapter.py'
      - 'tests/ai/test_ai_agent_contracts.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify AI factory policy and secret boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run deterministic verification
        run: python3 scripts/verify_ai_factory.py
      - name: Run ECC and AI agent contract tests
        run: python3 -m unittest tests/ai/test_ecc_integration.py tests/ai/test_ecc_adapter.py tests/ai/test_ai_agent_contracts.py
