name: MediaHub AI Factory verification

on:
  pull_request:
    paths:
      - '.github/agents/**'
      - '.github/copilot-instructions.md'
      - '.github/ai/**'
      - '.github/workflows/gemini-batch-dispatch-controller.yml'
      - '.github/workflows/mediahub-ai-factory-verification.yml'
      - '.github/workflows/gemini-pr-readonly-review-wave471.yml'
      - 'tests/test_gemini_pr_readonly_review_wave471_contract.py'
      - 'scripts/verify_ai_factory.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: AI Factory verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run deterministic verification
        run: python3 scripts/verify_ai_factory.py
