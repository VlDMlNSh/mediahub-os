name: MediaHub bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    name: mh-dev-01 bridge smoke
    runs-on: [self-hosted, mediahub-runner]
    timeout-minutes: 30
    steps:
      - name: Checkout fixed verification target
        uses: actions/checkout@v4
        with:
          ref: implementation/p0-06-core-runtime-services
          fetch-depth: 1

      - name: Probe runner and repository
        shell: bash
        run: |
          set -eu
          echo '=== MEDIAHUB BRIDGE ==='
          echo "host=$(hostname)"
          echo "user=$(id -un)"
          echo "kernel=$(uname -sr)"
          echo "arch=$(uname -m)"
          echo "repo=$(git remote get-url origin)"
          echo "branch=$(git branch --show-current)"
          echo "commit=$(git rev-parse HEAD)"
          echo '=== WORKTREE ==='
          git status --short

      - name: Verify fixed P0-06 target
        shell: bash
        run: |
          set -eu
          expected='d9b5c9db128d8ec75dae6fbd03b5d54950bdddf5'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "verified_commit=$actual"

      - name: Targeted runtime tests
        shell: bash
        run: |
          set -eu
          PYTHONPATH=runtime:. python3 -m pytest tests/runtime/test_lifecycle_service.py tests/runtime/test_coordination_service.py -v

      - name: Security and capability scan
        shell: bash
        run: |
          set -eu
          files='runtime/mediahub_runtime/lifecycle.py runtime/mediahub_runtime/lifecycle_service.py runtime/mediahub_runtime/coordination_service.py'
          if grep -nE '(^|[[:space:]])(import|from)[[:space:]]+(subprocess|socket|requests|urllib|http\.client)([[:space:]]|$)' $files; then
            echo 'forbidden external-execution-or-network import detected'
            exit 1
          fi
          if grep -nE '(subprocess\.|socket\.|os\.system|os\.popen|Popen\(|check_output\(|check_call\(|create_subprocess|exec\(|eval\()' $files; then
            echo 'forbidden execution capability detected'
            exit 1
          fi
          if grep -nE 'StateAuthority|InMemoryStateAuthority|_authority|\.execute\(|run_command' runtime/mediahub_runtime/lifecycle_service.py runtime/mediahub_runtime/coordination_service.py; then
            echo 'authority/execution bypass detected'
            exit 1
          fi
          echo 'security_capability_scan=PASS'

      - name: Persistence scan
        shell: bash
        run: |
          set -eu
          files='runtime/mediahub_runtime/lifecycle.py runtime/mediahub_runtime/lifecycle_service.py runtime/mediahub_runtime/coordination_service.py'
          if grep -nE '(^|[[:space:]])(import|from)[[:space:]]+(sqlite3|sqlalchemy|shelve|dbm|pickle)([[:space:]]|$)' $files; then
            echo 'persistence/unsafe-serialization import detected'
            exit 1
          fi
          if grep -nE '(sqlite3\.|create_engine\(|open\(|write_text\(|write_bytes\(|\.write\(|shelve\.|dbm\.)' $files; then
            echo 'filesystem/persistence capability detected'
            exit 1
          fi
          echo 'persistence_scan=PASS'

      - name: Full regression
        shell: bash
        run: |
          set -eu
          PYTHONPATH=runtime:. python3 -m pytest tests/ -v

      - name: Final bridge state
        if: ${{ always() }}
        shell: bash
        run: |
          set -u
          echo '=== BRIDGE RESULT ==='
          echo "host=$(hostname)"
          echo "user=$(id -un)"
          echo "commit=$(git rev-parse HEAD 2>/dev/null || echo unavailable)"
          echo 'worktree:'
          git status --short 2>/dev/null || true
