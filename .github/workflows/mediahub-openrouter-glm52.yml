name: MediaHub OpenRouter GLM-5.2 Contract

on:
  workflow_dispatch:
  push:
    branches:
      - implementation/openrouter-glm52-contract
      - integration/openrouter-runtime-clean
  pull_request:
    branches:
      - main
      - implementation/p0-06-core-runtime-services

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GLM52_MODEL: z-ai/glm-5.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository contracts
        run: python3 tools/validate_contracts.py

      - name: Validate GLM-5.2 contract
        run: python3 -m unittest tests/ai/test_openrouter_glm52.py


      - name: Runtime adapter tests
        run: python3 -m unittest tests.runtime.test_openrouter_connector tests.runtime.test_cloud_orchestrator

      - name: End-to-end Astra cloud inference smoke test
        run: |
          python3 - <<'PY'
          import os
          from runtime.mediahub_runtime.cloud_orchestrator import CloudFirstOrchestrator
          from runtime.mediahub_runtime.connectors.openrouter import OpenRouterConnector

          model = os.environ["GLM52_MODEL"]
          connector = OpenRouterConnector(os.environ.get("OPENROUTER_API_KEY"), model)
          orchestrator = CloudFirstOrchestrator(
              credential_env=os.environ,
              executors={"openrouter": lambda prompt: connector.infer(prompt).output},
          )
          decision, output = orchestrator.execute(
              "coding",
              "Reply with exactly: MEDIAHUB_GLM52_E2E_OK",
              allow_local_extension=False,
          )
          assert decision.provider_id == "openrouter", decision
          assert decision.model == model, decision
          assert output.strip() == "MEDIAHUB_GLM52_E2E_OK", output
          print("MEDIAHUB_GLM52_E2E=PASS")
          PY

      - name: Validate OpenRouter credential presence
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY}"

      - name: Validate model availability without exposing credentials
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          key = os.environ["OPENROUTER_API_KEY"]
          model = os.environ["GLM52_MODEL"]

          request = urllib.request.Request(
              "https://openrouter.ai/api/v1/models",
              headers={"Authorization": f"Bearer {key}"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)

          ids = {item.get("id") for item in payload.get("data", [])}
          if model not in ids:
              raise SystemExit(f"required model is not available: {model}")

          print(f"OPENROUTER_MODEL_AVAILABLE={model}")
          PY
