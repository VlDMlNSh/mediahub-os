name: oss-runtime

on:
  pull_request:
    paths:
      - 'oss/**'
      - '.github/workflows/oss-runtime.yml'
  push:
    branches:
      - main
      - 'engineering/**'
    paths:
      - 'oss/**'
      - '.github/workflows/oss-runtime.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oss
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: oss/go.mod
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
