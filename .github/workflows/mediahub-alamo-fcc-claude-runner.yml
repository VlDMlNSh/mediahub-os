name: MediaHub Alamo local-inference candidate on Ubuntu Hosted Runner

on:
  pull_request:
    paths:
      - ".github/workflows/mediahub-alamo-fcc-claude-runner.yml"
      - "tests/test_mediahub_alamo_fcc_runner_contract.py"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Authorize one bounded local-only Alamo/FCC/Claude Code runner smoke"
        required: true
        type: boolean
        default: false
      target_sha:
        description: "Exact current main commit SHA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mediahub-alamo-fcc-runner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  workflow-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          check-latest: false
      - name: Run local Alamo runner contract tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.4.2
          python -m pytest -q tests/test_mediahub_alamo_fcc_runner_contract.py

  dispatch-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      admitted: ${{ steps.gate.outputs.admitted }}
    steps:
      - id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONFIRM: ${{ inputs.confirm }}
          TARGET_SHA: ${{ inputs.target_sha }}
          CURRENT_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          TRIGGER_ACTOR: ${{ github.actor }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "admitted=false" >> "$GITHUB_OUTPUT"
            echo "PR validation only; live runner dispatch is not authorized by a pull request."
            exit 0
          fi
          [[ "$EVENT_NAME" == "workflow_dispatch" ]] || { echo "Unsupported event."; exit 1; }
          if [[ "$CONFIRM" != "true" ]]; then
            echo "admitted=false" >> "$GITHUB_OUTPUT"
            echo "Dispatch not confirmed; no runner started."
            exit 0
          fi
          [[ "$SOURCE_REF" == "refs/heads/main" ]] || { echo "Must dispatch from main."; exit 1; }
          [[ "$TRIGGER_ACTOR" == "$REPO_OWNER" ]] || { echo "Only repository owner may dispatch."; exit 1; }
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ && "$TARGET_SHA" == "$CURRENT_SHA" ]] || { echo "target_sha must exactly match current main SHA."; exit 1; }
          echo "admitted=true" >> "$GITHUB_OUTPUT"

  alamo-local-fcc-claude:
    needs: dispatch-gate
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && needs.dispatch-gate.outputs.admitted == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Record that live execution is intentionally not run on pull requests
        if: github.event_name == 'pull_request'
        run: echo "PR contract validation does not install Ollama, download models, or invoke Claude Code."

      - name: Check out pinned FCC source
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Alishahryar1/free-claude-code
          ref: 3d2ae2306752dbdf504714a5489bcfcf69b2d04a
          path: fcc
          persist-credentials: false

      - name: Verify runner capacity and install prerequisites
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          free_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          mem_kb="$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)"
          cpu_count="$(nproc)"
          echo "runner_cpu_count=$cpu_count"
          echo "runner_mem_available_kb=$mem_kb"
          echo "runner_temp_free_kb=$free_kb"
          [[ "$cpu_count" -ge 4 ]]
          [[ "$mem_kb" -ge 8388608 ]]
          [[ "$free_kb" -ge 8388608 ]] || { echo "Less than 8 GiB free disk; stop before model installation."; exit 1; }
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zstd
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install pinned Python and uv
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.7"
          check-latest: false

      - name: Install pinned uv
        if: github.event_name == 'workflow_dispatch'
        run: python -m pip install --disable-pip-version-check uv==0.12.13

      - name: Install pinned Ollama and FCC/Claude Code
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        working-directory: fcc
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/ollama-install.sh"
          curl --fail --silent --show-error --location --max-time 60 https://ollama.com/install.sh -o "$installer"
          echo "25f64b810b947145095956533e1bdf56eacea2673c55a7e586be4515fc882c9f  $installer" | sha256sum --check -
          OLLAMA_VERSION=0.40.11 sh "$installer"
          ollama --version | tee "$RUNNER_TEMP/ollama-version.txt"
          grep -Fq "0.40.11" "$RUNNER_TEMP/ollama-version.txt"
          test "$(git rev-parse HEAD)" = "3d2ae2306752dbdf504714a5489bcfcf69b2d04a"
          uv sync --locked --no-dev

      - name: Set up Node for Claude Code
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install pinned Claude Code CLI
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          npm install --global @anthropic-ai/claude-code@2.1.282
          claude --version | tee "$RUNNER_TEMP/claude-code-version.txt"
          grep -Fq "2.1.282" "$RUNNER_TEMP/claude-code-version.txt"

      - name: Install pinned agent toolchain (no provider authentication)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GEMINI_CLI_VERSION: "0.66.0"
          MINI_SWE_AGENT_VERSION: "2.4.6"
          AIDER_VERSION: "0.86.0"
          OPENHANDS_SDK_VERSION: "1.59.0"
          GOOSE_VERSION: "1.57.0"
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          export UV_TOOL_BIN_DIR="$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.local/bin" "$RUNNER_TEMP/agent-toolchain"
          uv python install 3.12
          npm install --global "@google/gemini-cli@${GEMINI_CLI_VERSION}"
          uv tool install --python 3.12 "mini-swe-agent==${MINI_SWE_AGENT_VERSION}"
          uv tool install --python 3.12 "aider-chat==${AIDER_VERSION}"

          uv venv --python 3.12 "$RUNNER_TEMP/openhands-sdk-venv"
          uv pip install --python "$RUNNER_TEMP/openhands-sdk-venv/bin/python" "openhands-sdk==${OPENHANDS_SDK_VERSION}"
          echo "OPENHANDS_SDK_PYTHON=$RUNNER_TEMP/openhands-sdk-venv/bin/python" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/openhands-sdk-venv/bin/python" -c 'from openhands.sdk import Agent, Conversation, LLM; print("OpenHands SDK import OK")'

          goose_archive="$RUNNER_TEMP/agent-toolchain/goose-linux-x86_64.tar.gz"
          curl --fail --silent --show-error --location --max-time 120 \
            "https://github.com/aaif-goose/goose/releases/download/v${GOOSE_VERSION}/goose-x86_64-unknown-linux-gnu.tar.gz" \
            -o "$goose_archive"
          echo "10eb96cb6a159b6e1d38eeedbef6ab64cd28168aad91948f1fa5c34eefdf98e3  $goose_archive" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/agent-toolchain/goose-unpack"
          tar -xzf "$goose_archive" -C "$RUNNER_TEMP/agent-toolchain/goose-unpack"
          goose_binary="$(find "$RUNNER_TEMP/agent-toolchain/goose-unpack" -type f -name goose -perm -u+x -print -quit)"
          test -n "$goose_binary"
          install -m 0755 "$goose_binary" "$HOME/.local/bin/goose"

          gemini --version | tee "$RUNNER_TEMP/agent-toolchain/gemini-cli-version.txt"
          mini --help >/dev/null
          aider --version | tee "$RUNNER_TEMP/agent-toolchain/aider-version.txt"
          goose --version | tee "$RUNNER_TEMP/agent-toolchain/goose-version.txt"
          {
            echo "gemini_cli=$GEMINI_CLI_VERSION"
            echo "mini_swe_agent=$MINI_SWE_AGENT_VERSION"
            echo "aider=$AIDER_VERSION"
            echo "openhands_sdk=$OPENHANDS_SDK_VERSION"
            echo "goose=$GOOSE_VERSION"
            echo "goose_linux_x86_64_sha256=10eb96cb6a159b6e1d38eeedbef6ab64cd28168aad91948f1fa5c34eefdf98e3"
            echo "provider_authentication=NOT_CONFIGURED"
            echo "agent_model_invocations=NOT_RUN"
          } > "$RUNNER_TEMP/agent-toolchain/agent-toolchain-manifest.txt"

      - name: Run local Alamo candidate, FCC and Claude Code smoke
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          MODEL: ollama/llama3.2:3b
          OLLAMA_BASE_URL: http://127.0.0.1:11434
        run: |
          set -euo pipefail
          unset OPENROUTER_API_KEY ANTHROPIC_API_KEY MODEL_FALLBACKS
          export OLLAMA_HOST=127.0.0.1:11434
          export OLLAMA_MODELS="$RUNNER_TEMP/ollama-models"
          mkdir -p "$OLLAMA_MODELS"
          chmod 700 "$OLLAMA_MODELS"
          ollama serve > "$RUNNER_TEMP/ollama-server.log" 2>&1 &
          OLLAMA_PID=$!
          export HOME="$RUNNER_TEMP/fcc-home"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/fcc-xdg-config"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$RUNNER_TEMP/fcc-empty-workspace"
          chmod 700 "$HOME" "$XDG_CONFIG_HOME" "$RUNNER_TEMP/fcc-empty-workspace"
          cleanup() {
            if [[ -n "${FCC_PID:-}" ]]; then kill "$FCC_PID" 2>/dev/null || true; wait "$FCC_PID" 2>/dev/null || true; fi
            if [[ -n "${OLLAMA_PID:-}" ]]; then kill "$OLLAMA_PID" 2>/dev/null || true; wait "$OLLAMA_PID" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          ready=false
          for _ in $(seq 1 60); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:11434/api/tags >/dev/null; then ready=true; break; fi
            sleep 2
          done
          [[ "$ready" == "true" ]] || { echo "Loopback Ollama endpoint did not become ready."; exit 1; }
          ollama pull llama3.2:3b
          ollama list | tee "$RUNNER_TEMP/ollama-model-list.txt"
          grep -Fq "llama3.2:3b" "$RUNNER_TEMP/ollama-model-list.txt"
          curl --fail --silent --show-error --max-time 120 http://127.0.0.1:11434/api/generate \
            -H 'Content-Type: application/json' \
            --data '{"model":"llama3.2:3b","prompt":"Reply with exactly MEDIAHUB_ALAMO_LOCAL_MODEL_OK","stream":false,"options":{"num_predict":32}}' \
            -o "$RUNNER_TEMP/alamo-model-probe.json"
          PROBE_PATH="$RUNNER_TEMP/alamo-model-probe.json" python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path(os.environ["PROBE_PATH"]).read_text())
          assert "MEDIAHUB_ALAMO_LOCAL_MODEL_OK" in data.get("response", "")
          print("Local model marker verified.")
          PY
          ollama show llama3.2:3b --modelfile | sha256sum | awk '{print "model_modelfile_sha256=" $1}' > "$RUNNER_TEMP/ollama-model-metadata.txt"
          export HOST=127.0.0.1
          export PORT=8082
          export FCC_OPEN_BROWSER=false
          export PROXY_AUTH_ENABLED=true
          export ANTHROPIC_AUTH_TOKEN="mh-alamo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export FCC_ENV_FILE="$RUNNER_TEMP/fcc-runtime.env"
          umask 077
          printf 'ANTHROPIC_AUTH_TOKEN=%s\\n' "$ANTHROPIC_AUTH_TOKEN" > "$FCC_ENV_FILE"
          chmod 600 "$FCC_ENV_FILE"
          (
            cd "$GITHUB_WORKSPACE/fcc"
            uv run --locked python - <<'PY'
          import hmac, os
          from free_claude_code.config.loader import get_settings
          settings = get_settings()
          assert settings.proxy_auth_enabled is True
          assert hmac.compare_digest(settings.proxy_auth_token, os.environ["ANTHROPIC_AUTH_TOKEN"])
          print("FCC managed bearer token verified; token withheld.")
          PY
          )
          export DISABLE_TELEMETRY=1 DISABLE_ERROR_REPORTING=1 DISABLE_AUTOUPDATER=1
          (cd "$GITHUB_WORKSPACE/fcc" && exec uv run --locked fcc-server) > "$RUNNER_TEMP/fcc-server.log" 2>&1 &
          FCC_PID=$!
          ready=false
          for _ in $(seq 1 60); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 2 -H "Authorization: Bearer ${ANTHROPIC_AUTH_TOKEN}" http://127.0.0.1:8082/v1/models || true)"
            if [[ "$status" == "200" ]]; then ready=true; break; fi
            if [[ "$status" == "401" ]]; then echo "FCC rejected run-scoped token."; exit 1; fi
            sleep 2
          done
          [[ "$ready" == "true" ]] || { echo "FCC did not become ready."; exit 1; }
          unauth_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 2 http://127.0.0.1:8082/v1/models || true)"
          [[ "$unauth_status" == "401" ]] || { echo "FCC auth not enforced (HTTP $unauth_status)."; exit 1; }
          cd "$RUNNER_TEMP/fcc-empty-workspace"
          "$GITHUB_WORKSPACE/fcc/.venv/bin/fcc-claude" --print --output-format text \
            --bare \
            --allowed-tools "Read,Glob,Grep" \
            --disallowed-tools "Bash,WebFetch,WebSearch,NotebookEdit" \
            --permission-mode plan \
            --append-system-prompt "Local-only MediaHub connectivity test. Empty workspace. No repository data. Do not use tools or network. Return exactly MEDIAHUB_ALAMO_FCC_CLAUDE_OK." \
            "Reply with exactly MEDIAHUB_ALAMO_FCC_CLAUDE_OK" > "$RUNNER_TEMP/alamo-fcc-claude-result.txt"
          grep -Fq "MEDIAHUB_ALAMO_FCC_CLAUDE_OK" "$RUNNER_TEMP/alamo-fcc-claude-result.txt"
          if grep -Eiq '(sk-ant-|ANTHROPIC_API_KEY=|Authorization: Bearer|api[_-]?key[[:space:]]*[:=]|password[[:space:]]*[:=])' "$RUNNER_TEMP/alamo-fcc-claude-result.txt"; then
            echo "Credential-like content detected in output; rejecting evidence."
            exit 1
          fi
          {
            echo "target_sha=$GITHUB_SHA"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "cpu_count=$(nproc)"
            echo "ollama_version=$(ollama --version 2>/dev/null || echo unavailable)"
            echo "ollama_model=llama3.2:3b"
            echo "fcc_commit=3d2ae2306752dbdf504714a5489bcfcf69b2d04a"
            echo "claude_code_version=$(claude --version 2>/dev/null | head -n 1)"
            echo "fcc_route=ollama/llama3.2:3b"
            echo "proxy_auth_required=true"
            echo "paid_fallback=false"
            echo "endpoint_scope=127.0.0.1"
            echo "alamo_equivalence=NOT_VERIFIED"
          } > "$RUNNER_TEMP/alamo-run-metadata.txt"
          chmod 600 "$RUNNER_TEMP/alamo-run-metadata.txt"

      - name: Upload local Alamo/FCC/Claude evidence
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mediahub-alamo-fcc-claude-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/alamo-fcc-claude-result.txt
            ${{ runner.temp }}/alamo-run-metadata.txt
            ${{ runner.temp }}/ollama-version.txt
            ${{ runner.temp }}/ollama-model-list.txt
            ${{ runner.temp }}/ollama-model-metadata.txt
            ${{ runner.temp }}/claude-code-version.txt
            ${{ runner.temp }}/agent-toolchain/
          if-no-files-found: warn
          retention-days: 7
