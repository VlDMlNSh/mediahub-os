version: 1
name: mediahub-ai-router

# This file is a policy contract, not a runtime dispatcher.
# Do not add provider API endpoints or credentials here.
routing:
  mode: policy_only
  direct_provider_api_calls: false
  # Each listed workflow is itself an explicitly admitted controller; no direct provider API calls.
  permitted_cloud_agent_transports:
    - .github/workflows/gemini-batch-dispatch-controller.yml
    - .github/workflows/mediahub-fcc-free-claude-worker.yml
  permitted_cloud_agent_transport_allowlist_only: true
  cloud_claude_runtime: fcc_openrouter_free
  cloud_claude_transport: .github/workflows/mediahub-fcc-free-claude-worker.yml
  cloud_claude_free_only: true
  local_claude_runtime: fcc_ollama
  local_claude_model: llama3.2:3b
  local_claude_host: Voktors-Mini.Dlink
  local_claude_only: true
  paid_fallback: false
  unknown_route_behavior: fail_closed

verification:
  exact_target_sha_required: true
  independent_review_required: true
  runtime_qualification_required: true
  production_authorization: human
