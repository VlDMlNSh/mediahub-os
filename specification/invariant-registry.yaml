schema_version: "1.0"
status: CONFIRMED_BASELINE
invariants:
  - INV-001: Function preservation
  - INV-002: Security by design
  - INV-003: Discovery does not equal Trust
  - INV-004: Presence does not equal Authentication
  - INV-005: Authentication does not equal Authorization
  - INV-006: Remote access does not increase authorization
  - INV-007: Ordinary user does not receive Cloud Development access
  - INV-008: Local-first operation
  - INV-009: Offline-first operation where technically possible
  - INV-010: Surveillance Storage is distinct from Personal Media Library Storage
  - INV-011: MediaHub directly records supported surveillance streams
  - INV-012: Unified device model
  - INV-013: Unified media model
  - INV-014: User works with device/function/room/scene/automation, not protocols
  - INV-015: Home Assistant is internal and its UI is not user-facing
  - INV-016: MediaHub is the sole user-facing Smart Home model
  - INV-017: Local MediaHub Cluster appears as one coordinated system
  - INV-018: Product variants preserve functional differences
  - INV-019: Deferred does not mean rejected
  - INV-020: Physical connection does not grant authorization
  - INV-021: Security is system-level and cross-cutting
  - INV-022: Health is observation-only
  - INV-023: Readiness is operation-scoped
  - INV-024: Health, Readiness, Liveness, Trust and Authorization remain distinct
  - INV-025: Internal storage/processing/routing topology is hidden from ordinary users
  - INV-026: Historical evidence is preserved; no silent deletion/reinterpretation
  - INV-027: Canonical function is unique; cross-domain relationships do not create duplicate functions
  - INV-028: Engineering/Professional contour is distinct from ordinary-user UI
  - INV-029: Cloud Development Cluster is distinct from Local MediaHub Cluster
  - INV-030: Surveillance recording does not require a separate NVR where MediaHub can provide the function
  - INV-031: AI execution tier selection is policy-controlled and never creates mutation authority
  - INV-032: Local AI remains functional without mandatory cloud availability
  - INV-033: Local MediaHub Cluster and Cloud Development Cluster have separate trust/control planes
  - INV-034: iPhone/iPad clients are governed endpoints and cannot bypass State Authority
  - INV-035: User-created iPad dashboards bind to MediaHub capabilities, not direct device authority

  - INV-036: Functional Baseline 1.0 is the normative single source of truth
  - INV-037: Conflicting specification artifacts are blocked until reconciliation
  - INV-038: Capability and contract registries are subordinate to the Functional Baseline
  - INV-039: Architecture artifacts cannot redefine baseline authority boundaries
  - INV-040: Baseline changes require a new version and governance review
  - INV-041: Release remains locked until all qualification gates pass
  - INV-042: Production remains unauthorized until explicit production authorization
  - INV-043: Autonomous agents cannot self-qualify or authorize release/production
  - INV-044: Mobile Access Layer contains exactly two applications and is not an AI tier
  - INV-045: AI escalation order is Mobile Access Layer → Local AI → Local Cluster AI → Cloud Development AI
  - INV-046: MediaHub State Authority remains sole platform authority
  - INV-047: Home Assistant Core remains sole Smart Home authority
  - INV-048: Cloud Development Environment is corporate engineering infrastructure, not ordinary-user cloud
