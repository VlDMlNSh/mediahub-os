schema_version: 1
policy: exact-version-or-digest-before-activation

# Only upstream release facts independently verified in the current research pass
# are recorded as concrete pins. Other components remain qualification-pending;
# inventing versions would weaken provenance integrity.
verified_release_anchors:
  - id: home-assistant-core
    version: 2026.9.1
    upstream: https://github.com/home-assistant/core
    status: target-gated
    authority: smart-home-domain-only
    verification: upstream-release
  - id: postgresql
    version: 18.6
    upstream: https://www.postgresql.org/
    status: target-gated
    authority: mediahub-owned-persistence
    verification: upstream-release

qualification_pending_pins:
  - pgvector
  - ifcopenshell
  - web-ifc
  - paddleocr
  - opencv
  - onnxruntime
  - llama-cpp
  - opentelemetry
  - prometheus
  - cosign
  - syft
  - trivy
  - restic
  - rauc
  - sops
  - age
  - protobuf
  - grpc
  - ffmpeg
  - nats-jetstream
  - etcd
  - openbao
  - s3-compatible-object-storage

activation_requirements:
  - exact-version-or-immutable-digest
  - upstream-provenance
  - license-record
  - sbom
  - vulnerability-report
  - MediaHub-adapter
  - functional-tests
  - negative-tests
  - degraded-recovery-tests
  - rollback-tests
  - independent-review
