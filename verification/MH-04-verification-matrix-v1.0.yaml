schema_version: "1.0"
status: PROPOSED
contract: CTR-001
architecture_gate: MH-04
implementation_authorization: BLOCKED
purpose: >-
  Machine-readable verification matrix for the canonical State Authority.
  This artifact defines executable verification surfaces without implementing
  or authorizing a production State Authority.

result_semantics:
  NOT_VERIFIED: test not executed or evidence incomplete
  TESTED: executed with reproducible command and captured actual result
  QUALIFIED: tested result reviewed against qualification criteria
  BLOCKED: execution prohibited by an unresolved prerequisite

common_evidence:
  required:
    - test_id
    - contract
    - git_sha
    - branch
    - environment
    - command
    - input
    - expected
    - actual
    - pre_state
    - post_state
    - correlation_id
    - evidence_reference
    - result

cases:
  - id: V-01
    name: command_identity_authorization
    class: positive_negative
    expected_property: unauthorized_or_unattributable_mutation_is_rejected
    dependencies: [CTR-001, security_core, identity]
    status: NOT_VERIFIED
  - id: V-02
    name: boundary_enforcement
    class: negative
    consumers: [ui, ai, cloud, plugin, device, automation, telemetry, health_readiness, cache, persistence, recovery]
    expected_property: no_consumer_directly_mutates_canonical_state
    dependencies: [CTR-001, P0-05]
    status: NOT_VERIFIED
  - id: V-03
    name: state_transition_correctness
    class: positive_negative
    expected_property: legal_transition_applies_once_and_illegal_transition_is_non_mutating
    dependencies: [CTR-001]
    status: NOT_VERIFIED
  - id: V-04
    name: stale_command_rejection
    class: negative
    expected_property: stale_command_cannot_overwrite_newer_canonical_state
    dependencies: [CTR-001]
    status: NOT_VERIFIED
  - id: V-05
    name: concurrent_command_determinism
    class: concurrency
    expected_property: conflict_and_ordering_behavior_is_deterministic
    dependencies: [CTR-001]
    status: NOT_VERIFIED
  - id: V-06
    name: idempotent_retry
    class: retry
    expected_property: duplicate_retry_does_not_create_unintended_transition
    dependencies: [CTR-001]
    status: NOT_VERIFIED
  - id: V-07
    name: event_causality
    class: trace
    expected_property: event_is_fact_after_canonical_mutation_and_traceable_to_command
    dependencies: [CTR-001]
    status: NOT_VERIFIED
  - id: V-08
    name: event_reentry
    class: negative_positive
    expected_property: event_driven_mutation_reenters_governed_command_path
    dependencies: [CTR-001, event_core]
    status: NOT_VERIFIED
  - id: V-09
    name: failure_partial_failure
    class: fault_injection
    expected_property: failure_cannot_silently_create_invalid_canonical_state
    dependencies: [CTR-001]
    status: NOT_VERIFIED
  - id: V-10
    name: state_authority_unavailable
    class: degraded_mode
    expected_property: mutation_stops_without_shadow_authority
    dependencies: [CTR-001, P0-04]
    status: NOT_VERIFIED
  - id: V-11
    name: restart_recovery
    class: recovery
    expected_property: lifecycle_reestablishes_without_shadow_authority
    dependencies: [CTR-001, recovery_core, lifecycle_core]
    status: NOT_VERIFIED
  - id: V-12
    name: offline_first
    class: resilience
    expected_property: local_deterministic_semantics_do_not_require_cloud_or_internet
    dependencies: [CTR-001, INV-008, INV-009]
    status: NOT_VERIFIED
  - id: V-13
    name: persistence_boundary
    class: negative
    expected_property: no_physical_persistence_component_is_hidden_canonical_authority
    dependencies: [CTR-001, P0-04]
    status: BLOCKED
    blocking_reason: physical_persistence_not_authorized_by_current_foundation
  - id: V-14
    name: security_negative_suite
    class: adversarial
    expected_property: authority_and_authentication_boundaries_fail_closed
    dependencies: [CTR-001, security_core]
    status: NOT_VERIFIED
  - id: V-15
    name: evidence_integrity
    class: evidence
    expected_property: evidence_is_attributable_observational_and_non_mutating
    dependencies: [CTR-001, verification]
    status: NOT_VERIFIED

prohibited_shortcuts:
  - database_as_canonical_authority
  - cache_as_canonical_authority
  - cloud_as_canonical_authority
  - ai_as_canonical_authority
  - event_direct_to_state
  - telemetry_direct_to_state
  - recovery_direct_to_state

qualification_prerequisites:
  - master_architecture_accepted
  - mh03_accepted
  - mh04_contract_accepted
  - implementation_authorization_explicitly_recorded
  - reproducible_test_environment
  - security_red_team_review
