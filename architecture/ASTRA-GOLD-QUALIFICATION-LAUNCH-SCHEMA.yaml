schema: mediahub.astra-gold.qualification-launch.v1
status: CANONICAL_QUALIFICATION_AND_LAUNCH_GATE
version: 1.1
date: 2026-10-02
system: ASTRA_GOLD
authority:
  final: HUMAN
  coordination: A0-ASTRA
  architecture: A1
  implementation: A2
  independent_verification: A3
  executor_authority: EXECUTOR_ONLY
  state_authority: A0-ASTRA # ASTRA internal queue/claim/gate state only; NOT MediaHub Product State Authority.
principles:
  fresh_evidence_required: true
  historical_evidence_reuse: false
  fail_closed: true
  credentials_in_repository: false
  secrets_in_evidence: false
  self_qualification: false
  self_promotion: false
  launch_without_a3: false
  launch_without_recovery: false
  launch_without_soak: false
lifecycle:
  - DISCOVER
  - PREFLIGHT
  - ADMIT
  - QUALIFY
  - EXECUTE
  - VERIFY
  - INTEGRATE
  - RECONCILE
  - PRE_SOAK
  - SOAK_24H
  - LAUNCH_READY
  - LAUNCHED
  - BLOCKED
  - ROLLBACK
gates:
  G0_IDENTITY:
    required: [node_identity, executor_identity, provider_or_model_identity, repository_identity, exact_source_sha, clean_worktree]
    failure: BLOCKED
  G1_BOUNDARY:
    required: [authority_boundary, transport_boundary, state_authority_boundary, credential_boundary, isolated_workspace]
    failure: BLOCKED
  G2_CONTROL_PLANE:
    required: [command_contract, claim_lease, queue_progress, duplicate_suppression, result_publication, heartbeat]
    failure: BLOCKED
  G3_EXECUTION_PATH:
    required: [executable_or_runtime_identity, timeout_enforcement, nonzero_exit_handling, malformed_result_rejection, success_marker, result_schema_validation]
    failure: BLOCKED
  G4_23_WAVE_QUALIFICATION:
    minimum_rounds_per_mandatory_path: 23
    mandatory_paths: [CODEX_FCC, CLAUDE_FCC, CODEX_OMNIROUTE, CLAUDE_OMNIROUTE, CLAUDE_CODE_DIRECT]
    per_round: [fresh_command_id, exact_sha, executor_identity, provider_or_transport_identity, isolated_workspace, exit_status, timeout, marker, result_validation]
    pass_rule: every_required_round_passes
    failure: BLOCKED
  G5_CONCURRENCY:
    max_parallel_autonomous_claims: 3
    disjoint_claims_required: true
    shared_surfaces_serialized: true
    duplicate_controller_rejected: true
    failure: BLOCKED
  G6_RECOVERY:
    required_scenarios: [timeout, executor_failure, transport_interruption, stale_claim, worker_restart, duplicate_controller, replay_idempotency, result_publication_recovery]
    pass_rule: every_required_scenario_passes
    failure: BLOCKED
  G7_INTEGRATED_A3:
    verifier: A3
    independence_required: true
    required: [focused_tests, regression, contracts, architecture_conformance, security, concurrency, failure, recovery, exact_sha_evidence]
    failure: BLOCKED
  G8_PRE_SOAK:
    required: [all_mandatory_paths_pass, all_recovery_scenarios_pass, a3_pass, clean_worktree, fresh_evidence_bundle]
    failure: BLOCKED
  G9_24H_SOAK:
    duration_hours: 24
    required: [continuous_heartbeat, no_unexplained_controller_restart, no_duplicate_claim_corruption, no_unresolved_execution_failure, evidence_integrity, no_authority_boundary_violation]
    pass_rule: all_required_conditions_hold_for_full_duration
    failure: ROLLBACK_OR_REQUALIFY
  G10_LAUNCH_READY:
    requires: [G0_IDENTITY, G1_BOUNDARY, G2_CONTROL_PLANE, G3_EXECUTION_PATH, G4_23_WAVE_QUALIFICATION, G5_CONCURRENCY, G6_RECOVERY, G7_INTEGRATED_A3, G8_PRE_SOAK, G9_24H_SOAK]
    output: LAUNCH_READY
    failure: BLOCKED
  G11_LAUNCH:
    human_authorization_required: true
    requires: [LAUNCH_READY, release_sha, release_evidence_bundle, rollback_target]
    output: LAUNCHED
    failure: ROLLBACK
candidate_review_inventory:
  status: REVIEW_AND_TEST_CANDIDATE_ONLY
  rule: registration_does_not_imply_qualification_or_launch
  candidates:
    - id: openopc
      category: autonomous_development_system
      source: https://github.com/HKUDS/OpenOPC
      status: NOT_PROVEN
    - id: sol-pi
      category: autonomous_development_or_coding_candidate
      source: user_supplied_identifier
      status: NOT_PROVEN
      identity_verification_required: true
    - id: colibri
      category: coding_or_agent_candidate
      source: user_supplied_identifier
      status: NOT_PROVEN
      identity_verification_required: true
    - id: webtool-deepseek
      category: web_tool_or_agent_candidate
      source: https://github.com/illegal-xd/WebTool-DeepSeek
      status: NOT_PROVEN
      identity_verification_required: true
    - id: deepseek-harness
      category: coding_harness
      source: user_supplied_identifier
      status: NOT_PROVEN
      identity_verification_required: true
    - id: stagewise
      category: coding_agent_or_development_tool
      source: user_supplied_identifier
      status: NOT_PROVEN
      identity_verification_required: true
    - id: minicpm-v-4.5-8b-1mk
      category: local_model_candidate
      source: user_supplied_identifier
      status: NOT_PROVEN
      identity_verification_required: true
      exact_variant_required: true
    - id: free-coding-models
      category: free_model_discovery_and_benchmark_router
      source: https://github.com/vava-nessa/free-coding-models
      status: NOT_PROVEN
      role_boundary: discovery_and_routing_only
      no_executor_authority: true
      no_state_authority: true
      no_credential_creation: true
    - id: freellmapi
      category: local_model_gateway
      source: user_supplied_identifier
      status: NOT_PROVEN
      role_boundary: transport_and_gateway_only
      no_state_authority: true
      no_architecture_authority: true
    - id: unlazy
      category: developer_tool_or_agent_candidate
      source: user_supplied_identifier
      status: NOT_PROVEN
      identity_verification_required: true
    - id: naabu
      category: security_or_networking_tool_candidate
      source: user_supplied_identifier
      status: NOT_PROVEN
      role_boundary: bounded_non_authoritative_tool
      safety_review_required: true
    - id: codex-chatgpt-web
      category: browser_bridge_and_coding_harness
      source: https://github.com/miuuyy/codex-chatgpt-web
      status: NOT_PROVEN
      role_boundary: transport_or_harness_only
      no_state_authority: true
      no_credential_creation: true
      account_and_browser_session_security_review_required: true
  category_specific_controls:
    local_model:
      examples: [minicpm-v-4.5-8b-1mk]
      required_additional:
        - exact_model_variant
        - weight_or_checkpoint_provenance
        - runtime_backend_identity
        - memory_profile
        - multimodal_probe_when_supported
        - inference_isolation
    gateway_or_router:
      examples: [freellmapi, free-coding-models]
      required_additional:
        - upstream_provider_inventory
        - routing_policy_transparency
        - credential_isolation
        - failover_behavior
        - provider_identity_preservation
        - no_hidden_state_authority
    browser_bridge:
      examples: [webtool-deepseek, codex-chatgpt-web]
      required_additional:
        - browser_session_isolation
        - cookie_token_boundary
        - tool_permission_boundary
        - prompt_injection_resistance
        - account_session_recovery
    coding_harness_or_ide:
      examples: [deepseek-harness, stagewise, sol-pi]
      required_additional:
        - plugin_or_extension_boundary
        - workspace_isolation
        - tool_execution_allowlist
        - subprocess_boundary
        - review_rework_integrity
    security_tool:
      examples: [naabu]
      required_additional:
        - explicit_target_scope
        - dry_run_or_safe_probe
        - network_permission_boundary
        - rate_limit_control
        - audit_log
        - destructive_action_absence
    unresolved_identity:
      examples: [colibri, unlazy]
      rule: no_runtime_admission_until_exact_upstream_identity_is_resolved

  admission:
    all_candidates_require:
      - exact_source_identity
      - exact_commit_or_release
      - provenance
      - dependency_integrity
      - runtime_identity
      - sandbox_boundary
      - non_mutating_probe
      - bounded_task_probe
      - result_validation
      - failure_recovery
      - concurrency_isolation
      - independent_a3
    minimum_fresh_rounds: 23
    fresh_evidence_only: true
    no_implicit_promotion: true
    no_self_qualification: true
    launch_requires_existing_astrogold_gates: true

candidate_component_admission:
  autonomous_development_system:
    placement: CANDIDATE_EXECUTION_SURFACE
    authority: none
    may_be_selected_for_astrogold: true
    qualification_does_not_change_a0_a3_boundaries: true
    required:
      - source_repository_identity
      - exact_source_sha
      - version_or_commit_integrity
      - runtime_identity
      - dependency_lock_or_environment_fingerprint
      - credential_boundary
      - provider_boundary
      - workspace_sandbox
      - non_mutating_probe
      - task_decomposition_probe
      - bounded_execution_probe
      - result_validation
      - failure_recovery
      - replay_idempotency
      - concurrency_boundary
      - audit_evidence
      - independent_a3_verification
    openopc:
      source: https://github.com/HKUDS/OpenOPC
      qualification: NOT_PROVEN
      authority: none
      provider_selection: false
      credential_creation: false
      state_authority: false
      architecture_authority: false
      self_promotion: false
      self_qualification: false
      security_attention:
        versioned_release_required_for_gold: true
        reproducible_source_identity_required: true
        dependency_provenance_required: true
        public_security_policy_present_but_runtime_security_still_unverified: true
      functional_probes:
        - native_task_mode
        - company_mode
        - task_state_machine
        - dependency_dag
        - delegation
        - review_and_rework
        - blocker_escalation_to_human
        - execution_trace_integrity
        - memory_or_learning_boundary
        - external_agent_adapter_boundary
        - stop_cancel_resume
        - malformed_result_rejection
        - timeout_handling
        - worker_restart_recovery
        - duplicate_controller_rejection
      qualification_rounds:
        minimum: 23
        fresh_evidence_per_round: true
        isolated_workspace_per_round: true
      admission: runtime_and_security_evidence_required

component_specific_admission:
  local_model:
    placement: LOCAL_MODEL_FABRIC
    model_is_not_executor: true
    model_is_not_authority: true
    required: [model_id, exact_variant, weight_provenance, runtime_identity, local_resource_profile, non_mutating_probe, capability_probes, latency_memory_measurement, failure_recovery, isolated_task_execution, result_validation, A3_verification]
  candidate_desktop_agent:
    placement: CANDIDATE_EXECUTION_SURFACE
    agent_is_not_authority: true
    required: [identity_provenance, version_integrity, sandbox_boundary, non_mutating_probe, isolated_workspace_execution, result_validation, recovery, A3_verification]
launch_contract:
  decision: HUMAN_ONLY
  required_inputs: [approved_source_sha, launch_target, fresh_evidence_bundle, A3_verification_record, soak_record, rollback_target]
  prohibited: [executor_self_promotion, provider_self_promotion, model_self_promotion, stale_evidence_promotion, missing_a3_promotion]
evidence_bundle:
  required_metadata: [command_id, node_id, component_id, executor_id, provider_or_model_id, source_sha, round, timestamp, exit_status, timeout, workspace, verification_status, evidence_digest]
  secret_policy:
    secret_values: SUPPRESSED
    authorization_tokens: SUPPRESSED
    raw_provider_responses: REDACTED
promotion:
  states: [REGISTERED, CREDENTIAL_PRESENT, AUTH_SUCCESS, MODEL_DISCOVERY_PASS, PROBE_PASS, EXECUTION_PASS, A3_VERIFIED, ASTRA_GOLD_ELIGIBLE, LAUNCH_READY, LAUNCHED]
  no_implicit_transitions: true
