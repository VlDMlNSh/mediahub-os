schema: mediahub.astra-gold.autonomous-development.v1
reference_architecture: architecture/ASTRA-GOLD-REFERENCE-ARCHITECTURE.md
qualification_contract: architecture/ASTRA-GOLD-QUALIFICATION-LAUNCH-SCHEMA.yaml
contract_alignment: CANONICAL_SEMANTIC_ALIGNMENT
status: QUALIFICATION_READY_HYBRID_FABRIC
hardware_topology:
  status: TARGET_PLAN_NOT_YET_COMMISSIONED
  plan_date: 2026-10-12
  current_test_lab:
    linux_test_nodes: [mh-dev-01, mh-dev-02]
    mediahub_prototype: Voktors-Mac-mini.local
    note: Existing machines are test equipment and do not define final deployment hardware.
  target_developer_hosts:
    - id: mac-pro-dev
      hardware: purchased Mac Pro, exact generation/specifications pending acquisition
      role: primary MediaHub target and developer host 1
    - id: mac-mini-2011-linux-dev
      hardware: Mac mini Mid-2011 running Linux; planned 16 GB RAM, verify on receipt
      role: developer host 2 and Linux executor
  prototype:
    id: Voktors-Mac-mini.local
    hardware: Mac mini M2, 8 GB RAM
    role: first working MediaHub product prototype; not a permanent developer lane
  future_compute:
    - id: gpu-video-server
      role: optional future model inference and media/video compute pool
      status: FUTURE_NOT_DEPLOYED
  commissioning_requirements:
    - record_exact_hardware_and_os
    - verify_mac_mini_2011_ram_storage_linux_network_and_firmware
    - remap_queue_registry_tasks_workflows_and_topology_tests
    - set_initial_concurrency_to_two_physical_development_hosts
    - allow_additional_logical_lanes_only_after_isolation_and_capacity_tests
    - keep_m2_prototype_out_of_permanent_astra_developer_pool
version: 1.1
name: ASTRA_GOLD
definition: "Unified distributed autonomous hybrid development system for MediaHub"
authority:
  human:
    role: final_architecture_production_security_authority
  astra:
    id: A0-ASTRA
    role: single_coordination_authority
  architect:
    id: A1
    role: architecture_contracts
  builder:
    id: A2
    role: bounded_implementation
  verifier:
    id: A3
    role: independent_verification
  executors:
    authority: executor_only
    clients: [codex, claude_code]
    local_tooling: [codex, claude-code, cursor, deepseek-harness, stagewise]
    local_gateways: [freellmapi]
    local_models: [ollama, kimi-k3-in-c]
  transports:
    authority: transport_only
    values: [github, fcc, omniroute]
  cloud_fabric:
    authority: none
    admission: runtime_evidence_required
    registered_agents: [gemini, perplexity, kimi, deepseek, chatgpt, openrouter, unorouter, claude, gigachat]
    rule: registration_or_credential_reference_never_implies_authorization
  ecc:
    authority: none
    role: auxiliary_support
layers:
  coordination:
    - astra
    - mission_decomposition
    - scheduling
    - claims
    - conflict_detection
    - integration
    - architecture_reconciliation
    - evidence_reconciliation
    - qualification_gate_reconciliation
  role_fabric:
    - architect
    - builder
    - verifier
    - dynamic_task_scoped_workers
  controller:
    - command_ingestion
    - queue
    - claim_leases
    - heartbeat
    - liveness
    - duplicate_suppression
    - restart_recovery
    - result_publication
  hybrid_provider_fabric:
    direct_cloud: [gemini, perplexity, kimi, deepseek, chatgpt, openai, gigachat, siliconflow, novita, zai, llm7, sambanova, aionlabs, cloudflare, groq, mistral, huggingface]
    cloud_gateways: [openrouter, unorouter, zerouter, nararouter, orcarouter, claude]
    local_gateways: [freellmapi]
    local_tooling: [codex, claude-code, cursor, deepseek-harness, stagewise]
    local_models: [ollama, kimi-k3-in-c]
    auxiliary: [ecc, delx-memory-bun]
    candidate_desktop_agents: [openflux]
    candidate_autonomous_systems: [openopc]
    local_model_candidates: [gemma-4]
    admission_sequence: [credential_presence, auth_success, model_discovery, non_mutating_probe, task_execution, result_validation, independent_a3]
    local_model_candidate_policy:
      gemma-4:
        authority: none
        role: local_model_family_candidate
        executor_authority: false
        provider_selection: false
        credential_creation: false
        state_authority: false
        qualification: NOT_PROVEN
        evaluation_variants: [E2B, E4B, 12B, 26B_MoE, 31B_Dense]
        admission: model_specific_runtime_evidence_required
    candidate_autonomous_system_policy:
      openopc:
        authority: none
        provider_selection: false
        credential_creation: false
        state_authority: false
        architecture_authority: false
        qualification: NOT_PROVEN
        role: candidate_autonomous_development_system_execution_surface
        source: https://github.com/HKUDS/OpenOPC
        admission: runtime_and_security_evidence_required
        no_self_promotion: true
        no_self_qualification: true
    candidate_desktop_agent_policy:
      openflux:
        authority: none
        provider_selection: false
        credential_creation: false
        state_authority: false
        qualification: NOT_PROVEN
        role: candidate_local_desktop_agent_execution_surface
        source: https://github.com/EDEAI/OpenFlux
  execution:
    mandatory_paths:
      - CODEX_FCC
      - CLAUDE_FCC
      - CODEX_OMNIROUTE
      - CLAUDE_OMNIROUTE
      - CLAUDE_CODE_DIRECT
    optional_future_paths:
      - CODEX_DIRECT
      - CLAUDE_DIRECT
  verification:
    - focused_tests
    - regression
    - contracts
    - architecture_conformance
    - security
    - concurrency
    - failure
    - recovery
    - independent_a3
  evidence:
    - command_id
    - executor_identity
    - provider_identity
    - source_sha
    - round
    - exit_status
    - timeout
    - marker
    - workspace
    - verification
  observability:
    - heartbeat
    - health
    - structured_logs
    - evidence_freshness
  recovery:
    - timeout
    - stale_claim
    - worker_restart
    - duplicate_controller
    - transport_interruption
    - replay_idempotency
execution_contract:
  mandatory_paths:
    - CODEX_FCC
    - CLAUDE_FCC
    - CODEX_OMNIROUTE
    - CLAUDE_OMNIROUTE
    - CLAUDE_CODE_DIRECT
  optional_future_paths:
    - CODEX_DIRECT
    - CLAUDE_DIRECT
execution:
  mandatory_paths:
    - CODEX_FCC
    - CLAUDE_FCC
    - CODEX_OMNIROUTE
    - CLAUDE_OMNIROUTE
    - CLAUDE_CODE_DIRECT
  optional_future_paths:
    - CODEX_DIRECT
    - CLAUDE_DIRECT
reconciliation:
  contract_version: 2
  required: true
  canonical_sources:
    - architecture/ASTRA-GOLD-REFERENCE-ARCHITECTURE.md
    - architecture/ASTRA-GOLD-QUALIFICATION-LAUNCH-SCHEMA.yaml
    - architecture/ASTRA-GOLD-UNIFIED-AUTONOMOUS-DEVELOPMENT-SYSTEM.yaml
  checks:
    - architecture_vs_implementation
    - registry_vs_runtime_identity
    - state_vs_evidence
    - tested_sha_vs_source_sha
    - provider_model_identity_vs_evidence
    - qualification_state_vs_gate_state
    - candidate_admission_vs_inventory
    - control_plane_vs_worker_state
    - evidence_completeness
  failure_state: RECONCILIATION_REQUIRED
  admission_rule: any_drift_or_ambiguity_blocks
qualification:
  mode: whole_system
  rounds_minimum: 23
  concurrency:
    max_parallel: 3
    require_disjoint_claims: true
    shared_surfaces: serialized
  fresh_evidence_required: true
  historical_evidence_reuse: false
  fail_closed: true
  gates:
    - identity
    - hybrid_provider_fabric_authentication
    - hybrid_provider_model_discovery
    - hybrid_provider_non_mutating_probe
    - auxiliary_fabric_boundary
    - control_plane
    - executor_fabric
    - twenty_three_wave
    - concurrency
    - recovery
    - integrated_a3
    - pre_soak
    - soak_24h
    - gold_active
  gate_contract: [G0_IDENTITY, G1_BOUNDARY, G2_CONTROL_PLANE, G3_EXECUTION_PATH, G4_23_WAVE_QUALIFICATION, G5_CONCURRENCY, G6_RECOVERY, G7_INTEGRATED_A3, G8_PRE_SOAK, G9_24H_SOAK, G10_LAUNCH_READY, G11_LAUNCH]
states:
  - DESIGNED
  - PREFLIGHT
  - ADMITTED
  - QUALIFICATION
  - EXECUTION
  - VERIFICATION
  - INTEGRATION
  - RECONCILIATION
  - SOAK
  - GOLD_ACTIVE
  - BLOCKED
  - FAILED
  - RECONCILIATION_REQUIRED
rules:
  credentials_in_git: false
  credential_values_in_evidence: false
  quota_bypass: false
  executor_architecture_authority: false
  cloud_state_authority: false
  provider_authority: false
  registration_implies_authorization: false
  transport_state_authority: false
  ecc_provider_selection: false
  ecc_credential_creation: false
  ecc_state_authority: false
  ecc_architecture_authority: false
  a2_self_verification: false
  destructive_actions_without_human_authorization: false
  missing_or_contradictory_evidence_blocks: true
  gold_active_requires_human_launch: true
  evidence_is_immutable: true
cloud_executor_fabric:
  authority: none
  admission: runtime_evidence_required
  rule: cloud_executors_are_an_admitted_extension_not_a_new_authority_plane
  status: NOT_PROVEN
  mandatory_paths_unchanged: true
  promotion_requires_fresh_rounds: 23
  gateway_is_not_native_provider: true
  provider_identity_preserved: true
  candidate_paths:
    - {id: GEMINI_DIRECT, provider: gemini}
    - {id: PERPLEXITY_DIRECT, provider: perplexity}
    - {id: KIMI_DIRECT, provider: kimi}
    - {id: DEEPSEEK_DIRECT, provider: deepseek}
    - {id: OPENAI_DIRECT, provider: chatgpt}
    - {id: ANTHROPIC_DIRECT, provider: claude}
    - {id: GIGACHAT_DIRECT, provider: gigachat}
    - {id: OPENROUTER_GATEWAY, provider: openrouter}
  qualification_gates_reference: architecture/ASTRA-GOLD-GOVERNANCE-CONTRACT.yaml
